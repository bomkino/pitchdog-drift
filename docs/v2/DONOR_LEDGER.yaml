schema_version: 1
ledger_state: phase-0-scaffold
updated: "2026-08-22"

authority:
  source_manifest: docs/mega-main/SOURCE_MANIFEST.yaml
  curated_plan: Handover/DRIFT_V2_CURATED_DONOR_INTEGRATION_PLAN_2026-08-22.md
  donor_source_review_performed: false
  source_files_studied: []
  scope_note: >-
    This scaffold records pinned identities and planned dispositions from the two
    authority documents above. It does not claim that any donor source file was
    inspected, any capability was ported, or any parity evidence exists.

status_contract:
  allowed_current_status: frozen-not-ported
  meaning: >-
    Exact donor identity is frozen in the source manifest. Donor implementation
    remains unstudied and no V2 product behavior is attributed to it yet.
  graduation_requirements:
    - Record exact donor source files studied.
    - Re-author accepted semantics behind Project V4 and canonical V2 interfaces.
    - Record tests ported or re-authored.
    - Attach visual, listening, browser, or native parity evidence as applicable.
    - Record intentional differences and rejected debris.
    - Never merge or cherry-pick a whole creative donor branch.

global_rejections:
  - Whole donor branches, application shells, renderers, exporters, or project models.
  - Temporary transport pull requests and encoded payload fragments.
  - Self-mutating or source-generating workflows.
  - Branch-repair machinery when only its output is relevant evidence.
  - Generated builds and evidence artifacts as product source.
  - Competing clocks, render graphs, event spines, output transforms, or native authorities.

