name: Native checked source integration (temporary)
on:
  push:
    branches: [codex/drift-native-completion]
    paths: [.github/workflows/native-source-relay.yml]
permissions:
  contents: write
  actions: write
jobs:
  checked-source:
    if: github.repository == 'bomkino/pitchdog-drift' && github.ref == 'refs/heads/codex/drift-native-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Apply the checked source without overwriting newer work
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64, hashlib, lzma, os, pathlib, subprocess
          repo="bomkino/pitchdog-drift"
          branch="codex/drift-native-completion"
          bridge=".github/workflows/native-source-relay.yml"
          base="416ec684608b629ef22d16c1f050d66cc153e086"
          expected="01498884e6d597d47ef575167608ceedb292dce9"
          def run(*args):
              return subprocess.check_output(args,text=True).strip()
          assert os.environ["GITHUB_REPOSITORY"]==repo
          assert os.environ["GITHUB_REF"]=="refs/heads/"+branch
          head=run("git","rev-parse","HEAD")
          assert head==os.environ["GITHUB_SHA"]
          assert run("git","rev-parse","HEAD^")==base, "Newer work appeared; do not replay."
          assert run("git","diff","--name-only",base,"HEAD")==bridge
          assert not run("git","status","--porcelain")
          assert run("git","ls-remote","origin","refs/heads/"+branch).split()[0]==head
          patch=lzma.decompress(base64.b64decode(""""""))
          assert len(patch)==46723
          assert hashlib.sha256(patch).hexdigest()=="5c36fb6963edb1245a566cdd115826b3559e2230c7e4ae5e2e81690b155047a3"
          file=pathlib.Path(os.environ["RUNNER_TEMP"])/"drift-checked.patch"
          file.write_bytes(patch)
          subprocess.run(["git","apply","--unidiff-zero","--check",str(file)],check=True)
          subprocess.run(["git","apply","--unidiff-zero","--index",str(file)],check=True)
          paths=run("git","diff","--cached","--name-only").splitlines()
          assert paths and all(p.startswith(("macos/NativeCore/Sources/","macos/NativeCore/Tests/")) for p in paths)
          subprocess.run(["git","diff","--cached","--check"],check=True)
          relay=run("git","rev-parse","HEAD:"+bridge)
          subprocess.run(["git","update-index","--force-remove",bridge],check=True)
          assert run("git","write-tree")==expected, "The source tree differs from the locally checked tree."
          subprocess.run(["git","update-index","--add","--cacheinfo","100644,"+relay+","+bridge],check=True)
          subprocess.run(["git","-c","user.name=pitch.dog","-c","user.email=111725271+bomkino@users.noreply.github.com","commit","-m","fix(native): finish stable creative audition, audio continuity and source demand","-m","Preserve the passing 416ec68 document/media/output journey. Add render-only Look A/B audition, authored motion consumers, Closing-only hold, crop/perspective decode demand, captured edit targets, timeline layout and audio queue lifetime. Local 15 core tests and Swift parsing passed; exact-head Mac gates remain required."],check=True)
          assert run("git","ls-remote","origin","refs/heads/"+branch).split()[0]==head, "Newer remote work was preserved."
          subprocess.run(["git","push","origin","HEAD:refs/heads/"+branch],check=True)
          print("SOURCE_COMMIT="+run("git","rev-parse","HEAD"))
          print("VERIFIED_SOURCE_TREE_WITHOUT_RELAY="+expected)
          for workflow in [351261429,351634268,351671730]:
              subprocess.run(["gh","api","--method","POST",f"repos/{repo}/actions/workflows/{workflow}/dispatches","-f","ref="+branch],check=True)
