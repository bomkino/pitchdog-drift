name: Fix export-memory delivery hook

on:
  push:
    branches: [gauntlet/directors-cut-optical-pipeline]

permissions:
  contents: write

concurrency:
  group: fix-export-memory-hook
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/directors-cut-optical-pipeline
          fetch-depth: 0

      - name: Correct extended-regex wait and remove this hook
        shell: python
        run: |
          from pathlib import Path
          path = Path(".github/workflows/harden-export-memory.yml")
          source = path.read_text()
          old = '&& grep -q "initialize|setup|start" <<< "$SURFACE"; then'
          new = '&& grep -Eq "initialize|setup|start" <<< "$SURFACE"; then'
          if old not in source:
              raise SystemExit("Expected export-memory workflow anchor was not found.")
          path.write_text(source.replace(old, new))
          Path(".github/workflows/fix-export-memory-hook.yml").unlink()

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "chore: correct export-memory delivery gate"
          git push origin HEAD:gauntlet/directors-cut-optical-pipeline
