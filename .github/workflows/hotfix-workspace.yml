name: Portrait hotfix workspace
on:
  push:
    branches: [fix/portrait-slide-geometry]
    paths: [.github/workflows/hotfix-workspace.yml]
permissions:
  contents: write
concurrency:
  group: portrait-hotfix-application
  cancel-in-progress: false
jobs:
  apply:
    if: github.ref == 'refs/heads/fix/portrait-slide-geometry'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Require the exact staged parent
        run: test "$(git rev-parse HEAD^)" = a34f64d13e85333d3150648c181b05fbe11f1f83
      - name: Apply readable edits and verify the locally tested file identities
        run: |
          set -euo pipefail
          python3 .github/portrait-edit.py
          python3 .github/portrait-finish.py
          sha256sum -c <<'HASHES'
          5b60574991aa0e57254ede753c575eca38f46e08b97c124e6d58b8f2de06a2f5  .github/workflows/source-release.yml
          2137e76f6df8be9315a1b15bd68aac7a7cd04972dfc64c8a6b534209e1b9ed0a  CHANGELOG.md
          de5164b367b29c092c092e4177615e4f65f0a691a923606e4782d13b845a9827  README.md
          9cae8d4eafa26947e9a3cee356d3d1be722b09bda9d044f73cd816a8662052fc  docs/MACOS_USER_GUIDE.md
          2c7df69a0f663ac181ce96ce6556746739e43452d6e48e3c092497696f413d7a  docs/STATUS.md
          6a32a701fefb812a1d6b76c75fe561effa06003eb8a3497c8bd79b36f1c5a07d  macos/AcceptanceUI/NativeJourneyUITests.swift
          040bde25ed0d3446614ae30e224d1ccd306e53736618b02c162e5cbcf2bddca4  macos/NativeCore/Sources/DriftApplication/EditorAcceptance.swift
          e90198fca625e4d870a65df31e160e37c80794ab25a6c4b0ba98ced0677be996  macos/NativeCore/Sources/DriftApplication/NativeApplicationProof.swift
          8bd1a47cee3e756d880e378c2222bcab34cdf2a7f82a9f12b406017c0bb033ab  macos/NativeCore/Sources/DriftApplication/SlideInspector.swift
          62845a03c483ebc4db4e810b3687f13d89bfbbe4695b41113de8f30be43f7ba0  macos/NativeCore/Sources/DriftApplication/StudioView.swift
          8d541b7f0196af2586f4735e3faca3d91a9abef4d83c0f4ee12fed6082cc403a  macos/NativeCore/Sources/DriftCore/ExactGeometry.swift
          2eb6ec0856ab6f2bf387b70ba2f91afd44f4ad9eb9f17c7e5fe1bf5b203d6a87  macos/NativeCore/Sources/DriftCore/FramePlan.swift
          5239b62214c64201e3efb88609f74040546962fa6d30a2807ebb60c5ba0a8be7  macos/NativeCore/Sources/DriftCore/Project.swift
          ee94d96010f5a74abbcbb5d058e395a1b769489f79cf8cf4bf6030fbfa3451d0  macos/NativeCore/Sources/DriftCore/SlideTrackLayout.swift
          2cf17dac37627e9f85359393edd181ae544fe2b30c15bce050ab887b7f69cadb  macos/NativeCore/Sources/DriftNative/EditorSession.swift
          02ae8889359eaafce9a5b14266a24975dc5257f73b78182a6148f6158d543eaa  macos/NativeCore/Tests/DriftCoreTests/PortraitGeometryTests.swift
          bf74d14b37e18e1260d7d3c8eb34334bdca7f92e15c41beaee1feaca4fa9b117  macos/NativeCore/Tests/DriftNativeTests/CustomFrameTransactionTests.swift
          3631a0b5c7b78d226fb0bdf1aabc104979b5e087d138e4cf5f9eccbcff55795c  package-lock.json
          20a3029895efc82a662c0e19630b13c3422060d23210b7eb0348be4ba21980cf  package.json
          678f99dce0334e4feb6226186c7ac40aeaa06faf48619d66ce7a7b6d6d37a172  scripts/generate-native-catalog.mjs
          HASHES
          # Workflow changes are performed separately through the authorized connector.
          git restore .github/workflows/source-release.yml
          git rm .github/portrait-edit.py .github/portrait-finish.py .github/portrait-patch-1.b64
          git add --all
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: independent portrait output and actual slide train geometry'
          git push origin HEAD:fix/portrait-slide-geometry
