name: Harden director export boundary

on:
  push:
    branches: [gauntlet/directors-cut-optical-pipeline]

permissions:
  actions: write
  contents: write

concurrency:
  group: harden-director-export-boundary
  cancel-in-progress: false

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Cancel stale one-shot writers
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          names='Apply director command surface|Harden director command surface|Finalize creator-journey gauntlet|Finalize director PR handoff|Reconcile director product pass'
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?branch=gauntlet%2Fdirectors-cut-optical-pipeline&per_page=100" \
            --jq ".workflow_runs[] | select(.id != (${CURRENT_RUN}|tonumber)) | select(.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\") | select(.name | test(\"${names}\")) | .id" \
            | while read -r run_id; do gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true; done
          sleep 8

      - name: Check out latest branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/directors-cut-optical-pipeline
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Wait for reconciled source
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            git fetch origin gauntlet/directors-cut-optical-pipeline
            if git show origin/gauntlet/directors-cut-optical-pipeline:src/lib/directorCommands.ts 2>/dev/null | grep -q "aria-activedescendant"; then
              git reset --hard origin/gauntlet/directors-cut-optical-pipeline
              exit 0
            fi
            if [ "$attempt" -eq 120 ]; then echo "Reconciled command surface not found." >&2; exit 1; fi
            sleep 10
          done

      - name: Hide command surface during export
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/directorCommands.ts')
          text = path.read_text()

          old = '''            const open = (): void => {
              returnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : launcher;
              root.dataset.open = "true";
              launcher.setAttribute("aria-expanded", "true");
              render();
              requestAnimationFrame(() => search.focus());
            };
            const execute = (command: DirectorCommand): void => {'''
          new = '''            const open = (): void => {
              if (launcher.hidden) return;
              returnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : launcher;
              root.dataset.open = "true";
              launcher.setAttribute("aria-expanded", "true");
              render();
              requestAnimationFrame(() => search.focus());
            };
            const syncExportBoundary = (): void => {
              const exportActive = Array.from(document.querySelectorAll<HTMLElement>(
                ".export-overlay, [data-exporting='true'], [aria-label='Export progress']",
              )).some(visible);
              launcher.hidden = exportActive;
              if (exportActive && root.dataset.open === "true") close();
            };
            const exportObserver = new MutationObserver(syncExportBoundary);
            exportObserver.observe(document.body, {
              subtree: true,
              childList: true,
              attributes: true,
              attributeFilter: ["class", "hidden", "aria-hidden", "data-exporting"],
            });
            syncExportBoundary();
            const execute = (command: DirectorCommand): void => {'''
          if old not in text:
              raise SystemExit('Open-command anchor not found')
          text = text.replace(old, new)

          old = '''              if (openShortcut || (helpShortcut && !shouldIgnoreDirectorShortcut(event.target))) {
                event.preventDefault();
                root.dataset.open === "true" ? close() : open();
                return;
              }'''
          new = '''              if (openShortcut || (helpShortcut && !shouldIgnoreDirectorShortcut(event.target))) {
                if (launcher.hidden) return;
                event.preventDefault();
                root.dataset.open === "true" ? close() : open();
                return;
              }'''
          if old not in text:
              raise SystemExit('Shortcut boundary anchor not found')
          text = text.replace(old, new)

          old = '''              launcher.removeEventListener("click", onLauncherClick);
              search.removeEventListener("input", onInput);'''
          new = '''              exportObserver.disconnect();
              launcher.removeEventListener("click", onLauncherClick);
              search.removeEventListener("input", onInput);'''
          if old not in text:
              raise SystemExit('Observer cleanup anchor not found')
          text = text.replace(old, new)
          path.write_text(text)
          PY

          python - <<'PY'
          from pathlib import Path
          path = Path('e2e/directorCommands.e2e.ts')
          text = path.read_text()
          old = '''            await page.keyboard.press("Control+K");
            await expect(dialog).toBeVisible();
            await page.keyboard.press("Escape");
          });'''
          new = '''            await page.keyboard.press("Control+K");
            await expect(dialog).toBeVisible();
            await page.keyboard.press("Escape");

            await page.evaluate(() => {
              const overlay = document.createElement("div");
              overlay.className = "export-overlay";
              overlay.dataset.testExportOverlay = "true";
              overlay.style.cssText = "position:fixed;inset:0;display:block";
              document.body.append(overlay);
            });
            await expect(launcher).toBeHidden();
            await page.keyboard.press("Control+K");
            await expect(dialog).toBeHidden();
            await page.evaluate(() => document.querySelector("[data-test-export-overlay]")?.remove());
            await expect(launcher).toBeVisible();
          });'''
          if old not in text:
              raise SystemExit('Export-boundary e2e anchor not found')
          text = text.replace(old, new)
          path.write_text(text)
          PY

          if [ -f docs/CREATOR_JOURNEY.md ] && ! grep -q "command surface closes" docs/CREATOR_JOURNEY.md; then
            cat >> docs/CREATOR_JOURNEY.md <<'MD'

          ## Export boundary

          Director Commands closes and hides while an export overlay is active. Keyboard shortcuts are ignored until the export finishes or is cancelled. The directing layer cannot race the master-writing layer.
          MD
          fi

          find .github/workflows -maxdepth 1 -type f ! -name 'ci.yml' -delete

      - name: Install locked dependencies
        run: npm ci

      - name: Run unit and production gauntlet
        run: npm run check

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Run export-boundary regression
        run: npx playwright test e2e/directorCommands.e2e.ts

      - name: Commit verified boundary hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "fix: keep director commands outside active exports"
          git fetch origin gauntlet/directors-cut-optical-pipeline
          git rebase origin/gauntlet/directors-cut-optical-pipeline
          git push origin HEAD:gauntlet/directors-cut-optical-pipeline
