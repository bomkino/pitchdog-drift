name: Apply Director's Cut product pass

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: apply-director-pass2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/directors-cut-optical-pipeline
          fetch-depth: 0

      - name: Validate, apply, restore CI, and clean reviewed payload
        shell: bash
        run: |
          set -euo pipefail
          echo "Payload bytes: $(wc -c < .github/director-pass2-payload.tgz)"
          echo "Payload SHA-256: $(sha256sum .github/director-pass2-payload.tgz | cut -d' ' -f1)"
          tar -tzf .github/director-pass2-payload.tgz > /tmp/director-pass2-files.txt
          if grep -Eq '(^/|(^|/)\.\.(/|$))' /tmp/director-pass2-files.txt; then
            echo "Unsafe archive path detected" >&2
            exit 1
          fi
          tar -xzf .github/director-pass2-payload.tgz
          rm -f .github/director-pass2-payload.tgz
          rm -f .github/director-pass2-trigger
          rm -f .github/source-snapshot-trigger
          rm -f .github/workflows/source-snapshot-continued.yml
          rm -f .github/workflows/apply-director-pass2.yml
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "feat: complete director workflow and atmosphere atlas"
          git push origin HEAD:gauntlet/directors-cut-optical-pipeline
