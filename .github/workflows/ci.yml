name: CI

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: director-desk-v2-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  verify-and-publish-director-desk:
    if: github.event.pull_request.head.ref == 'gauntlet/directors-cut-optical-pipeline' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact proposal branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/directors-cut-optical-pipeline
          fetch-depth: 0

      - name: Reconstruct and verify sealed product archive
        shell: bash
        run: |
          set -euo pipefail
          payload_dir=.github/director-desk-payload-v2
          expected_bytes=73052
          expected_sha=63b9c56fed5d69a8bd37c88f3fe6164534325c8404160a10d84a255857036961

          test "$(find "$payload_dir" -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')" = "7"
          for index in 00 01 02 03 04 05 06; do
            test -s "$payload_dir/part-$index"
          done

          cat "$payload_dir"/part-{00,01,02,03,04,05,06} > /tmp/director-desk-product-v2.b64
          test "$(wc -c < /tmp/director-desk-product-v2.b64 | tr -d ' ')" = "$expected_bytes"
          base64 --decode /tmp/director-desk-product-v2.b64 > /tmp/director-desk-product-v2.tgz
          echo "$expected_sha  /tmp/director-desk-product-v2.tgz" | sha256sum --check --strict -

          cat > /tmp/director-desk-expected-manifest.txt <<'EOF'
          e2e/creatorJourney.e2e.ts
          src/App.tsx
          src/components/ControlPanel.tsx
          src/components/DirectorDesk.tsx
          src/components/MediaLibrary.tsx
          src/components/Stage.tsx
          src/components/controls.tsx
          src/direction.ts
          src/engine/CinematicCarousel.ts
          src/optics.ts
          src/settingsHistory.ts
          src/styles.css
          tests/creatorSurface.test.ts
          tests/direction.test.ts
          tests/optics.test.ts
          tests/settingsHistory.test.ts
          EOF
          sed -i 's/^          //' /tmp/director-desk-expected-manifest.txt
          tar -tzf /tmp/director-desk-product-v2.tgz | sort > /tmp/director-desk-actual-manifest.txt
          diff -u /tmp/director-desk-expected-manifest.txt /tmp/director-desk-actual-manifest.txt

          tar -xzf /tmp/director-desk-product-v2.tgz

          # Delete every delivery artifact before the product gate sees the tree.
          rm -rf .github/director-desk-payload-v2
          rm -rf .github/director-desk-payload
          rm -rf .github/director-cut-payload
          rm -f .github/director-desk-product.b64
          rm -f .github/audit-run-id.txt
          rm -f .github/workflows/apply-director-desk-v2.yml
          rm -f .github/workflows/apply-director-desk-manifest.yml
          rm -f .github/workflows/audit-snapshot.yml

          # Restore the ordinary CI workflow in the product commit.
          git show HEAD^:.github/workflows/ci.yml > .github/workflows/ci.yml

          test "$(find .github/workflows -maxdepth 1 -type f -printf '%f\n' | sort)" = "ci.yml"
          test ! -e .github/director-desk-payload-v2
          test ! -e .github/director-desk-payload
          test ! -e .github/director-cut-payload

      - name: Make held previews genuinely single-frame
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path("src/engine/CinematicCarousel.ts")
          source = path.read_text()
          old = """      if (!this.paused && !this.reducedMotionPreview) this.elapsed += delta;
                this.advanceMotion(delta);
                this.renderPreview();
                this.sampleFps(now);"""
          new = """      const shouldAnimate = !this.paused && !this.reducedMotionPreview;
                if (shouldAnimate) {
                  this.elapsed += delta;
                  this.advanceMotion(delta);
                  this.renderPreview();
                  this.sampleFps(now);
                }"""
          if old not in source:
              raise SystemExit("Expected held-preview render-loop anchor was not found")
          source = source.replace(old, new, 1)

          old = """    if (paused) this.motionVelocity = 0;
              this.syncPresenterPlayback();
              this.renderPreview();"""
          new = """    if (paused) {
                this.motionVelocity = 0;
                this.callbacks.onFrame?.(0);
              } else {
                this.fpsFrameCounter = 0;
                this.fpsSampleStarted = performance.now();
              }
              this.syncPresenterPlayback();
              this.renderPreview();"""
          if old not in source:
              raise SystemExit("Expected pause anchor was not found")
          source = source.replace(old, new, 1)

          old = """    if (reduced) this.motionVelocity = 0;
              this.renderPreview();"""
          new = """    if (reduced) {
                this.motionVelocity = 0;
                this.callbacks.onFrame?.(0);
              } else if (!this.paused) {
                this.fpsFrameCounter = 0;
                this.fpsSampleStarted = performance.now();
              }
              this.renderPreview();"""
          if old not in source:
              raise SystemExit("Expected reduced-motion anchor was not found")
          source = source.replace(old, new, 1)
          path.write_text(source)
          PY

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run strict product gate
        run: npm run check

      - name: Install hosted Chromium
        run: npx playwright install --with-deps chromium

      - name: Run full creator browser gauntlet
        env:
          CI: "1"
        run: npm run test:e2e

      - name: Preserve browser evidence on failure
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: director-desk-v3-browser-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish the verified product tree
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Verified archive produced no product changes." >&2
            exit 1
          fi
          git commit -m "feat: complete the creator-directed Director Desk journey"
          git push origin HEAD:gauntlet/directors-cut-optical-pipeline
