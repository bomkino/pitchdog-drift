name: Director's Cut CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: directors-cut-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event.pull_request.head.ref == 'gauntlet/directors-cut-clean-final'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, run contracts, and build
        run: npm run check

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run browser, WebGL, responsive, and export gauntlet
        run: npm run test:e2e

      - name: Package exact source for isolated audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=playwright-report \
            --exclude=test-results \
            -czf /tmp/directors-cut-source.tgz .
          sha256sum /tmp/directors-cut-source.tgz > /tmp/directors-cut-source.sha256

      - name: Preserve exact source snapshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: directors-cut-source-audit
          path: |
            /tmp/directors-cut-source.tgz
            /tmp/directors-cut-source.sha256
          if-no-files-found: error
          retention-days: 1

      - name: Preserve visual and failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: directors-cut-browser-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
