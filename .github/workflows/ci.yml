name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: director-desk-full-proof
  cancel-in-progress: true

jobs:
  full-browser-proof:
    if: github.event.pull_request.head.ref == 'gauntlet/directors-cut-optical-pipeline'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact proposal branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/directors-cut-optical-pipeline
          fetch-depth: 0

      - name: Reconstruct verified product tree
        shell: bash
        run: |
          set -euo pipefail
          payload_commit=5eccabaab54f230cdf4032204c96d689263b79ce
          base_commit=6c450add8a68d32df1cad75aeff334ba1bf8a4fa
          : > /tmp/product.b64
          for index in 00 01 02 03 04 05 06; do
            git show "$payload_commit:.github/director-desk-payload-v2/part-$index" >> /tmp/product.b64
          done
          test "$(wc -c < /tmp/product.b64 | tr -d ' ')" = "73052"
          base64 --decode /tmp/product.b64 > /tmp/product.tgz
          echo "63b9c56fed5d69a8bd37c88f3fe6164534325c8404160a10d84a255857036961  /tmp/product.tgz" | sha256sum --check --strict -
          tar -xzf /tmp/product.tgz
          rm -rf .github/director-desk-payload-v2 .github/director-desk-payload .github/director-cut-payload
          rm -f .github/director-desk-product.b64 .github/audit-run-id.txt
          rm -f .github/workflows/apply-director-desk-v2.yml .github/workflows/apply-director-desk-manifest.yml .github/workflows/audit-snapshot.yml
          git show "$base_commit:.github/workflows/ci.yml" > .github/workflows/ci.yml

      - name: Apply held-frame and raw-pixel comparison contracts
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          path = Path("src/engine/CinematicCarousel.ts")
          source = path.read_text()
          source = source.replace(
            """      if (!this.paused && !this.reducedMotionPreview) this.elapsed += delta;
                this.advanceMotion(delta);
                this.renderPreview();
                this.sampleFps(now);""",
            """      const shouldAnimate = !this.paused && !this.reducedMotionPreview;
                if (shouldAnimate) {
                  this.elapsed += delta;
                  this.advanceMotion(delta);
                  this.renderPreview();
                  this.sampleFps(now);
                }""",
            1,
          )
          source = source.replace(
            """    if (paused) this.motionVelocity = 0;
              this.syncPresenterPlayback();
              this.renderPreview();""",
            """    if (paused) {
                this.motionVelocity = 0;
                this.callbacks.onFrame?.(0);
              } else {
                this.fpsFrameCounter = 0;
                this.fpsSampleStarted = performance.now();
              }
              this.syncPresenterPlayback();
              this.renderPreview();""",
            1,
          )
          source = source.replace(
            """    if (reduced) this.motionVelocity = 0;
              this.renderPreview();""",
            """    if (reduced) {
                this.motionVelocity = 0;
                this.callbacks.onFrame?.(0);
              } else if (!this.paused) {
                this.fpsFrameCounter = 0;
                this.fpsSampleStarted = performance.now();
              }
              this.renderPreview();""",
            1,
          )
          path.write_text(source)
          PY
          printf '%s' '' | base64 --decode > e2e/cleanLensComparison.e2e.ts

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run strict product gate
        run: npm run check

      - name: Install hosted Chromium
        run: npx playwright install --with-deps chromium

      - name: Run all creator journeys
        env:
          CI: "1"
        run: npm run test:e2e

      - name: Preserve browser evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: director-desk-full-proof
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
