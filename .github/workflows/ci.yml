name: CI

on:
  push:
    branches:
      - main
      - gauntlet/tactile-sound-final-gpt56pro
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-final-sound-hardening:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[apply-final-sound-hardening-v5]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out isolated sound branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/tactile-sound-final-gpt56pro
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Separate product patches from temporary runner plumbing
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("scripts/apply-final-sonic-hardening.py")
          source = path.read_text(encoding="utf-8")
          patterns = [
              r'''replace_once\(
              "\.github/workflows/ci\.yml",
              "timeout-minutes: 25",
              "timeout-minutes: 35",
          \)
          ''',
              r'''replace_once\(
              "\.github/workflows/ci\.yml",
              """            playwright-report/
              test-results/""",
              """            playwright-report/
              playwright-production-report/
              test-results/""",
          \)
          ''',
          ]
          for pattern in patterns:
              source, count = re.subn(pattern, "", source)
              if count != 1:
                  raise RuntimeError(
                      f"Could not isolate temporary CI patch block: {pattern[:80]!r}; found {count}."
                  )
          path.write_text(source, encoding="utf-8")
          PY

      - name: Apply audited large-file patches
        run: |
          python3 scripts/apply-final-sonic-hardening.py
          python3 scripts/apply-final-sonic-followups.py

      - name: Refresh and verify the exact pinned corpus
        run: python3 scripts/vendor-sonic-assets.py

      - name: Remove delivery machinery and restore ordinary read-only CI
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-final-sound-hardening.yml \
            .github/workflows/apply-final-sound-hardening-v2.yml \
            scripts/apply-final-sonic-hardening.py \
            scripts/apply-final-sonic-followups.py
          git fetch origin main:refs/remotes/origin/main
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          python3 - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/ci.yml")
          source = path.read_text(encoding="utf-8")
          if source.count("timeout-minutes: 25") != 1:
              raise RuntimeError("Ordinary CI timeout target changed.")
          source = source.replace("timeout-minutes: 25", "timeout-minutes: 35", 1)
          before = "            playwright-report/\n            test-results/"
          after = "            playwright-report/\n            playwright-production-report/\n            test-results/"
          if source.count(before) != 1:
              raise RuntimeError("Ordinary CI artifact target changed.")
          path.write_text(source.replace(before, after, 1), encoding="utf-8")
          PY
          git diff --check

      - name: Install exact dependency lock
        run: npm ci

      - name: Run static, unit, rollback, production, bundle, and treatment gates
        run: npm run check

      - name: Verify committed source and licence provenance
        run: npm run sound:verify

      - name: Install pinned Chromium
        run: npx playwright install chromium

      - name: Run development and production browser gauntlets
        run: npm run test:e2e

      - name: Commit clean reviewable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat(sound): finish timing, dialogue, and provenance hardening"
          git push origin HEAD:gauntlet/tactile-sound-final-gpt56pro

      - name: Preserve apply-gate failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-tactile-sound-v5-failure-evidence
          path: |
            playwright-report/
            playwright-production-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[apply-final-sound-hardening-v5]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Install pinned Chromium
        run: npx playwright install chromium

      - name: Run real-browser gauntlet
        run: npm run test:e2e

      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            playwright-production-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
