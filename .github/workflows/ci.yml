name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/directors-cut-optical-pipeline
          fetch-depth: 0

      - name: Restore reviewed source payload
        if: hashFiles('.github/director-cut-payload/part-*') != ''
        shell: bash
        run: |
          set -euo pipefail
          cat .github/director-cut-payload/part-* > /tmp/directors-cut.b64
          base64 --decode /tmp/directors-cut.b64 > /tmp/directors-cut.tgz
          echo "66c560c6e32c7a30a66feef9e44ebe05cddbf9251bfd7f4c73cdd479d5f5222c  /tmp/directors-cut.tgz" | sha256sum --check -
          tar -xzf /tmp/directors-cut.tgz
          rm -rf .github/director-cut-payload
          rm -f .github/director-cut-trigger
          rm -f .github/workflows/apply-directors-cut.yml
          rm -f .github/workflows/source-snapshot.yml
          rm -f .github/workflows/dependency-snapshot.yml
          echo "" | base64 --decode > .github/workflows/ci.yml
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "feat: add director's-cut optics and atmosphere system"
          git push origin HEAD:gauntlet/directors-cut-optical-pipeline

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Run real-browser gauntlet
        run: npm run test:e2e

      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
