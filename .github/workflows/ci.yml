name: CI
on:
  push:
    branches: [main, codex/drift-native-completion]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Authored source and release contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: git diff --check
  native:
    uses: ./.github/workflows/native-integration.yml
  application:
    uses: ./.github/workflows/native-app.yml
  verify:
    needs: [source, native, application]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require source, complete native integration and tested installer
        env:
          SOURCE: ${{ needs.source.result }}
          NATIVE: ${{ needs.native.result }}
          APPLICATION: ${{ needs.application.result }}
        run: |
          set -euo pipefail
          printf 'source=%s\nnative=%s\napplication=%s\n' "$SOURCE" "$NATIVE" "$APPLICATION"
          test "$SOURCE" = success
          test "$NATIVE" = success
          test "$APPLICATION" = success
