name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Materialize current generated implementation
        run: |
          printf '\nNo third-party image, font, video, or audio asset is included in the repository.\n' >> ASSET-LICENSE.md
          node scripts/sonic-builder.mjs
          python3 scripts/repair-sonic-export-builder.py
          node scripts/sonic-export-builder.mjs
          python3 scripts/fix-generated-sonic.py
          rm -rf .git node_modules dist playwright-report test-results
          tar -czf /tmp/generated-sonic-source.tar.gz .

      - name: Upload generated source for direct audit
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: generated-sonic-source
          path: /tmp/generated-sonic-source.tar.gz
          if-no-files-found: error
          retention-days: 2
