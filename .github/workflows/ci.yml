name: CI

on:
  push:
    branches:
      - main
      - gauntlet/tactile-sound-final-gpt56pro
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-final-sound-hardening:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[apply-final-sound-hardening-v3]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out isolated sound branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/tactile-sound-final-gpt56pro
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Apply audited large-file patches
        run: |
          python3 scripts/apply-final-sonic-hardening.py
          python3 scripts/apply-final-sonic-followups.py

      - name: Refresh and verify the exact pinned corpus
        run: python3 scripts/vendor-sonic-assets.py

      - name: Remove delivery machinery and restore ordinary read-only CI
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/apply-final-sound-hardening.yml \
            .github/workflows/apply-final-sound-hardening-v2.yml \
            scripts/apply-final-sonic-hardening.py \
            scripts/apply-final-sonic-followups.py
          cat > .github/workflows/ci.yml <<'EOF'
          name: CI

          on:
            push:
              branches: [main]
            pull_request:

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            verify:
              runs-on: ubuntu-latest
              timeout-minutes: 35
              steps:
                - name: Check out source
                  uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

                - name: Use Node.js 22
                  uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
                  with:
                    node-version: 22
                    cache: npm

                - name: Install locked dependencies
                  run: npm ci

                - name: Typecheck, test, and build
                  run: npm run check

                - name: Install pinned Chromium
                  run: npx playwright install chromium

                - name: Run real-browser gauntlet
                  run: npm run test:e2e

                - name: Preserve failure evidence
                  if: failure()
                  uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
                  with:
                    name: playwright-failure-evidence
                    path: |
                      playwright-report/
                      playwright-production-report/
                      test-results/
                    if-no-files-found: ignore
                    retention-days: 7
          EOF
          git diff --check

      - name: Install exact dependency lock
        run: npm ci

      - name: Run static, unit, rollback, production, bundle, and treatment gates
        run: npm run check

      - name: Verify committed source and licence provenance
        run: npm run sound:verify

      - name: Install pinned Chromium
        run: npx playwright install chromium

      - name: Run development and production browser gauntlets
        run: npm run test:e2e

      - name: Commit clean reviewable source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat(sound): finish timing, dialogue, and provenance hardening"
          git push origin HEAD:gauntlet/tactile-sound-final-gpt56pro

      - name: Preserve apply-gate failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-tactile-sound-v3-failure-evidence
          path: |
            playwright-report/
            playwright-production-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  verify:
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, '[apply-final-sound-hardening-v3]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Install pinned Chromium
        run: npx playwright install chromium

      - name: Run real-browser gauntlet
        run: npm run test:e2e

      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report/
            playwright-production-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
