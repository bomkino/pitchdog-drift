name: Apply export lifecycle fix

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: lifecycle-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/directors-cut-optical-pipeline
          fetch-depth: 0

      - name: Apply reviewed export lifecycle patch
        shell: bash
        run: |
          set -euo pipefail
          echo "" | base64 --decode > /tmp/export-lifecycle.patch
          echo "35d866f7606ca5a068421321b061f51b3a749b9708bb098aaec6acc2cdb5908d  /tmp/export-lifecycle.patch" | sha256sum --check -
          git apply --check /tmp/export-lifecycle.patch
          git apply /tmp/export-lifecycle.patch
          echo "" | base64 --decode > .github/workflows/ci.yml
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "fix: make export lifecycle session-safe"
          git push origin HEAD:gauntlet/directors-cut-optical-pipeline
