name: Validation workspace

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Install pinned Chromium
        run: npx playwright install chromium

      - name: Pack browser runtime
        run: tar -C "$HOME/.cache" -czf /tmp/pitchdog-drift-playwright.tar.gz ms-playwright

      - name: Upload browser runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitchdog-drift-playwright
          path: /tmp/pitchdog-drift-playwright.tar.gz
          if-no-files-found: error
          retention-days: 1
