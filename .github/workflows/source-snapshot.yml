name: Materialize authentic tactile sound

on:
  workflow_dispatch:
  push:
    branches:
      - feat/tactile-sound-system-v2
    paths:
      - .github/workflows/source-snapshot.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/source-snapshot.yml
      - scripts/vendor-sonic-assets.py
      - scripts/apply-authentic-sonic.py
      - scripts/fix-sonic-hit-target.py

permissions:
  contents: write

concurrency:
  group: authentic-tactile-sound-materializer
  cancel-in-progress: true

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out isolated sound branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/tactile-sound-system-v2
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Bring in the audited deterministic sonic core
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/editorial-sonic-system:refs/remotes/origin/feat/editorial-sonic-system
          copy_from_core() {
            local path="$1"
            mkdir -p "$(dirname "$path")"
            git show "origin/feat/editorial-sonic-system:$path" > "$path"
          }
          copy_from_core src/sonic/SonicEngine.ts
          copy_from_core src/sonic/catalog.ts
          copy_from_core src/sonic/mix.ts
          copy_from_core src/sonic/plan.ts
          copy_from_core src/sonic/renderSoundtrack.ts
          copy_from_core src/components/SonicDock.tsx
          copy_from_core src/vite-env.d.ts
          copy_from_core tests/sonicPlan.test.ts
          copy_from_core docs/SONIC_DESIGN.md
          copy_from_core scripts/sonic-builder.mjs
          copy_from_core scripts/sonic-export-builder.mjs
          copy_from_core scripts/repair-sonic-export-builder.py
          copy_from_core scripts/fix-generated-sonic.py

      - name: Prime the legacy documentation patch boundary
        shell: bash
        run: |
          set -euo pipefail
          marker='No third-party image, font, video, or audio asset is included in the repository.'
          if ! grep -Fq "$marker" ASSET-LICENSE.md; then
            printf '\n%s\n' "$marker" >> ASSET-LICENSE.md
          fi

      - name: Apply the deterministic preview and export integration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/sonic-builder.mjs
          python3 scripts/repair-sonic-export-builder.py
          node scripts/sonic-export-builder.mjs
          python3 scripts/fix-generated-sonic.py

      - name: Vendor exact authentic CC0 recordings
        run: python3 scripts/vendor-sonic-assets.py

      - name: Apply the user-journey and supply-chain hardening pass
        run: python3 scripts/apply-authentic-sonic.py

      - name: Make every material card a real radio hit target
        run: python3 scripts/fix-sonic-hit-target.py

      - name: Verify unique sound-control accessibility
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -F 'name: "Sound level", exact: true' e2e/studio.e2e.ts | wc -l)" -eq 2
          ! grep -F 'getByLabel("Master")' e2e/studio.e2e.ts

      - name: Keep the asset test outside the browser TypeScript project
        shell: bash
        run: |
          rm -f tests/sonicAssets.test.ts
          cat > tests/sonicAssets.test.js <<'EOF'
          import { createHash } from "node:crypto";
          import { readFileSync } from "node:fs";
          import { resolve } from "node:path";
          import { describe, expect, it } from "vitest";

          function gitBlobSha1(data) {
            const header = Buffer.from(`blob ${data.length}\0`, "ascii");
            return createHash("sha1").update(header).update(data).digest("hex");
          }

          describe("authentic tactile asset ledger", () => {
            const manifestPath = resolve(
              process.cwd(),
              "src/sonic/assets/manifest.json",
            );
            const manifest = JSON.parse(readFileSync(manifestPath, "utf8"));

            it("pins a local CC0 corpus with no runtime request path", () => {
              expect(manifest.upstreamRevision).toBe(
                "a7a3ee178d2ec48f4354782f244ab777a0e238df",
              );
              expect(manifest.runtimeNetworkRequests).toBe(false);
              expect(manifest.recordings.length).toBeGreaterThanOrEqual(20);
              expect(manifest.licenseFiles).toHaveLength(3);
            });

            it("verifies every WAV header, byte length and cryptographic digest", () => {
              for (const entry of manifest.recordings) {
                const data = readFileSync(resolve(process.cwd(), entry.localPath));
                expect(data.subarray(0, 4).toString("ascii")).toBe("RIFF");
                expect(data.subarray(8, 12).toString("ascii")).toBe("WAVE");
                expect(data.length).toBe(entry.bytes);
                expect(gitBlobSha1(data)).toBe(entry.gitBlobSha1);
                expect(createHash("sha256").update(data).digest("hex")).toBe(
                  entry.sha256,
                );
                expect(entry.upstreamRevision).toBe(manifest.upstreamRevision);
                expect(entry.license).toBe("CC0-1.0");
                expect(entry.canonicalSource).toMatch(
                  /^https:\/\/kenney\.nl\/assets\//,
                );
              }
            });

            it("preserves the original CC0 notice for each source pack", () => {
              for (const entry of manifest.licenseFiles) {
                const text = readFileSync(
                  resolve(process.cwd(), entry.localPath),
                  "utf8",
                );
                expect(entry.license).toBe("CC0-1.0");
                expect(text.toUpperCase()).toContain("CC0");
              }
            });
          });
          EOF

      - name: Install exact dependency lock
        run: npm ci

      - name: Verify the committed sound corpus
        run: |
          python3 scripts/vendor-sonic-assets.py --verify
          test "$(find src/sonic/assets/recordings -type f -name '*.wav' | wc -l)" -ge 20
          test "$(find src/sonic/assets -type f -name '*.ogg' | wc -l)" -eq 0
          ! grep -R -E 'romainsimon|cdn\.freesound|uisfx' \
            src/sonic docs/SONIC_DESIGN.md docs/SONIC_GAUNTLET.md \
            ASSET-LICENSE.md THIRD_PARTY_NOTICES.md

      - name: Run type, unit, and production-build gauntlet
        run: npm run check

      - name: Install pinned Chromium
        run: npx playwright install chromium

      - name: Run browser, persistence, privacy, and AAC gauntlet
        run: npm run test:e2e

      - name: Remove transient integration machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/source-snapshot.yml \
            scripts/apply-authentic-sonic.py \
            scripts/sonic-builder.mjs \
            scripts/sonic-export-builder.mjs \
            scripts/repair-sonic-export-builder.py \
            scripts/fix-generated-sonic.py \
            scripts/fix-sonic-hit-target.py
          git diff --check

      - name: Commit the reviewable sound branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pitchdog-drift sound gauntlet"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "feat(sound): add authentic tactile foley system"
          git push origin HEAD:feat/tactile-sound-system-v2
