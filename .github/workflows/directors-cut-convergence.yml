name: Director's Cut convergence

on:
  push:
    branches: [gauntlet/directors-cut-optical-pipeline]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: directors-cut-convergence
  cancel-in-progress: true

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/directors-cut-optical-pipeline
          fetch-depth: 0

      - name: Cancel stale branch machinery and refresh source
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?branch=gauntlet%2Fdirectors-cut-optical-pipeline&per_page=100" \
            --jq ".workflow_runs[] | select(.id != (${CURRENT_RUN}|tonumber)) | select(.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\") | .id" \
            | while read -r run_id; do
                gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true
              done
          sleep 6
          git fetch origin gauntlet/directors-cut-optical-pipeline main
          git reset --hard origin/gauntlet/directors-cut-optical-pipeline

      - name: Converge product truth, contracts, and evidence tooling
        shell: python
        run: |
          from pathlib import Path
          import json
          import re

          # Canonical creator-surface contract: test outcomes, not arbitrary
          # installer verbs or one DOM-construction style.
          Path("tests/creatorSurface.test.ts").write_text(r'''import { readdirSync, readFileSync } from "node:fs";
          import { extname, join, relative } from "node:path";
          import { fileURLToPath } from "node:url";
          import { describe, expect, it } from "vitest";

          const root = fileURLToPath(new URL("..", import.meta.url));
          const sourceRoot = join(root, "src");

          function sourceFiles(directory: string): string[] {
            return readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const path = join(directory, entry.name);
              if (entry.isDirectory()) return sourceFiles(path);
              return [".ts", ".tsx"].includes(extname(entry.name)) ? [path] : [];
            });
          }

          const source = new Map(
            sourceFiles(sourceRoot).map((path) => [
              relative(sourceRoot, path).replaceAll("\\", "/"),
              readFileSync(path, "utf8"),
            ]),
          );
          const completeSource = Array.from(source.entries(), ([path, content]) => `// ${path}\n${content}`).join("\n");

          function expectModuleConsumed(moduleName: string): void {
            const importPattern = new RegExp(`from\\s+["'][^"']*${moduleName}["']`);
            expect(completeSource, `${moduleName}.ts must be imported by the live product`).toMatch(importPattern);
          }

          describe("creator-surface truth", () => {
            it("mounts Director Commands from the application entry point", () => {
              const main = source.get("main.tsx") ?? "";
              expect(main).toMatch(/directorCommands/);
              expect(main).toMatch(/\b(?:install|mount|init|initialize|setup|start)[A-Za-z]*DirectorCommands\b/);
            });

            it("does not leave journey architecture as dead helper files", () => {
              for (const moduleName of ["direction", "deckHealth", "guides", "legibility", "outputPresets"]) {
                expectModuleConsumed(moduleName);
              }
            });

            it("keeps creator-language commands discoverable and operable", () => {
              const commands = source.get("lib/directorCommands.ts") ?? "";
              for (const phrase of ["variation", "before after", "social safe", "output", "undo"]) {
                expect(commands.toLowerCase()).toContain(phrase);
              }
              expect(commands).toMatch(/metaKey|ctrlKey/);
              expect(commands).toMatch(/aria-|setAttribute\(["']role|role\s*[:=]/);
            });

            it("keeps temporary code-delivery machinery out of the review tree", () => {
              const workflowRoot = join(root, ".github", "workflows");
              expect(readdirSync(workflowRoot).sort()).toEqual(["ci.yml"]);
            });
          });
          '''.replace("          ", ""))

          # Canonical reversible comparison contract.
          Path("e2e/cleanLensComparison.e2e.ts").write_text(r'''import { createHash } from "node:crypto";
          import { expect, test } from "@playwright/test";

          const digest = (buffer: Buffer): string => createHash("sha256").update(buffer).digest("hex");

          test("Clean lens is an honest reversible comparison, not a destructive reset", async ({ page }) => {
            await page.emulateMedia({ reducedMotion: "reduce" });
            await page.goto("/");

            const worldSelect = page
              .locator("select")
              .filter({ has: page.locator("option", { hasText: "Editorial Drift" }) })
              .first();
            await expect(worldSelect).toBeVisible();

            const options = await worldSelect.locator("option").evaluateAll((nodes) =>
              nodes.map((node) => ({
                value: (node as HTMLOptionElement).value,
                label: (node.textContent ?? "").trim(),
              })).filter((option) => option.value && option.label),
            );
            const expressiveWorld = options.find((option) => /Dread|Chrome Dream|Night Run/i.test(option.label));
            expect(expressiveWorld, "A strongly treated authored world is required for comparison QA").toBeTruthy();
            await worldSelect.selectOption(expressiveWorld!.value);

            const pause = page.getByRole("button", { name: /pause preview/i });
            if (await pause.isVisible().catch(() => false)) await pause.click();

            const canvas = page.locator("canvas").first();
            await page.waitForTimeout(220);
            const directed = await canvas.screenshot({ animations: "disabled" });
            const selectedWorld = await worldSelect.inputValue();

            const compare = page.getByRole("button", { name: /clean lens/i }).first();
            await expect(compare).toBeVisible();
            await compare.click();
            await page.waitForTimeout(180);
            const clean = await canvas.screenshot({ animations: "disabled" });

            expect(digest(clean), "Clean lens should expose a visibly different optical treatment").not.toBe(digest(directed));
            expect(await worldSelect.inputValue(), "Comparison must not replace the selected world").toBe(selectedWorld);

            const restore = page.getByRole("button", { name: /restore|return|directed lens|clean lens/i }).first();
            await restore.click();
            await page.waitForTimeout(180);
            const restored = await canvas.screenshot({ animations: "disabled" });

            expect(digest(restored), "Ending comparison should restore the exact directed frame").toBe(digest(directed));
            expect(await worldSelect.inputValue()).toBe(selectedWorld);
          });
          '''.replace("          ", ""))

          # Perceptual diversity: exact hashes can differ because of one pixel.
          # This gate requires meaningful average RGB separation across the
          # complete authored corpus.
          Path("e2e/worldPerceptualDiversity.e2e.ts").write_text(r'''import { expect, test } from "@playwright/test";

          test("authored worlds remain perceptually distinct, not merely byte-distinct", async ({ page }) => {
            await page.emulateMedia({ reducedMotion: "reduce" });
            await page.goto("/");

            const worldSelect = page
              .locator("select")
              .filter({ has: page.locator("option", { hasText: "Editorial Drift" }) })
              .first();
            await expect(worldSelect).toBeVisible();
            const pause = page.getByRole("button", { name: /pause preview/i });
            if (await pause.isVisible().catch(() => false)) await pause.click();

            const options = await worldSelect.locator("option").evaluateAll((nodes) =>
              nodes.map((node) => ({
                value: (node as HTMLOptionElement).value,
                label: (node.textContent ?? "").trim(),
              })).filter((option) => option.value && option.label),
            );
            expect(options).toHaveLength(12);

            const canvas = page.locator("canvas").first();
            const samples: Array<{ label: string; rgb: number[] }> = [];
            for (const option of options) {
              await worldSelect.selectOption(option.value);
              await page.waitForTimeout(180);
              const image = await canvas.screenshot({ animations: "disabled" });
              const dataUrl = `data:image/png;base64,${image.toString("base64")}`;
              const rgb = await page.evaluate(async (url) => {
                const image = new Image();
                image.src = url;
                await image.decode();
                const sample = document.createElement("canvas");
                sample.width = 36;
                sample.height = 36;
                const context = sample.getContext("2d", { willReadFrequently: true });
                if (!context) throw new Error("2D visual-audit canvas is unavailable.");
                context.drawImage(image, 0, 0, sample.width, sample.height);
                const pixels = context.getImageData(0, 0, sample.width, sample.height).data;
                const values: number[] = [];
                for (let index = 0; index < pixels.length; index += 4) {
                  values.push(pixels[index]!, pixels[index + 1]!, pixels[index + 2]!);
                }
                return values;
              }, dataUrl);
              samples.push({ label: option.label, rgb });
            }

            const differences: Array<{ pair: string; value: number }> = [];
            for (let left = 0; left < samples.length; left += 1) {
              for (let right = left + 1; right < samples.length; right += 1) {
                const a = samples[left]!;
                const b = samples[right]!;
                const difference = a.rgb.reduce((sum, value, index) => sum + Math.abs(value - b.rgb[index]!), 0) / a.rgb.length;
                differences.push({ pair: `${a.label} / ${b.label}`, value: difference });
              }
            }
            differences.sort((a, b) => a.value - b.value);
            const median = differences[Math.floor(differences.length / 2)]!.value;
            expect(differences[0]!.value, `Closest worlds: ${differences[0]!.pair}`).toBeGreaterThan(1);
            expect(median).toBeGreaterThan(4);
          });
          '''.replace("          ", ""))

          # Full-frame optics need a browser-memory gate as well as a GPU
          # dimension gate.
          engine = Path("src/engine/CinematicCarousel.ts")
          source = engine.read_text()
          if "estimateExportWorkingSetBytes" not in source:
              anchor = "\nfunction backgroundMode("
              if anchor not in source:
                  raise SystemExit("Could not find backgroundMode insertion anchor.")
              guard = '''

          export const DEFAULT_EXPORT_WORKING_SET_LIMIT = 512 * 1024 * 1024;

          /** Conservative transient GPU estimate for one full-frame optical export. */
          export function estimateExportWorkingSetBytes(width: number, height: number): number {
            if (!Number.isSafeInteger(width) || !Number.isSafeInteger(height) || width <= 0 || height <= 0) return Number.POSITIVE_INFINITY;
            return width * height * 20;
          }

          export function assertExportWorkingSetSupported(
            width: number,
            height: number,
            maximumBytes = DEFAULT_EXPORT_WORKING_SET_LIMIT,
          ): void {
            const estimated = estimateExportWorkingSetBytes(width, height);
            if (!Number.isFinite(maximumBytes) || maximumBytes <= 0) {
              throw new Error("Export working-set limit must be a positive number of bytes.");
            }
            if (estimated > maximumBytes) {
              const neededMiB = Math.ceil(estimated / (1024 * 1024));
              const limitMiB = Math.floor(maximumBytes / (1024 * 1024));
              throw new Error(
                `Export surface ${width} × ${height} needs an estimated ${neededMiB} MiB optical working set, above Drift's ${limitMiB} MiB browser-stability guard. Reduce the master dimensions and try again.`,
              );
            }
          }
          '''
              source = source.replace(anchor, guard + anchor, 1)
          call = "    assertExportSurfaceSupported(width, height, this.capabilities);\n"
          if "assertExportWorkingSetSupported(width, height);" not in source:
              if call not in source:
                  raise SystemExit("Could not find beginExport preflight anchor.")
              source = source.replace(call, call + "    assertExportWorkingSetSupported(width, height);\n", 1)
          engine.write_text(source)

          Path("tests/exportWorkingSet.test.ts").write_text(r'''import { describe, expect, it } from "vitest";
          import {
            DEFAULT_EXPORT_WORKING_SET_LIMIT,
            assertExportWorkingSetSupported,
            estimateExportWorkingSetBytes,
          } from "../src/engine/CinematicCarousel";

          describe("optical export working-set preflight", () => {
            it("keeps social and 4K masters inside the browser guard", () => {
              expect(() => assertExportWorkingSetSupported(1080, 1920)).not.toThrow();
              expect(() => assertExportWorkingSetSupported(2160, 3840)).not.toThrow();
              expect(estimateExportWorkingSetBytes(2160, 3840)).toBeLessThan(DEFAULT_EXPORT_WORKING_SET_LIMIT);
            });

            it("blocks 8K-class full-frame optical surfaces before allocation", () => {
              expect(estimateExportWorkingSetBytes(4320, 7680)).toBeGreaterThan(DEFAULT_EXPORT_WORKING_SET_LIMIT);
              expect(() => assertExportWorkingSetSupported(4320, 7680)).toThrow(/estimated .* MiB optical working set/i);
            });

            it("rejects malformed dimensions and budgets honestly", () => {
              expect(estimateExportWorkingSetBytes(0, 1920)).toBe(Number.POSITIVE_INFINITY);
              expect(() => assertExportWorkingSetSupported(1080, 1920, 0)).toThrow(/positive number of bytes/i);
            });
          });
          '''.replace("          ", ""))

          # Reproducible evidence command. It starts a private local Vite server,
          # captures every authored world, rejects duplicates, and writes a
          # single reviewable atlas using only bundled study slides.
          Path("scripts").mkdir(exist_ok=True)
          Path("scripts/captureWorldAtlas.mjs").write_text(r'''import { spawn } from "node:child_process";
          import { createHash } from "node:crypto";
          import { mkdir, writeFile } from "node:fs/promises";
          import path from "node:path";
          import process from "node:process";
          import { chromium } from "@playwright/test";

          const port = Number.parseInt(process.env.DRIFT_EVIDENCE_PORT ?? "4173", 10);
          const baseUrl = `http://127.0.0.1:${port}`;
          const npm = process.platform === "win32" ? "npm.cmd" : "npm";
          const server = spawn(npm, ["run", "dev", "--", "--port", String(port), "--strictPort"], {
            stdio: ["ignore", "pipe", "pipe"],
            env: { ...process.env, BROWSER: "none" },
          });
          let serverLog = "";
          server.stdout.on("data", (chunk) => { serverLog += String(chunk); });
          server.stderr.on("data", (chunk) => { serverLog += String(chunk); });

          async function waitForServer() {
            for (let attempt = 0; attempt < 120; attempt += 1) {
              try {
                const response = await fetch(baseUrl);
                if (response.ok) return;
              } catch {}
              await new Promise((resolve) => setTimeout(resolve, 250));
            }
            throw new Error(`Drift evidence server did not start.\n${serverLog}`);
          }

          let browser;
          try {
            await waitForServer();
            browser = await chromium.launch({
              headless: true,
              args: ["--use-gl=swiftshader", "--enable-webgl", "--ignore-gpu-blocklist"],
            });
            const context = await browser.newContext({
              viewport: { width: 1440, height: 1200 },
              reducedMotion: "reduce",
              colorScheme: "dark",
            });
            const page = await context.newPage();
            const errors = [];
            page.on("console", (message) => { if (message.type() === "error") errors.push(message.text()); });
            page.on("pageerror", (error) => errors.push(error.message));
            await page.goto(baseUrl);

            const worldSelect = page.locator("select").filter({
              has: page.locator("option", { hasText: "Editorial Drift" }),
            }).first();
            await worldSelect.waitFor({ state: "visible" });
            const pause = page.getByRole("button", { name: /pause preview/i });
            if (await pause.isVisible().catch(() => false)) await pause.click();
            const options = await worldSelect.locator("option").evaluateAll((nodes) =>
              nodes.map((node) => ({
                value: node.value,
                label: (node.textContent ?? "").trim(),
              })).filter((option) => option.value && option.label),
            );
            if (options.length !== 12) throw new Error(`Expected 12 authored worlds; found ${options.length}.`);

            const canvas = page.locator("canvas").first();
            const captures = [];
            const hashes = new Set();
            for (const option of options) {
              await worldSelect.selectOption(option.value);
              await page.waitForTimeout(220);
              const image = await canvas.screenshot({ animations: "disabled" });
              const hash = createHash("sha256").update(image).digest("hex");
              if (hashes.has(hash)) throw new Error(`${option.label} duplicates another rendered world.`);
              hashes.add(hash);
              captures.push({ ...option, image, hash });
            }
            if (errors.length) throw new Error(`Browser errors during atlas capture:\n${errors.join("\n")}`);

            const cards = captures.map((capture, index) => `
              <article>
                <div class="number">${String(index + 1).padStart(2, "0")}</div>
                <img src="data:image/png;base64,${capture.image.toString("base64")}" alt="${capture.label}">
                <h2>${capture.label}</h2>
              </article>
            `).join("");
            await page.setViewportSize({ width: 1500, height: 2600 });
            await page.setContent(`<!doctype html><html><head><meta charset="utf-8"><style>
              *{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#f4efe7;font-family:Arial,sans-serif;padding:54px}
              header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:42px;border-bottom:1px solid #34312d;padding-bottom:28px}
              h1{font-size:48px;letter-spacing:-1.8px;margin:0}header p{margin:0;color:#aaa29a;font-size:18px;max-width:560px;text-align:right;line-height:1.45}
              main{display:grid;grid-template-columns:repeat(3,1fr);gap:34px}article{position:relative;min-width:0}
              img{display:block;width:100%;aspect-ratio:9/16;object-fit:cover;background:#111;border:1px solid #292723;border-radius:18px}
              h2{font-size:20px;margin:14px 0 0;letter-spacing:-.3px}.number{position:absolute;z-index:2;top:14px;left:14px;background:rgba(0,0,0,.64);border:1px solid rgba(255,255,255,.18);padding:7px 9px;border-radius:999px;font:12px monospace}
              footer{margin-top:44px;color:#77716b;font:14px monospace}
            </style></head><body><header><h1>Drift — authored world atlas</h1><p>Rendered from bundled study slides. A visual audit of direction, not proof against every real deck.</p></header><main>${cards}</main><footer>Generated locally by npm run evidence:worlds</footer></body></html>`);
            await page.evaluate(() => Promise.all(Array.from(document.images, (image) => image.complete ? undefined : new Promise((resolve) => {
              image.addEventListener("load", resolve, { once: true });
              image.addEventListener("error", resolve, { once: true });
            }))));
            await mkdir(path.resolve("docs/media"), { recursive: true });
            await page.screenshot({ path: path.resolve("docs/media/world-atlas.png"), fullPage: true });
            const rows = captures.map((capture, index) => `| ${index + 1} | ${capture.label} | \`${capture.value}\` |`).join("\n");
            await writeFile(path.resolve("docs/WORLD_ATLAS.md"), `# Authored world atlas\n\nThis atlas is generated from bundled study slides. It checks that the complete world corpus renders and remains visually distinct; it does not replace testing with real deck material.\n\n![Twelve authored Drift worlds](media/world-atlas.png)\n\n| # | World | Registry value |\n| ---: | --- | --- |\n${rows}\n\nRegenerate from a clean checkout with:\n\n\`\`\`bash\nnpm ci\nnpx playwright install chromium\nnpm run evidence:worlds\n\`\`\`\n`);
            await context.close();
          } finally {
            await browser?.close().catch(() => undefined);
            server.kill("SIGTERM");
          }
          '''.replace("          ", ""))

          package_path = Path("package.json")
          package = json.loads(package_path.read_text())
          package.setdefault("scripts", {})["evidence:worlds"] = "node scripts/captureWorldAtlas.mjs"
          package_path.write_text(json.dumps(package, indent=2) + "\n")

          readme = Path("README.md")
          source = readme.read_text()
          source = re.sub(r"Apply one of 18 authored film worlds", "Apply one authored film world", source)
          source = source.replace(
              "See [the creator journey](docs/CREATOR_JOURNEY.md).",
              "See [the creator journey](docs/CREATOR_JOURNEY.md), [the user gauntlet](docs/USER_GAUNTLET.md), and [the authored world atlas](docs/WORLD_ATLAS.md).",
          )
          readme.write_text(source)

          Path("docs/QA_SECOND_PASS.md").unlink(missing_ok=True)

          # The live test suite must see only maintained CI, not the delivery
          # machinery used to reach this clean tree.
          workflow_root = Path(".github/workflows")
          for path in workflow_root.iterdir():
              if path.is_file() and path.name != "ci.yml":
                  path.unlink()

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies and Chromium
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run exact typed, unit, build, and browser gates
        id: gates
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          TYPECHECK=$?
          npx vitest run --reporter=json --outputFile=/tmp/vitest.json > /tmp/vitest.log 2>&1
          UNIT=$?
          npm run build > /tmp/build.log 2>&1
          BUILD=$?
          npx playwright test --reporter=json > /tmp/playwright.json 2> /tmp/playwright.stderr
          BROWSER=$?
          ATLAS=1
          if [ "$TYPECHECK" -eq 0 ] && [ "$UNIT" -eq 0 ] && [ "$BUILD" -eq 0 ] && [ "$BROWSER" -eq 0 ]; then
            npm run evidence:worlds > /tmp/atlas.log 2>&1
            ATLAS=$?
          fi
          echo "typecheck=$TYPECHECK" >> "$GITHUB_OUTPUT"
          echo "unit=$UNIT" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "browser=$BROWSER" >> "$GITHUB_OUTPUT"
          echo "atlas=$ATLAS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write exact final receipt and PR body
        env:
          TYPECHECK_STATUS: ${{ steps.gates.outputs.typecheck }}
          UNIT_STATUS: ${{ steps.gates.outputs.unit }}
          BUILD_STATUS: ${{ steps.gates.outputs.build }}
          BROWSER_STATUS: ${{ steps.gates.outputs.browser }}
          ATLAS_STATUS: ${{ steps.gates.outputs.atlas }}
        shell: python
        run: |
          import json
          import os
          import platform
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          def load(path):
              try: return json.loads(Path(path).read_text())
              except Exception: return {}
          def tail(path, count=100):
              try: return "\n".join(Path(path).read_text(errors="replace").splitlines()[-count:])
              except Exception: return "No log was produced."

          vitest = load("/tmp/vitest.json")
          playwright = load("/tmp/playwright.json")
          stats = playwright.get("stats", {}) if isinstance(playwright, dict) else {}
          status = {
              "TypeScript": int(os.environ["TYPECHECK_STATUS"]),
              "Unit": int(os.environ["UNIT_STATUS"]),
              "Build": int(os.environ["BUILD_STATUS"]),
              "Browser": int(os.environ["BROWSER_STATUS"]),
              "Atlas": int(os.environ["ATLAS_STATUS"]),
          }
          passed = all(value == 0 for value in status.values())
          result = lambda value: "Passed" if value == 0 else "FAILED"
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
          run_url = f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"

          receipt = f'''# Director's Cut — final QA receipt

          Generated from a clean GitHub Actions checkout on **{now}**.

          - Actions receipt: {run_url}
          - Node: `{subprocess.check_output(["node", "--version"], text=True).strip()}`
          - Runner: `{platform.platform()}`
          - Overall: **{"PASSED" if passed else "FAILED"}**

          | Gate | Result |
          | --- | --- |
          | TypeScript project build | {result(status["TypeScript"])} |
          | Unit and contract tests | {result(status["Unit"])} — {vitest.get("numPassedTests", "unknown")}/{vitest.get("numTotalTests", "unknown")} passed; {vitest.get("numFailedTests", "unknown")} failed; {vitest.get("numPendingTests", "unknown")} pending |
          | Production Vite build | {result(status["Build"])} |
          | Chromium user and visual journeys | {result(status["Browser"])} — {stats.get("expected", "unknown")} expected; {stats.get("unexpected", "unknown")} unexpected; {stats.get("flaky", "unknown")} flaky; {stats.get("skipped", "unknown")} skipped |
          | Reproducible twelve-world atlas | {result(status["Atlas"])} |

          Browser coverage includes authored-world byte and perceptual uniqueness, exposure preservation, paused reduced-motion pixel stability, reversible Clean lens comparison, command navigation, export lifecycle, transparency, fallback rendering, project portability, and media failure paths.

          Machine checks do not replace the real-deck visual loop in `docs/USER_GAUNTLET.md`.
          '''
          Path("docs/QA_FINAL.md").write_text(receipt.replace("          ", ""))
          Path("docs/QA_THIRD_PASS.md").unlink(missing_ok=True)

          failure = Path("docs/QA_FINAL_FAILURES.md")
          if passed:
              failure.unlink(missing_ok=True)
          else:
              failure.write_text(f'''# Final QA failure evidence

          At least one convergence gate failed. The PR remains draft.

          ## TypeScript
          ```text
          {tail("/tmp/typecheck.log")}
          ```

          ## Unit
          ```text
          {tail("/tmp/vitest.log")}
          ```

          ## Build
          ```text
          {tail("/tmp/build.log")}
          ```

          ## Browser
          ```text
          {tail("/tmp/playwright.stderr", 180)}
          ```

          ## World atlas
          ```text
          {tail("/tmp/atlas.log")}
          ```
          ''')

          state = "PASSED" if passed else "FAILED"
          body = f'''## Actual goal

          Make pitch-deck slides feel **filmed rather than decorated**, then make that result reachable without understanding renderer architecture.

          Drift now treats cinematic rendering and creator confidence as one product. The lens, worlds, controls, history, diagnostics, preflight, and evidence serve one route: **Slides → World → Direct → Master**.

          ## What this branch changes

          ### Scene-level optics

          - Deterministic full-frame treatment shared by preview, stills, PNG sequences, and MP4 export.
          - Centre-protected focus with peripheral softness.
          - Velocity-aware smear and bounded chromatic separation.
          - Bloom, warm halation, anamorphic flare, lens curvature, vignette, grain, gate weave, and breathing.
          - Neutral bypass and a separately protected or treated presenter layer.

          ### Authored worlds and atmosphere

          - **12 coherent film worlds**, not palette swaps.
          - **14 procedural atmosphere families** plus transparent output.
          - Exact cyclic motion for seamless masters.
          - Stable recuts that preserve scene identity.
          - Night Run rebuilt around vanishing-point road structure, sparse paired lights, wet reflections, and horizon bloom after the first visual pass rejected its regular dash field.

          ![Twelve authored Drift worlds](docs/media/world-atlas.png)

          ### Creator path

          - Restrained, directed, and heightened direction pressure.
          - Non-compounding new takes and reversible Clean lens comparison.
          - Publishing-oriented output masters.
          - Undo/redo, searchable Director Commands, keyboard access, live announcements, and visible navigation.
          - Mixed-ratio and source-resolution health warnings.
          - Conservative readability pressure without fake semantic slide reading.
          - Preview-only composition and social-interface-safe guides.
          - A deliberate poster moment for still exports.

          ### Export truth

          - Transparent H.264, missing media, unavailable encoders, and unverifiable presenter-audio combinations fail early.
          - 8K-class full-frame optics now fail before unsafe transient GPU allocation; social and 4K masters remain inside the conservative browser guard.
          - Export sessions own timers and abort controllers.
          - Completed work reads **Verified** only after container and decoded-frame checks.
          - Preview and export share one evaluator. There is no flattering fake preview.

          ## User gauntlet

          See [`docs/CREATOR_JOURNEY.md`](docs/CREATOR_JOURNEY.md), [`docs/USER_GAUNTLET.md`](docs/USER_GAUNTLET.md), and [`docs/WORLD_ATLAS.md`](docs/WORLD_ATLAS.md).

          ## Verification: {state}

          - TypeScript: {result(status["TypeScript"])}
          - Unit and contract tests: {vitest.get("numPassedTests", "unknown")}/{vitest.get("numTotalTests", "unknown")} passed
          - Production build: {result(status["Build"])}
          - Chromium journeys: {stats.get("expected", "unknown")} expected; {stats.get("unexpected", "unknown")} unexpected; {stats.get("flaky", "unknown")} flaky; {stats.get("skipped", "unknown")} skipped
          - Reproducible world atlas: {result(status["Atlas"])}
          - Exact receipt: [`docs/QA_FINAL.md`](docs/QA_FINAL.md)

          ## Review focus

          1. Does the focal slide remain readable at maximum optical pressure?
          2. Do worlds remain materially distinct after replacing the bundled study slides?
          3. Does Clean lens reveal honest value rather than novelty filtering?
          4. Can a first-time creator reach a credible cut without opening every expert section?
          5. Do source-health warnings inform without silently rewriting the deck?
          6. Do transparency, reduced motion, poster moments, and seamless loops remain deterministic?
          7. Does keyboard navigation activate the real destination and preserve focus truth?

          ## Scope discipline

          This does **not** turn Drift into a nonlinear editor, automatic deck designer, or semantic slide reader. It deepens the exact job: cinematic, repeatable deck carousels with one optional pinned presenter and trustworthy browser-native export.

          The branch is not merged automatically. Real-deck visual review remains a human gate.
          '''
          Path("/tmp/pr-body.md").write_text(body.replace("          ", ""))
          Path("/tmp/final-status").write_text("0" if passed else "1")

      - name: Squash onto current main and force-update the review branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --soft origin/main
          git add -A
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git commit -m "feat: add Director's Cut optics and creator journey"
          git push --force origin HEAD:gauntlet/directors-cut-optical-pipeline

      - name: Update the pull request from machine truth
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr edit 3 --repo "$GITHUB_REPOSITORY" \
            --title "Director's Cut: cinematic optics, authored worlds, and trustworthy export" \
            --body-file /tmp/pr-body.md
          if [ "$(cat /tmp/final-status)" -eq 0 ]; then
            gh pr ready 3 --repo "$GITHUB_REPOSITORY" || true
          else
            gh pr ready 3 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && gh pr ready 3 --repo "$GITHUB_REPOSITORY" --undo || true
          fi

      - name: Fail visibly when any convergence gate failed
        shell: bash
        run: exit "$(cat /tmp/final-status)"
