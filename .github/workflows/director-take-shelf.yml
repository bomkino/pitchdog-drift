          The Take Shelf stores up to eight visual directions locally. A take includes world, motion, slide treatment, atmosphere, transparency, and lens settings. It never stores slides, filenames, presenter media, or output masters. Restoring a take first saves the current direction as a reversible “Before…” take when needed.
