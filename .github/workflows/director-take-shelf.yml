name: Director take shelf

on:
  push:
    branches: [gauntlet/directors-cut-optical-pipeline]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: director-take-shelf
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/directors-cut-optical-pipeline
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Wait for world-aware command pass
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            git fetch origin gauntlet/directors-cut-optical-pipeline
            if git show origin/gauntlet/directors-cut-optical-pipeline:src/lib/directorCommands.ts 2>/dev/null | grep -q "WORLD_COMMANDS"; then
              git reset --hard origin/gauntlet/directors-cut-optical-pipeline
              exit 0
            fi
            if [ "$attempt" -eq 180 ]; then
              echo "World-aware commands never reached the branch." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Cancel stale branch runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?branch=gauntlet%2Fdirectors-cut-optical-pipeline&per_page=100" \
            --jq ".workflow_runs[] | select(.id != (${CURRENT_RUN}|tonumber)) | select(.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\") | .id" \
            | while read -r run_id; do gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true; done
          sleep 8

      - name: Install locked dependencies
        run: npm ci

      - name: Build the media-free Take Shelf
        shell: bash
        run: |
          set -euo pipefail
          cat > src/lib/directorTakes.ts <<'TS'
          import type { StudioSettings } from "../model";

          export const DIRECTOR_TAKE_VERSION = 1 as const;
          export const MAX_DIRECTOR_TAKES = 8;
          const STORAGE_KEY = "drift:director-takes:v1";

          export interface DirectorTakePatch {
            version: typeof DIRECTOR_TAKE_VERSION;
            themeId: StudioSettings["themeId"];
            stageTransparent: boolean;
            motion: StudioSettings["motion"];
            slide: StudioSettings["slide"];
            background: StudioSettings["background"];
            optics: StudioSettings["optics"];
          }

          export interface StoredDirectorTake {
            id: string;
            name: string;
            savedAt: number;
            patch: DirectorTakePatch;
          }

          function object(value: unknown): value is Record<string, unknown> {
            return Boolean(value) && typeof value === "object" && !Array.isArray(value);
          }

          export function isDirectorTakePatch(value: unknown): value is DirectorTakePatch {
            if (!object(value)) return false;
            return value.version === DIRECTOR_TAKE_VERSION
              && typeof value.themeId === "string"
              && typeof value.stageTransparent === "boolean"
              && object(value.motion)
              && object(value.slide)
              && object(value.background)
              && object(value.optics);
          }

          export function captureDirectorTake(settings: StudioSettings): DirectorTakePatch {
            return structuredClone({
              version: DIRECTOR_TAKE_VERSION,
              themeId: settings.themeId,
              stageTransparent: settings.stage.transparent,
              motion: settings.motion,
              slide: settings.slide,
              background: settings.background,
              optics: settings.optics,
            });
          }

          export function applyDirectorTake(current: StudioSettings, patch: unknown): StudioSettings {
            if (!isDirectorTakePatch(patch)) return current;
            return {
              ...current,
              themeId: patch.themeId,
              stage: { ...current.stage, transparent: patch.stageTransparent },
              motion: structuredClone(patch.motion),
              slide: structuredClone(patch.slide),
              background: structuredClone(patch.background),
              optics: structuredClone(patch.optics),
            };
          }

          function cleanName(value: unknown): string {
            if (typeof value !== "string") return "Untitled take";
            const name = value.replace(/\s+/g, " ").trim().slice(0, 72);
            return name || "Untitled take";
          }

          export function sanitizeDirectorTakes(value: unknown): StoredDirectorTake[] {
            if (!Array.isArray(value)) return [];
            const seen = new Set<string>();
            const takes: StoredDirectorTake[] = [];
            for (const candidate of value) {
              if (!object(candidate)) continue;
              const id = typeof candidate.id === "string" ? candidate.id.trim() : "";
              const savedAt = typeof candidate.savedAt === "number" && Number.isFinite(candidate.savedAt)
                ? candidate.savedAt
                : Date.now();
              if (!id || seen.has(id) || !isDirectorTakePatch(candidate.patch)) continue;
              seen.add(id);
              takes.push({ id, name: cleanName(candidate.name), savedAt, patch: structuredClone(candidate.patch) });
              if (takes.length >= MAX_DIRECTOR_TAKES) break;
            }
            return takes;
          }

          export function createDirectorTake(
            name: string,
            patch: DirectorTakePatch,
            id = typeof crypto !== "undefined" && "randomUUID" in crypto
              ? crypto.randomUUID()
              : `take-${Date.now()}-${Math.random().toString(36).slice(2)}`,
            savedAt = Date.now(),
          ): StoredDirectorTake {
            return { id, name: cleanName(name), savedAt, patch: structuredClone(patch) };
          }

          function loadTakes(): StoredDirectorTake[] {
            try {
              return sanitizeDirectorTakes(JSON.parse(localStorage.getItem(STORAGE_KEY) ?? "[]"));
            } catch {
              return [];
            }
          }

          function persistTakes(takes: StoredDirectorTake[]): void {
            try {
              localStorage.setItem(STORAGE_KEY, JSON.stringify(sanitizeDirectorTakes(takes)));
            } catch {
              // A full or disabled localStorage must not destabilise the studio.
            }
          }

          function samePatch(a: DirectorTakePatch, b: DirectorTakePatch): boolean {
            return JSON.stringify(a) === JSON.stringify(b);
          }

          function requestCurrentPatch(): Promise<DirectorTakePatch> {
            return new Promise((resolve, reject) => {
              const timeout = window.setTimeout(() => {
                window.removeEventListener("drift:director-take-snapshot", onSnapshot as EventListener);
                reject(new Error("Current direction is not available yet."));
              }, 1200);
              const onSnapshot = (event: Event): void => {
                const patch = (event as CustomEvent<unknown>).detail;
                if (!isDirectorTakePatch(patch)) return;
                window.clearTimeout(timeout);
                window.removeEventListener("drift:director-take-snapshot", onSnapshot as EventListener);
                resolve(structuredClone(patch));
              };
              window.addEventListener("drift:director-take-snapshot", onSnapshot as EventListener);
              window.dispatchEvent(new Event("drift:director-take-request"));
            });
          }

          function exportActive(): boolean {
            return Array.from(document.querySelectorAll<HTMLElement>(
              ".export-overlay, [data-exporting='true'], [aria-label='Export progress']",
            )).some((element) => {
              const style = window.getComputedStyle(element);
              const rect = element.getBoundingClientRect();
              return style.display !== "none" && style.visibility !== "hidden" && rect.width > 0 && rect.height > 0;
            });
          }

          const STYLE_ID = "drift-director-take-style";
          const ROOT_ID = "drift-director-take-root";

          function installStyles(): void {
            if (document.getElementById(STYLE_ID)) return;
            const style = document.createElement("style");
            style.id = STYLE_ID;
            style.textContent = `
              .director-take-launcher { position: fixed; right: max(16px, env(safe-area-inset-right)); bottom: calc(max(16px, env(safe-area-inset-bottom)) + 46px); z-index: 8999; display: inline-flex; align-items: center; gap: 8px; min-height: 34px; padding: 0 11px; border: 1px solid rgba(255,255,255,.13); border-radius: 999px; background: rgba(16,16,19,.78); color: rgba(245,241,232,.76); box-shadow: 0 12px 36px rgba(0,0,0,.2); backdrop-filter: blur(14px); font: 650 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .08em; text-transform: uppercase; cursor: pointer; }
              .director-take-launcher:hover, .director-take-launcher:focus-visible { color: #fffaf0; border-color: rgba(255,255,255,.27); outline: none; }
              .director-take-count { display: grid; min-width: 18px; height: 18px; place-items: center; border-radius: 999px; background: rgba(255,255,255,.09); }
              .director-take-root { position: fixed; inset: 0; z-index: 10001; display: none; place-items: start center; padding: max(9vh,64px) 18px 24px; background: rgba(5,5,7,.64); backdrop-filter: blur(18px) saturate(.82); }
              .director-take-root[data-open='true'] { display: grid; }
              .director-take-dialog { width: min(620px,100%); max-height: min(78vh,760px); overflow: hidden; border: 1px solid rgba(255,255,255,.16); border-radius: 24px; background: color-mix(in srgb,#151518 94%,transparent); color: #f5f1e8; box-shadow: 0 36px 120px rgba(0,0,0,.58); }
              .director-take-head { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: end; padding: 18px; border-bottom: 1px solid rgba(255,255,255,.1); }
              .director-take-kicker { margin: 0 0 5px; font: 600 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .14em; text-transform: uppercase; opacity: .58; }
              .director-take-title { margin: 0; font: 620 22px/1.15 system-ui,sans-serif; }
              .director-take-save { min-height: 38px; padding: 0 13px; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; background: rgba(255,255,255,.09); color: inherit; font: 650 10px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .07em; text-transform: uppercase; cursor: pointer; }
              .director-take-list { overflow: auto; max-height: 52vh; padding: 8px; }
              .director-take-row { display: grid; grid-template-columns: minmax(0,1fr) auto auto; gap: 8px; align-items: center; padding: 9px; border-radius: 15px; }
              .director-take-row:hover { background: rgba(255,255,255,.055); }
              .director-take-name { width: 100%; min-width: 0; box-sizing: border-box; border: 0; border-bottom: 1px solid transparent; outline: 0; padding: 7px 4px; background: transparent; color: inherit; font: 560 13px/1.3 system-ui,sans-serif; }
              .director-take-name:focus { border-bottom-color: rgba(255,235,194,.5); }
              .director-take-action { min-height: 32px; padding: 0 10px; border: 1px solid rgba(255,255,255,.11); border-radius: 999px; background: transparent; color: rgba(245,241,232,.72); font: 620 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
              .director-take-action:hover, .director-take-action:focus-visible { color: #fffaf0; border-color: rgba(255,255,255,.25); outline: none; }
              .director-take-delete { padding-inline: 9px; color: rgba(245,241,232,.46); }
              .director-take-empty { padding: 38px 22px; text-align: center; color: rgba(245,241,232,.55); font: 480 12px/1.55 system-ui,sans-serif; }
              .director-take-foot { display: flex; justify-content: space-between; gap: 12px; padding: 11px 18px 13px; border-top: 1px solid rgba(255,255,255,.08); color: rgba(245,241,232,.45); font: 500 9px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .06em; text-transform: uppercase; }
              .director-take-live { position: fixed; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
              @media (max-width: 620px) { .director-take-root { padding-top: 18px; } .director-take-head { grid-template-columns: 1fr; } .director-take-save { justify-self: start; } .director-take-row { grid-template-columns: minmax(0,1fr) auto; } .director-take-delete { grid-column: 2; } .director-take-launcher span:first-child { display: none; } }
              @media (prefers-reduced-motion: reduce) { .director-take-root, .director-take-launcher { backdrop-filter: none; } }
            `;
            document.head.append(style);
          }

          export function installDirectorTakeShelf(): () => void {
            if (document.getElementById(ROOT_ID)) return () => undefined;
            installStyles();
            const root = document.createElement("div");
            root.id = ROOT_ID;
            root.className = "director-take-root";
            root.dataset.open = "false";
            root.innerHTML = `
              <section class="director-take-dialog" role="dialog" aria-modal="true" aria-label="Director takes">
                <header class="director-take-head">
                  <div><p class="director-take-kicker">Local visual directions · no media stored</p><h2 class="director-take-title">Take Shelf</h2></div>
                  <button class="director-take-save" type="button">Save current take</button>
                </header>
                <div class="director-take-list"></div>
                <footer class="director-take-foot"><span>Up to 8 directions</span><span>Restore never touches media or output</span></footer>
              </section>`;
            const launcher = document.createElement("button");
            launcher.type = "button";
            launcher.className = "director-take-launcher";
            launcher.setAttribute("aria-haspopup", "dialog");
            launcher.setAttribute("aria-expanded", "false");
            launcher.setAttribute("data-director-command", "takes");
            launcher.innerHTML = `<span>Takes</span><span class="director-take-count" aria-label="0 saved takes">0</span>`;
            const live = document.createElement("div");
            live.className = "director-take-live";
            live.setAttribute("role", "status");
            live.setAttribute("aria-live", "polite");
            document.body.append(root, launcher, live);
            const list = root.querySelector<HTMLDivElement>(".director-take-list")!;
            const saveButton = root.querySelector<HTMLButtonElement>(".director-take-save")!;
            const count = launcher.querySelector<HTMLSpanElement>(".director-take-count")!;
            let takes = loadTakes();
            let returnFocus: HTMLElement | null = null;

            const render = (): void => {
              count.textContent = String(takes.length);
              count.setAttribute("aria-label", `${takes.length} saved ${takes.length === 1 ? "take" : "takes"}`);
              list.replaceChildren();
              if (takes.length === 0) {
                const empty = document.createElement("div");
                empty.className = "director-take-empty";
                empty.textContent = "Save a direction before exploring the next one. The shelf stores settings only—never slides, filenames, or presenter media.";
                list.append(empty);
                return;
              }
              for (const take of takes) {
                const row = document.createElement("div");
                row.className = "director-take-row";
                row.dataset.takeId = take.id;
                const name = document.createElement("input");
                name.className = "director-take-name";
                name.value = take.name;
                name.maxLength = 72;
                name.setAttribute("aria-label", `Name for ${take.name}`);
                name.addEventListener("change", () => {
                  take.name = cleanName(name.value);
                  name.value = take.name;
                  persistTakes(takes);
                });
                const restore = document.createElement("button");
                restore.type = "button";
                restore.className = "director-take-action";
                restore.textContent = "Restore";
                restore.setAttribute("aria-label", `Restore ${take.name}`);
                restore.addEventListener("click", async () => {
                  try {
                    const current = await requestCurrentPatch();
                    if (!samePatch(current, take.patch)) {
                      const backup = createDirectorTake(`Before ${take.name}`, current);
                      takes = [backup, ...takes.filter((candidate) => !samePatch(candidate.patch, current))].slice(0, MAX_DIRECTOR_TAKES);
                      persistTakes(takes);
                    }
                    window.dispatchEvent(new CustomEvent<DirectorTakePatch>("drift:director-take-apply", { detail: structuredClone(take.patch) }));
                    live.textContent = `${take.name} restored. Presenter media and output settings were preserved.`;
                    render();
                  } catch (error) {
                    live.textContent = error instanceof Error ? error.message : "Take could not be restored.";
                  }
                });
                const remove = document.createElement("button");
                remove.type = "button";
                remove.className = "director-take-action director-take-delete";
                remove.textContent = "Delete";
                remove.setAttribute("aria-label", `Delete ${take.name}`);
                remove.addEventListener("click", () => {
                  takes = takes.filter((candidate) => candidate.id !== take.id);
                  persistTakes(takes);
                  live.textContent = `${take.name} deleted.`;
                  render();
                });
                row.append(name, restore, remove);
                list.append(row);
              }
            };
            const close = (): void => {
              root.dataset.open = "false";
              launcher.setAttribute("aria-expanded", "false");
              returnFocus?.focus({ preventScroll: true });
              returnFocus = null;
            };
            const open = (): void => {
              if (launcher.hidden) return;
              returnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : launcher;
              root.dataset.open = "true";
              launcher.setAttribute("aria-expanded", "true");
              render();
              requestAnimationFrame(() => saveButton.focus());
            };
            const saveCurrent = async (): Promise<void> => {
              try {
                const patch = await requestCurrentPatch();
                const duplicate = takes.find((take) => samePatch(take.patch, patch));
                if (duplicate) {
                  live.textContent = `${duplicate.name} already holds this direction.`;
                  return;
                }
                const index = takes.length + 1;
                const readableTheme = String(patch.themeId).replace(/-/g, " ");
                const take = createDirectorTake(`Take ${String(index).padStart(2, "0")} · ${readableTheme}`, patch);
                takes = [take, ...takes].slice(0, MAX_DIRECTOR_TAKES);
                persistTakes(takes);
                live.textContent = `${take.name} saved locally without media.`;
                render();
              } catch (error) {
                live.textContent = error instanceof Error ? error.message : "Current direction could not be saved.";
              }
            };
            const syncExportBoundary = (): void => {
              const active = exportActive();
              launcher.hidden = active;
              if (active && root.dataset.open === "true") close();
            };
            const observer = new MutationObserver(syncExportBoundary);
            observer.observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["class", "hidden", "aria-hidden", "data-exporting"] });
            const onLauncher = (): void => open();
            const onBackdrop = (event: MouseEvent): void => { if (event.target === root) close(); };
            const onKeydown = (event: KeyboardEvent): void => {
              if (root.dataset.open !== "true") return;
              if (event.key === "Escape") { event.preventDefault(); close(); return; }
              if (event.key !== "Tab") return;
              const focusable = Array.from(root.querySelectorAll<HTMLElement>("button:not([disabled]), input:not([disabled]), [href], [tabindex]:not([tabindex='-1'])"));
              const first = focusable[0];
              const last = focusable[focusable.length - 1];
              if (first && last && event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
              else if (first && last && !event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
            };
            launcher.addEventListener("click", onLauncher);
            saveButton.addEventListener("click", saveCurrent);
            root.addEventListener("click", onBackdrop);
            document.addEventListener("keydown", onKeydown);
            syncExportBoundary();
            render();
            return () => {
              observer.disconnect();
              launcher.removeEventListener("click", onLauncher);
              saveButton.removeEventListener("click", saveCurrent);
              root.removeEventListener("click", onBackdrop);
              document.removeEventListener("keydown", onKeydown);
              root.remove();
              launcher.remove();
              live.remove();
            };
          }
          TS

          node --input-type=module <<'JS'
          import fs from "node:fs";
          import ts from "typescript";

          const path = "src/App.tsx";
          let text = fs.readFileSync(path, "utf8");
          const importLine = 'import { applyDirectorTake, captureDirectorTake, type DirectorTakePatch } from "./lib/directorTakes";';
          if (!text.includes(importLine)) {
            const source = ts.createSourceFile(path, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX);
            const imports = source.statements.filter((statement) => ts.isImportDeclaration(statement));
            const lastImport = imports.at(-1);
            if (!lastImport) throw new Error("App.tsx has no import block.");
            text = text.slice(0, lastImport.end) + `\n${importLine}` + text.slice(lastImport.end);
          }
          if (!text.includes("drift:director-take-request")) {
            const source = ts.createSourceFile(path, text, ts.ScriptTarget.Latest, true, ts.ScriptKind.TSX);
            let found;
            const visit = (node) => {
              if (!found && ts.isVariableDeclaration(node) && ts.isArrayBindingPattern(node.name) && node.name.elements.length >= 2 && node.initializer && ts.isCallExpression(node.initializer)) {
                const expression = node.initializer.expression.getText(source);
                const names = node.name.elements.map((element) => element.name?.getText(source));
                const typeText = node.initializer.typeArguments?.map((argument) => argument.getText(source)).join(" ") ?? "";
                if (expression.endsWith("useState") && (typeText.includes("StudioSettings") || names[0] === "settings")) {
                  found = { statement: node.parent.parent, settings: names[0], setter: names[1] };
                  return;
                }
              }
              ts.forEachChild(node, visit);
            };
            visit(source);
            if (!found?.settings || !found?.setter) throw new Error("Could not locate the StudioSettings state pair in App.tsx.");
            const effect = `\n\n  useEffect(() => {\n    const sendDirectorTake = () => {\n      window.dispatchEvent(new CustomEvent<DirectorTakePatch>("drift:director-take-snapshot", {\n        detail: captureDirectorTake(${found.settings}),\n      }));\n    };\n    const applySavedDirectorTake = (event: Event) => {\n      const patch = (event as CustomEvent<DirectorTakePatch>).detail;\n      ${found.setter}((current) => applyDirectorTake(current, patch));\n    };\n    window.addEventListener("drift:director-take-request", sendDirectorTake);\n    window.addEventListener("drift:director-take-apply", applySavedDirectorTake);\n    return () => {\n      window.removeEventListener("drift:director-take-request", sendDirectorTake);\n      window.removeEventListener("drift:director-take-apply", applySavedDirectorTake);\n    };\n  }, [${found.settings}]);`;
            text = text.slice(0, found.statement.end) + effect + text.slice(found.statement.end);
          }
          fs.writeFileSync(path, text);
          JS

          python - <<'PY'
          from pathlib import Path
          path = Path('src/main.tsx')
          original = path.read_text()
          text = original
          import_line = 'import { installDirectorTakeShelf } from "./lib/directorTakes";'
          if import_line not in text:
              lines = text.splitlines()
              last_import = max(i for i, line in enumerate(lines) if line.startswith('import '))
              lines.insert(last_import + 1, import_line)
              text = '\n'.join(lines) + ('\n' if original.endswith('\n') else '')
          if 'installDirectorTakeShelf();' not in text:
              anchor = 'installDirectorCommandPalette();'
              if anchor not in text:
                  raise SystemExit('Director command installer not found in main.tsx')
              text = text.replace(anchor, anchor + '\ninstallDirectorTakeShelf();', 1)
          path.write_text(text)
          PY

          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/directorCommands.ts')
          text = path.read_text()
          if 'id: "takes"' not in text:
              anchor = '''  {
              id: "undo",'''
              insertion = '''  {
              id: "takes",
              title: "Open the Take Shelf",
              description: "Save this visual direction before exploring the next one.",
              section: "Recover",
              keywords: ["save", "version", "snapshot", "compare", "takes", "shelf"],
              targets: ["Takes"],
              mode: "click",
              shortcut: "T",
            },
            {
              id: "undo",'''
              if anchor not in text:
                  raise SystemExit('Undo command anchor not found')
              text = text.replace(anchor, insertion, 1)
          old = '({ a: "add-slides", n: "new-take", g: "guides", e: "output" } as const)'
          new = '({ a: "add-slides", n: "new-take", g: "guides", e: "output", t: "takes" } as const)'
          if old in text:
              text = text.replace(old, new, 1)
              text = text.replace('key as "a" | "n" | "g" | "e"', 'key as "a" | "n" | "g" | "e" | "t"', 1)
          elif 't: "takes"' not in text:
              raise SystemExit('Direct-command map anchor not found')
          path.write_text(text)
          PY

          cat > tests/directorTakes.test.ts <<'TS'
          import { describe, expect, it } from "vitest";
          import { DEFAULT_SETTINGS, cloneSettings } from "../src/model";
          import {
            MAX_DIRECTOR_TAKES,
            applyDirectorTake,
            captureDirectorTake,
            createDirectorTake,
            isDirectorTakePatch,
            sanitizeDirectorTakes,
          } from "../src/lib/directorTakes";

          describe("director takes", () => {
            it("captures and restores visual direction without media or master settings", () => {
              const source = cloneSettings(DEFAULT_SETTINGS);
              source.motion.speed = 0.91;
              source.background.seed = 444;
              source.optics.intensity = 0.88;
              const patch = captureDirectorTake(source);
              const current = cloneSettings(DEFAULT_SETTINGS);
              current.output.width = 2160;
              current.output.height = 3840;
              current.presenter.assetId = "presenter-kept";
              current.presenter.enabled = true;
              current.stage.width = 1350;
              current.stage.height = 1080;
              const restored = applyDirectorTake(current, patch);
              expect(restored.motion.speed).toBe(0.91);
              expect(restored.background.seed).toBe(444);
              expect(restored.optics.intensity).toBe(0.88);
              expect(restored.output).toEqual(current.output);
              expect(restored.presenter).toEqual(current.presenter);
              expect(restored.stage.width).toBe(1350);
              expect(restored.stage.height).toBe(1080);
            });

            it("deep-clones captured and restored settings", () => {
              const source = cloneSettings(DEFAULT_SETTINGS);
              const patch = captureDirectorTake(source);
              source.motion.speed = 9;
              expect(patch.motion.speed).not.toBe(9);
              const restored = applyDirectorTake(cloneSettings(DEFAULT_SETTINGS), patch);
              restored.motion.speed = 7;
              expect(patch.motion.speed).not.toBe(7);
            });

            it("rejects malformed patches instead of guessing", () => {
              expect(isDirectorTakePatch({ version: 1 })).toBe(false);
              const current = cloneSettings(DEFAULT_SETTINGS);
              expect(applyDirectorTake(current, { version: 1 })).toBe(current);
            });

            it("deduplicates ids and enforces the eight-take shelf", () => {
              const patch = captureDirectorTake(DEFAULT_SETTINGS);
              const candidates = Array.from({ length: MAX_DIRECTOR_TAKES + 5 }, (_, index) =>
                createDirectorTake(`Take ${index}`, patch, `take-${index}`, index),
              );
              candidates.push(createDirectorTake("Duplicate", patch, "take-0", 100));
              const sanitized = sanitizeDirectorTakes(candidates);
              expect(sanitized).toHaveLength(MAX_DIRECTOR_TAKES);
              expect(new Set(sanitized.map((take) => take.id)).size).toBe(MAX_DIRECTOR_TAKES);
            });
          });
          TS

