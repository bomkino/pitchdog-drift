name: Sonic audit snapshot

on:
  push:
    branches:
      - feat/tactile-sound-system-v2

permissions:
  contents: read

concurrency:
  group: sonic-audit-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Package reviewable source
        shell: bash
        run: |
          set -euo pipefail
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=playwright-report \
            --exclude=test-results \
            -czf /tmp/pitchdog-drift-sonic-audit-source.tar.gz .
          sha256sum /tmp/pitchdog-drift-sonic-audit-source.tar.gz > /tmp/SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > /tmp/COMMIT_SHA

      - name: Upload exact source receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitchdog-drift-sonic-audit-source
          path: |
            /tmp/pitchdog-drift-sonic-audit-source.tar.gz
            /tmp/SHA256SUMS
            /tmp/COMMIT_SHA
          if-no-files-found: error
          retention-days: 1
