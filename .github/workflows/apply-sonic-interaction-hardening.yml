name: Apply sonic interaction hardening

on:
  push:
    branches:
      - feat/tactile-sound-system-v2
    paths:
      - .github/workflows/apply-sonic-interaction-hardening.yml

permissions:
  contents: write

concurrency:
  group: apply-sonic-interaction-hardening
  cancel-in-progress: false

jobs:
  apply:
    if: github.repository == 'bomkino/pitchdog-drift'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out exact draft head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/tactile-sound-system-v2
          fetch-depth: 0

      - name: Refuse stale or concurrent application
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/tactile-sound-system-v2
          branch_head="$(git rev-parse origin/feat/tactile-sound-system-v2)"
          if [[ "$branch_head" != "$GITHUB_SHA" ]]; then
            echo "Branch advanced from workflow event $GITHUB_SHA to $branch_head; refusing stale patch." >&2
            exit 1
          fi

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply source hardening
