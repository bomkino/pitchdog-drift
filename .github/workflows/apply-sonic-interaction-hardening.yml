        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path
          payload = ''.join(os.environ['PATCH_GZIP_BASE64'].split())
          Path('/tmp/apply-sonic-interaction-hardening.py').write_bytes(
              gzip.decompress(base64.b64decode(payload))
          )
          PY
          python3 /tmp/apply-sonic-interaction-hardening.py

      - name: Verify type, unit, build, bundle, and treatment gates
        run: npm run check

      - name: Install pinned Chromium
        run: npx playwright install chromium

      - name: Verify the sound user journey
        run: npx playwright test e2e/sonic-interactions.e2e.ts e2e/sonic-loading.e2e.ts

      - name: Remove one-shot machinery and commit the clean branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/tactile-sound-system-v2
          branch_head="$(git rev-parse origin/feat/tactile-sound-system-v2)"
          if [[ "$branch_head" != "$GITHUB_SHA" ]]; then
            echo "Branch advanced during validation; refusing to overwrite $branch_head." >&2
            exit 1
          fi

          rm -f .github/workflows/apply-sonic-interaction-hardening.yml
          rm -f .github/sonic-phase-parity-trigger
          test ! -e .github/workflows/apply-sonic-interaction-hardening.yml
