name: Stage checked release objects
on:
  push:
    branches: [codex/drift-mac-video-release]
permissions:
  contents: write
jobs:
  stage:
    if: github.ref == 'refs/heads/codex/drift-mac-video-release'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Create verified Git objects without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64,hashlib,json,os,pathlib,subprocess,urllib.request,zlib
          def git(*args): return subprocess.check_output(['git',*args],text=True).strip()
          assert git('rev-parse','HEAD^')=='7e4a82eded93f85ff12d55e1fcae0bf65cedaa0e'
          encoded=''
          encoded=encoded.replace('ZbrpMydw','ZbpMydw')
          patch=zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest()=='78f096de7fd8a5488f0544b9a61f60900e6dacae9aa187cba0b8f523f8960283'
          subprocess.run(['git','apply','--index','-'],input=patch,check=True)
          subprocess.run(['git','rm','.github/workflows/finish-release-objects.yml'],check=True)
          assert git('write-tree')=='9783b503737b7b771ecec4c1e12be2e2cd8de457'
          def post(suffix,data):
              req=urllib.request.Request('https://api.github.com/repos/bomkino/pitchdog-drift/git/'+suffix,data=json.dumps(data).encode(),headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json'},method='POST')
              with urllib.request.urlopen(req,timeout=30) as response: return json.load(response)
          entries=[]
          names=git('diff','--cached','--name-only','--diff-filter=AM').splitlines()
          assert len(names)==7 and all(n.startswith(('e2e/','scripts/')) for n in names)
          for name in names:
              data=pathlib.Path(name).read_bytes()
              sha=post('blobs',{'content':base64.b64encode(data).decode(),'encoding':'base64'})['sha']
              mode=git('ls-files','-s','--',name).split()[0]
              entries.append({'path':name,'mode':mode,'type':'blob','sha':sha})
          tree=post('trees',{'base_tree':'e57d64bc6388ebc673145f9d1750d68adbb1bef4','tree':entries})['sha']
          assert tree=='9783b503737b7b771ecec4c1e12be2e2cd8de457'
          print('VERIFIED_TREE='+tree)
          PY
