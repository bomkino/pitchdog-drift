name: Polish cinematic lighting rig

on:
  push:
    branches:
      - feat/cinematic-lighting-rig
    paths:
      - .gauntlet/fix-cinematic-lighting.py
      - .github/workflows/lighting-rig-polish.yml
  pull_request:
    branches:
      - main
    paths:
      - .gauntlet/fix-cinematic-lighting.py
      - .github/workflows/lighting-rig-polish.yml

permissions:
  contents: write

concurrency:
  group: lighting-rig-polish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  polish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out lighting branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: feat/cinematic-lighting-rig

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Correct the two-surface patch guard
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.gauntlet/fix-cinematic-lighting.py')
          source = path.read_text(encoding='utf-8')
          old = '''    count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one {label} in {relative}; found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")'''.replace('          ', '')
          new = '''    count = text.count(old)
              expected = 2 if label == "moving-shadow duplicate phase upload" else 1
              if count != expected:
                  raise RuntimeError(f"Expected {expected} {label} in {relative}; found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")'''.replace('          ', '')
          if source.count(old) != 1:
              raise RuntimeError('Could not isolate the exact-count guard')
          path.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply regression fixes and remove bootstrap machinery
        run: python .gauntlet/fix-cinematic-lighting.py

      - name: Reject malformed diffs
        run: git diff --check

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, unit test, and build
        run: npm run check

      - name: Commit ordinary reviewable source
        run: |
          git config user.name "pitch.dog lighting gauntlet"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: preserve lighting fidelity and export contracts"
          git push origin HEAD:feat/cinematic-lighting-rig

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete real-browser gauntlet
        run: npm run test:e2e
