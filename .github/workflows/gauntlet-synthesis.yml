name: Director journey synthesis

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/gauntlet-synthesis.yml
      - scripts/gauntlet-synthesis.mjs
      - scripts/gauntlet-fix-generated.mjs
      - scripts/gauntlet-fix-semantics.mjs

permissions:
  contents: write

concurrency:
  group: director-journey-synthesis-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  synthesize:
    if: github.head_ref == 'gauntlet/cinematic-optics-worlds'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the real synthesis branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/cinematic-optics-worlds
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Fetch the frozen journey reference
        run: git fetch --no-tags origin b4bb164faecc3d5cdf92895b41439f9f5041a55a

      - name: Synthesize the user journey onto the cinematic branch
        run: node scripts/gauntlet-synthesis.mjs

      - name: Complete the generated media journey
        run: node scripts/gauntlet-fix-generated.mjs

      - name: Make saved slide motion and temporary preview pause truthful
        run: node scripts/gauntlet-fix-semantics.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run repaired cinematic and journey contracts first
        run: npx playwright test e2e/cinematic.e2e.ts e2e/journey.e2e.ts e2e/mediaJourney.e2e.ts --retries=0

      - name: Run repaired legacy journeys first
        run: >-
          npx playwright test e2e/studio.e2e.ts
          --grep "keyboard controls|handles empty|saved starter studies|presenter playback|portable project survives|unsupported saved project|slow older autosave|export lifecycle"
          --retries=0

      - name: Run the complete browser gauntlet
        run: npm run test:e2e

      - name: Preserve synthesis failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: director-journey-synthesis-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Commit only after every gate passes
        run: |
          git config user.name "pitch.dog gauntlet"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: build an intent-first cinematic director journey"
          git push origin HEAD:gauntlet/cinematic-optics-worlds
