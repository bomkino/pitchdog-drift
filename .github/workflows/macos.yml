name: macOS standalone app

on:
  pull_request:
    paths:
      - ".github/workflows/macos.yml"
      - "macos/**"
      - "scripts/build-macos-app.sh"
      - "scripts/check-macos-source.mjs"
      - "scripts/generate-macos-icon.py"
      - "scripts/package-macos-dmg.sh"
      - "scripts/verify-macos-app.sh"
      - "docs/MACOS_*.md"
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - "tsconfig*.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-standalone-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-contract:
    name: Native source contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Enforce canonical Mac architecture
        run: npm run check:mac-source

  universal-app:
    name: Universal signed app and mounted DMG
    needs: source-contract
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify shared web engine and native source
        run: npm run check

      - name: Build the system-codec-only universal app
        env:
          DRIFT_SKIP_WEB_CHECKS: "1"
          DRIFT_BUILD_NUMBER: ${{ github.run_number }}
          DRIFT_SOURCE_REVISION: ${{ github.sha }}
          DRIFT_EXPECT_ARCHS: arm64 x86_64
        run: npm run build:mac

      - name: Re-run the signed bundle gauntlet
        env:
          DRIFT_EXPECT_ARCHS: arm64 x86_64
        run: npm run verify:mac

      - name: Package, mount, and verify the install image
        env:
          DRIFT_SKIP_APP_BUILD: "1"
          DRIFT_DMG_OUTPUT: ${{ github.workspace }}/build/macos/Drift.dmg
          DRIFT_EXPECT_ARCHS: arm64 x86_64
        run: npm run package:mac:dmg

      - name: Inspect local evidence without publishing it
        shell: bash
        run: |
          set -euo pipefail
          test -d build/macos/Drift.app
          test -f build/macos/Drift.dmg
          test -f build/macos/Drift.dmg.sha256
          grep -Fx "source_revision=${GITHUB_SHA}" build/macos/Drift.app/Contents/Resources/BuildReceipt.txt
          shasum -a 256 -c build/macos/Drift.dmg.sha256
          git diff --exit-code
          echo "The runner proved the app and install image, then retained no downloadable binary artifact."
