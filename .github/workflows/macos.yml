name: macOS standalone app

on:
  push:
    branches: [main, feat/native-macos-studio, integration/mega-main-native]
    paths:
      - "macos/**"
      - "scripts/build-macos-app.sh"
      - "scripts/build-macos-web.mjs"
      - "scripts/check-macos-hardening.mjs"
      - "scripts/check-macos-matrix-budget.mjs"
      - "scripts/check-macos-source.mjs"
      - "scripts/check-native-import-contract.mjs"
      - "scripts/generate-macos-icon.py"
      - "scripts/package-macos-dmg.sh"
      - "scripts/probe-macos-packaged-webview.sh"
      - "scripts/release-macos-app.sh"
      - "scripts/verify-macos-app.sh"
      - "scripts/verify-macos-dmg.sh"
      - "scripts/verify-macos-release.sh"
      - "src/**"
      - "tests/**"
      - "docs/MACOS_*.md"
      - "docs/mega-main/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/macos.yml"
  pull_request:
    paths:
      - "macos/**"
      - "scripts/build-macos-app.sh"
      - "scripts/build-macos-web.mjs"
      - "scripts/check-macos-hardening.mjs"
      - "scripts/check-macos-matrix-budget.mjs"
      - "scripts/check-macos-source.mjs"
      - "scripts/check-native-import-contract.mjs"
      - "scripts/generate-macos-icon.py"
      - "scripts/package-macos-dmg.sh"
      - "scripts/probe-macos-packaged-webview.sh"
      - "scripts/release-macos-app.sh"
      - "scripts/verify-macos-app.sh"
      - "scripts/verify-macos-dmg.sh"
      - "scripts/verify-macos-release.sh"
      - "src/**"
      - "tests/**"
      - "docs/MACOS_*.md"
      - "docs/mega-main/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/macos.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-tests:
    name: Native source and broker gauntlet
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify native source contract
        run: npm run check:mac-source

      - name: Compile and run native file-broker gauntlet
        run: |
          set -euo pipefail
          SDK_PATH="$(xcrun --sdk macosx --show-sdk-path)"
          xcrun --sdk macosx swiftc \
            -parse-as-library \
            -O \
            -whole-module-optimization \
            -sdk "$SDK_PATH" \
            -target "arm64-apple-macos13.3" \
            -framework AppKit \
            -framework AudioToolbox \
            -framework Foundation \
            -framework UniformTypeIdentifiers \
            macos/App/NativeModels.swift \
            macos/App/NativeDocumentSession.swift \
            macos/App/NativeFileBroker.swift \
            macos/App/NativeAacEncoder.swift \
            macos/App/NativeGauntlet.swift \
            macos/Probes/NativeGauntletMain.swift \
            -o "$RUNNER_TEMP/DriftNativeGauntlet"
          "$RUNNER_TEMP/DriftNativeGauntlet"

  mac-build:
    name: Build and falsify universal signed app
    runs-on: macos-15
    timeout-minutes: 35
    # Build, signature, entitlement, manifest, broker and packaging verification
    # defer only the one sandboxed GUI launch. The immediately following matrix
    # is mandatory and exercises the exact app across signing/sandbox variants.
    env:
      DRIFT_SKIP_PACKAGED_WEBVIEW_SELF_TEST: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build universal signed app
        id: app_build
        continue-on-error: true
        env:
          DRIFT_MACOS_ARCHS: "arm64 x86_64"
          DRIFT_EXPECT_ARCHS: "arm64 x86_64"
          DRIFT_BUILD_NUMBER: ${{ github.run_number }}
          DRIFT_SOURCE_REVISION: ${{ github.sha }}
        run: npm run build:mac

      - name: Record incomplete-build evidence
        if: steps.app_build.outcome != 'success'
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.app_build.outcome }}
        run: |
          mkdir -p build/macos/packaged-webview
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          output = Path("build/macos/packaged-webview/matrix-summary.json")
          output.write_text(json.dumps({
              "schemaVersion": 1,
              "productionVariantPassed": False,
              "matrixAttempted": False,
              "failureStage": "app-build",
              "buildOutcome": os.environ["BUILD_OUTCOME"],
              "diagnosis": "The app build or signed-bundle verification failed. Packaged WebKit was not launched against a partial bundle.",
              "variants": [],
          }, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Falsify packaged WebKit across signing and sandbox boundaries
        id: webview_matrix
        if: steps.app_build.outcome == 'success'
        continue-on-error: true
        env:
          DRIFT_WEBVIEW_MATRIX_TIMEOUT: "75"
          DRIFT_WEBVIEW_LOG_TIMEOUT: "18"
          DRIFT_WEBVIEW_COMMAND_TIMEOUT: "20"
        run: scripts/probe-macos-packaged-webview.sh build/macos/Drift.app

      - name: Preserve packaged WebKit evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drift-packaged-webview-evidence-${{ github.run_id }}
          path: build/macos/packaged-webview/
          if-no-files-found: warn
          retention-days: 14

      - name: Require a complete build and production sandboxed lifecycle
        if: always()
        env:
          BUILD_OUTCOME: ${{ steps.app_build.outcome }}
          MATRIX_OUTCOME: ${{ steps.webview_matrix.outcome }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_OUTCOME" != "success" ]]; then
            echo "The universal app failed before packaged-WebKit falsification; build outcome: $BUILD_OUTCOME" >&2
            cat build/macos/packaged-webview/matrix-summary.json >&2 || true
            exit 1
          fi
          test -d build/macos/Drift.app || {
            echo "The universal app build reported success but produced no final bundle." >&2
            exit 1
          }
          if [[ "$MATRIX_OUTCOME" != "success" ]]; then
            echo "The production sandboxed/ad-hoc app did not survive its packaged WebKit lifecycle." >&2
            echo "The uploaded matrix distinguishes signature, sandbox, launchability, and general package failures." >&2
            cat build/macos/packaged-webview/matrix-summary.json >&2 || true
            exit 1
          fi

      - name: Re-run the complete signed-bundle structural gauntlet
        env:
          DRIFT_EXPECT_ARCHS: "arm64 x86_64"
        run: npm run verify:mac

      - name: Create and mount-check local DMG
        run: npm run package:mac

      - name: Reopen and independently verify local DMG
        run: npm run verify:mac:dmg

      - name: Prove release guard rejects non-Developer-ID signing
        run: |
          set -euo pipefail
          if npm run release:mac; then
            echo "Release guard unexpectedly accepted an ad-hoc or missing signing identity." >&2
            exit 1
          fi
          test ! -e build/release/Drift-macOS.dmg
