name: Apply reviewed slide geometry hotfix
on:
  push:
    branches: [codex/drift-slide-geometry-20260923]
permissions:
  contents: write
concurrency:
  group: apply-reviewed-slide-geometry-hotfix
  cancel-in-progress: false
jobs:
  apply:
    if: contains(github.event.head_commit.message, '[apply-slide-hotfix]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Apply exact reviewed patch to the repair branch only
        run: python3 scripts/apply-slide-hotfix.py
