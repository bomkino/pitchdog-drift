name: Finalize director PR handoff

on:
  push:
    branches: [gauntlet/directors-cut-optical-pipeline]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-director-pr
  cancel-in-progress: false

jobs:
  handoff:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out latest source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/directors-cut-optical-pipeline
          fetch-depth: 0

      - name: Wait for the verified QA receipt
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            git fetch origin gauntlet/directors-cut-optical-pipeline
            if git cat-file -e origin/gauntlet/directors-cut-optical-pipeline:docs/QA_SECOND_PASS.md 2>/dev/null \
              && git cat-file -e origin/gauntlet/directors-cut-optical-pipeline:docs/media/director-command-palette.png 2>/dev/null; then
              git reset --hard origin/gauntlet/directors-cut-optical-pipeline
              exit 0
            fi
            if [ "$attempt" -eq 180 ]; then
              echo "Verified QA receipt did not reach the branch." >&2
              exit 1
            fi
            sleep 10
          done

      - name: Remove handoff workflow and commit clean branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/finalize-director-pr.yml
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "chore: remove temporary PR handoff workflow"
            git pull --rebase origin gauntlet/directors-cut-optical-pipeline
            git push origin HEAD:gauntlet/directors-cut-optical-pipeline
          fi

      - name: Write review-grade pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/pr-body.md <<'MD'
          ## Actual goal

          Make pitch-deck slides feel **filmed rather than decorated**, then make the editor humane enough that a creator can reach, interrogate and export that cut without understanding Drift's renderer architecture.

          This branch treats cinematic rendering and creator confidence as one product. The lens, worlds, controls, history, diagnostics, preflight and evidence all serve the same path: **Slides → World → Direct → Master**.

          ## What changed

          ### Scene-level optical pipeline

          - Deterministic full-frame treatment shared by preview, stills, PNG sequences and video export.
          - Centre and peripheral soft focus.
          - Velocity-driven directional smear.
          - Bounded chromatic aberration.
          - Bloom, warm halation and anamorphic flare.
          - Barrel/pincushion character, vignette, film grain, gate weave and lens breathing.
          - Automatic bypass when the optical stack is neutral.
          - Separate presenter layer: protect a talking head from the lens or deliberately treat it with the same glass.

          ### Authored worlds and atmosphere corpus

          - **18 coherent film worlds**, expanded well beyond palette swaps.
          - Procedural horizon, fog, glass, velvet, emulsion, night-drive, tidal, ember and projector families alongside the original solid, gradient, aura, paper, void and transparent modes.
          - Exact cyclic motion for seamless output.
          - Stable recuts: new spatial/noise takes preserve scene identity rather than compounding mutations.
          - Night Run rebuilt around vanishing-point road structure, sparse paired light, wet reflection and horizon bloom after visual review rejected the first regular dash field.

          ### A creator path instead of a wall of controls

          - Three direction pressure levels for restrained, directed and heightened cuts.
          - Non-compounding **New take** variations.
          - **Clean lens** comparison to expose whether the optics are helping or hiding weak direction.
          - Five publishing masters.
          - Undo/redo that coalesces a slider gesture into one human action.
          - Searchable **Director Commands** palette via `⌘/Ctrl + K` or `?`.
          - Visible command launcher for mouse and touch discovery.
          - Outcome language: “variation”, “before after”, “social safe”, “output”, “undo”.
          - Keyboard navigation, focus containment, live announcements and temporary target highlighting.

          ### Deck health and composition truth

          - Mixed source ratios are named.
          - Source-resolution softening is calculated against the selected master.
          - A better output frame is suggested without silently changing the project.
          - Readability pressure combines velocity, smear, chromatic split, defocus, bend and frame reduction. It is deliberately a conservative risk signal, not fake optical character recognition.
          - Thirds, title-safe and social-interface-safe guides remain preview-only.
          - PNG stills use a deliberate poster moment rather than silently freezing frame zero.

          ### Export confidence

          - Transparent H.264 is blocked before a picker opens.
          - Missing slide media and unavailable encoders fail early with a repair path.
          - Presenter audio at unverifiable 50/60 fps fails visibly.
          - Export sessions own their timers and abort controllers, preventing a stale completion timer from erasing a later export.
          - Completed work reads **Verified**, not **Cancel export**.
          - Preview and export still share one evaluator; there is no flattering fake preview.

          ### Compatibility and restraint

          - Existing project bundles migrate forward.
          - Malformed new optical settings are rejected instead of guessed.
          - Transparent output preserves premultiplied-alpha truth.
          - Reduced motion removes temporal instability without discarding the static lens character.
          - No new runtime dependency.
          - No cloud service, analytics or hidden network request.
          - Moving-track media remains image-first; one pinned presenter video keeps decoding and A/V failure states legible.

          ## Creator workflow

          See [`docs/CREATOR_JOURNEY.md`](docs/CREATOR_JOURNEY.md).

          1. Import and inspect source health.
          2. Choose one authored world.
          3. Set direction pressure and generate takes.
          4. Compare against clean glass.
          5. Check safe framing, poster moment, deck health and readability pressure.
          6. Resolve output blockers.
          7. Export a verified master.

          ## Clean-checkout evidence

          The exact machine-generated receipt is in [`docs/QA_SECOND_PASS.md`](docs/QA_SECOND_PASS.md).

          ![Hydrated Drift studio showing the creator journey](docs/media/director-journey-studio.png)

          ![Director Commands searching in creator language](docs/media/director-command-palette.png)

          ## Review focus

          1. Is the focal slide still readable at maximum optical pressure?
          2. Do worlds remain materially different on real decks, not only demo slides?
          3. Does Clean lens reveal honest value rather than a novelty filter?
          4. Can a first-time creator reach a credible cut without opening every advanced section?
          5. Do mixed ratios, source softness and readability pressure warn without becoming paternalistic?
          6. Do 4K/8K exports stay within GPU limits and memory expectations?
          7. Do transparency, reduced motion, poster moments and seamless loops remain deterministic?
          8. Does the command surface activate the real destination and remain fully operable by keyboard?

          ## Scope discipline

          This does **not** turn Drift into a nonlinear editor, an automatic deck designer or a semantic slide reader. Those would blur the product. This branch deepens the exact job: cinematic, repeatable deck carousels with one optional pinned presenter and trustworthy browser-native export.

          The PR remains **draft** and is not merged automatically.
          MD

          cat docs/QA_SECOND_PASS.md >> /tmp/pr-body.md
          gh pr edit 3 \
            --repo bomkino/pitchdog-drift \
            --title "Director’s cut: cinematic optics, authored worlds, and creator workflow" \
            --body-file /tmp/pr-body.md
