name: Spatial gauntlet branch settler

on:
  push:
    branches:
      - gauntlet/spatial-fabric-dynamics

permissions:
  contents: write

concurrency:
  group: spatial-gauntlet-branch-settler
  cancel-in-progress: true

jobs:
  settle-and-validate:
    if: ${{ !contains(github.event.head_commit.message, 'spatial branch settled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Let the first bootstrap settle
        run: sleep 90
      - uses: actions/checkout@v4
        with:
          ref: gauntlet/spatial-fabric-dynamics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply hardened implementation when scaffolding remains
        run: |
          if [ -f scripts/apply_spatial_gauntlet.py ]; then
            python3 scripts/apply_spatial_gauntlet_repair.py
          fi
      - name: Remove every temporary bootstrap artifact
        run: |
          rm -f \
            .github/workflows/spatial-gauntlet-bootstrap.yml \
            .github/workflows/spatial-gauntlet-bootstrap-v2.yml \
            .github/workflows/spatial-gauntlet-repair.yml \
            scripts/apply_spatial_gauntlet.py \
            scripts/apply_spatial_gauntlet_fixed.py \
            scripts/apply_spatial_gauntlet_repair.py \
            scripts/spatial_templates.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
      - name: Commit settled branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "feat: spatial branch settled"
          git push origin HEAD:gauntlet/spatial-fabric-dynamics
