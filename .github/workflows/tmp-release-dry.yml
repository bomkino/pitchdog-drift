# Temporary, for this branch only: builds and packs the app the way the
# release workflow does, checks that a key the app doesn't trust is refused,
# and runs the live update test. Removed before merge.
name: tmp-release-dry
on:
  push:
    branches: [claude/auto-sign-releases-dfx69k]
jobs:
  dry:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Build, pack, and refuse a key the app doesn't trust
        run: |
          case "$GITHUB_REPOSITORY" in
            bomkino/pitchdog-drift)  APP=Drift ;;
            bomkino/galileo-gallery) APP=Galileo ;;
            bomkino/backdrop)        APP=Backdrop ;;
          esac
          echo "APP=$APP" >> "$GITHUB_ENV"
          BUILD_SCRIPT=scripts/build-apps.sh
          [ -f "$BUILD_SCRIPT" ] || BUILD_SCRIPT=scripts/build.sh
          bash "$BUILD_SCRIPT" release "$APP"
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" https://github.com/sparkle-project/Sparkle/releases/download/2.10.0/Sparkle-2.10.0.tar.xz
          echo "c2bf58aa8387266ac179357b1415d6f2635f044da8be41042af32425dae6da0c  $RUNNER_TEMP/sparkle.tar.xz" | shasum -a 256 -c -
          mkdir -p "$RUNNER_TEMP/sparkle" && tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          printf 'import CryptoKit\nprint(Curve25519.Signing.PrivateKey().rawRepresentation.base64EncodedString())\n' > "$RUNNER_TEMP/keygen.swift"
          swift "$RUNNER_TEMP/keygen.swift" > "$RUNNER_TEMP/wrong.key"
          echo "Release notes." > "$RUNNER_TEMP/notes.md"
          if SPARKLE_BIN="$RUNNER_TEMP/sparkle/bin" SPARKLE_KEY="$RUNNER_TEMP/wrong.key" bash scripts/make-release.sh "$APP" out "$RUNNER_TEMP/notes.md" > "$RUNNER_TEMP/pack.log" 2>&1; then
            cat "$RUNNER_TEMP/pack.log"; echo "FAILED: it signed with a key the app doesn't trust"; exit 1
          fi
          cat "$RUNNER_TEMP/pack.log"
          grep -q "wouldn't accept" "$RUNNER_TEMP/pack.log" && [ ! -f out/appcast.xml ] || { echo "FAILED: refused, but not by the signature check"; exit 1; }
          ls -l out
          echo "dry run: built and packed; a key the app doesn't trust was refused before any feed was written"
      - name: Live update test
        run: bash scripts/test-live-update.sh "$APP"
