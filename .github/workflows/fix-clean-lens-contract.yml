name: Fix clean-lens contract

on:
  push:
    branches: [gauntlet/directors-cut-optical-pipeline]

permissions:
  contents: write

concurrency:
  group: fix-clean-lens-contract
  cancel-in-progress: false

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/directors-cut-optical-pipeline
          fetch-depth: 0

      - name: Correct exact world selection
        shell: python
        run: |
          from pathlib import Path
          path = Path("e2e/cleanLensComparison.e2e.ts")
          source = path.read_text()
          old = '''  await worldSelect.selectOption({ label: /Dread|Chrome Dream|Night Run/i });'''
          new = '''  const options = await worldSelect.locator("option").evaluateAll((nodes) =>
            nodes.map((node) => ({
              value: (node as HTMLOptionElement).value,
              label: (node.textContent ?? "").trim(),
            })).filter((option) => option.value && option.label),
          );
          const expressiveWorld = options.find((option) => /Dread|Chrome Dream|Night Run/i.test(option.label));
          expect(expressiveWorld, "A strongly treated authored world is required for comparison QA").toBeTruthy();
          await worldSelect.selectOption(expressiveWorld!.value);'''
          if old not in source:
              raise SystemExit("Expected clean-lens selector anchor was not found.")
          path.write_text(source.replace(old, new))

      - name: Remove temporary delivery hook
        run: rm .github/workflows/fix-clean-lens-contract.yml

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "test: harden clean-lens world selection"
          git push origin HEAD:gauntlet/directors-cut-optical-pipeline
