name: Spatial gauntlet bootstrap

on:
  push:
    branches:
      - gauntlet/spatial-fabric-dynamics
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: spatial-gauntlet-bootstrap
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: ${{ !contains(github.event.head_commit.message || github.event.pull_request.title, 'spatial gauntlet applied') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gauntlet/spatial-fabric-dynamics
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply focused spatial implementation
        run: python3 scripts/apply_spatial_gauntlet.py
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test -- --run
      - name: Production build
        run: npm run build
      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: spatial gauntlet applied" || exit 0
          git push origin HEAD:gauntlet/spatial-fabric-dynamics
