name: Apply reviewed release changes

on:
  push:
    branches: [codex/drift-mac-video-release]

permissions:
  contents: write

jobs:
  apply:
    if: github.ref == 'refs/heads/codex/drift-mac-video-release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
      - name: Apply hash-pinned edits and remove this transport
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/codex/drift-mac-video-release
          test "$(git rev-parse HEAD^)" = 03f55dcf013b3cde71e13bb33988d10704fde157
          node - <<'JS'
          const fs = require('node:fs');
          const {brotliDecompressSync} = require('node:zlib');
          const {createHash} = require('node:crypto');
          const encoded = [0,1].map(i=>fs.readFileSync(`.release-transfer/part-${i}.txt`,'utf8')).join('');
          const raw = brotliDecompressSync(Buffer.from(encoded,'base64'));
          if(createHash('sha256').update(raw).digest('hex')!=='5905546269bb52d518f86e3d037fdc4bf083d19b8f7be8ee549d1ad0cfcbd6ca') throw new Error('Source payload mismatch');
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/drift-edits.json`,raw);
          JS
          python3 - <<'PY'
          import json,os,pathlib
          entries=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'drift-edits.json').read_text())
          assert len(entries)==38
          root=pathlib.Path.cwd()
          seen=set()
          for name,edits in entries:
              relative=pathlib.PurePosixPath(name)
              assert not relative.is_absolute() and '..' not in relative.parts and name not in seen
              assert relative.parts[0] in {'.github','src','tests','e2e','macos','scripts','docs','README.md','CHANGELOG.md'}
              seen.add(name)
              path=root/name
              assert not path.is_symlink()
              if edits is None:
                  assert name=='.github/workflows/mac-video-candidate.yml'
                  path.unlink()
                  continue
              lines=path.read_text().splitlines(keepends=True) if path.exists() else []
              previous=len(lines)
              for start,end,text in reversed(edits):
                  assert 0<=start<=end<=previous
                  lines[start:end]=[text]
                  previous=start
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(''.join(lines))
          for name in ['.release-transfer/part-0.txt','.release-transfer/part-1.txt','.github/workflows/apply-release-changes.yml']:
              (root/name).unlink()
          PY
          git add -A
          test "$(git write-tree)" = e57d64bc6388ebc673145f9d1750d68adbb1bef4
          git -c user.name='pitch.dog' -c user.email='111725271+bomkino@users.noreply.github.com' commit -m 'fix(mac): finish looping video, atomic recovery, idle rendering and installer release'
          git push origin HEAD:refs/heads/codex/drift-mac-video-release
          git log -1 --format='source=%H tree=%T'
