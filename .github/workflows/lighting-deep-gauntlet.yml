name: Deep cinematic lighting gauntlet

on:
  pull_request:
    branches:
      - main
    paths:
      - .gauntlet/lighting-next.py

permissions:
  contents: write

concurrency:
  group: lighting-deep-gauntlet
  cancel-in-progress: false

jobs:
  deepen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out lighting branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: feat/cinematic-lighting-rig

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Apply one atomic lighting gauntlet stage
        run: python .gauntlet/lighting-next.py

      - name: Reject malformed diffs
        run: git diff --check

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, unit test, and build
        run: npm run check

      - name: Commit reviewable product source
        run: |
          git config user.name "pitch.dog lighting gauntlet"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: deepen cinematic lighting direction"
          git pull --rebase origin feat/cinematic-lighting-rig
          git push origin HEAD:feat/cinematic-lighting-rig

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete real-browser gauntlet
        run: npm run test:e2e

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.6.2
        with:
          name: cinematic-lighting-browser-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
