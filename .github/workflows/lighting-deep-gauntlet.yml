name: Cinematic lighting gauntlet

on:
  pull_request:
    branches:
      - main
    paths:
      - .gauntlet/lighting-integrity.py
      - .github/workflows/lighting-deep-gauntlet.yml
      - docs/CINEMATIC_LIGHTING.md
      - docs/LIGHTING_REVIEW_CHECKLIST.md
      - e2e/studio.e2e.ts
      - src/components/ControlPanel.tsx
      - src/engine/CinematicCarousel.ts
      - src/engine/shaders.ts
      - src/lib/settingsValidation.ts
      - src/lighting.ts
      - src/model.ts
      - src/themes.ts
      - tests/engineShader.test.ts
      - tests/lighting.test.ts
      - tests/lightingValidation.test.ts
      - tests/settingsValidation.test.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinematic-lighting-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Verify immutable lighting contract
        run: |
          python .gauntlet/lighting-integrity.py
          git diff --check
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, unit test, and production build
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run ordinary real-browser gauntlet
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/ordinary
        run: >-
          npm run test:e2e --
          --grep-invert "saved starter studies remain replaceable|a slow older autosave cannot overwrite"
          --output=test-results/ordinary

      - name: Run multi-context persistence races with scoped budget
        env:
          PLAYWRIGHT_HTML_OUTPUT_DIR: playwright-report/persistence
        run: >-
          npm run test:e2e --
          --grep "saved starter studies remain replaceable|a slow older autosave cannot overwrite"
          --timeout=180000
          --output=test-results/persistence

      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@5d5d22a31266ced268874388b861e4b58bb5c2f3 # v4.6.2
        with:
          name: cinematic-lighting-browser-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
