          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4179/ >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then cat /tmp/drift-vite.log; exit 1; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import { chromium } from "@playwright/test";
