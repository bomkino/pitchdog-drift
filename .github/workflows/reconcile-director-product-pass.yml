          Make pitch-deck slides feel **filmed rather than decorated**, then make the editor humane enough that a creator can reach, question and export that cut without understanding Drift's renderer architecture.

          The path is now **Slides → World → Direct → Master**.

          ## Rendering

          - Deterministic full-frame optics shared by preview and every export path.
