          python - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone
          vitest = json.loads(Path('/tmp/vitest.json').read_text())
          playwright = json.loads(Path('/tmp/playwright.json').read_text())
          unit_total = vitest.get('numTotalTests')
          unit_passed = vitest.get('numPassedTests')
          unit_failed = vitest.get('numFailedTests')
          if unit_total is None:
              assertions = [a for f in vitest.get('testResults', []) for a in f.get('assertionResults', [])]
              unit_total = len(assertions)
              unit_passed = sum(a.get('status') == 'passed' for a in assertions)
              unit_failed = sum(a.get('status') == 'failed' for a in assertions)
          stats = playwright.get('stats', {})
