name: Scratch Director's Cut source snapshot

on:
  push:
    branches:
      - scratch/directors-cut-audit-20260821

permissions:
  contents: write

jobs:
  snapshot:
    if: ${{ !contains(github.event.head_commit.message, '[snapshot-ready]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact scratch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: scratch/directors-cut-audit-20260821
          fetch-depth: 0

      - name: Materialize review source as bounded text chunks
        shell: bash
        run: |
          set -euo pipefail
          git ls-files \
            | grep -Ev '^(\.github/audit-source-payload/|\.github/final-delta-payload/|\.github/workflows/scratch-directors-cut-snapshot\.yml$|docs/media/)' \
            > /tmp/directors-cut-files.txt
          tar -czf /tmp/directors-cut-source.tgz -T /tmp/directors-cut-files.txt
          rm -rf .github/audit-source-payload
          mkdir -p .github/audit-source-payload
          base64 -w0 /tmp/directors-cut-source.tgz \
            | split -b 12000 - .github/audit-source-payload/part-
          {
            sha256sum /tmp/directors-cut-source.tgz
            wc -c /tmp/directors-cut-source.tgz
            wc -l /tmp/directors-cut-files.txt
          } > .github/audit-source-payload/manifest.txt
          git config user.name "pitch.dog audit"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add .github/audit-source-payload
          git commit -m "chore(snapshot): materialize review source [snapshot-ready]"
          git push origin HEAD:scratch/directors-cut-audit-20260821
