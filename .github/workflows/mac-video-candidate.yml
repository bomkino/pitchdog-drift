name: Drift candidate source

on:
  push:
    branches: [codex/drift-mac-video-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift-candidate-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preserve exact candidate source
        run: |
          mkdir -p "$RUNNER_TEMP/drift-source"
          git rev-parse HEAD > "$RUNNER_TEMP/drift-source/SOURCE_SHA.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/drift-source/source.tar"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: drift-source-${{ github.sha }}
          path: ${{ runner.temp }}/drift-source/
          retention-days: 3
          if-no-files-found: error
