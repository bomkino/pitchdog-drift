name: Drift Mac video candidate

on:
  push:
    branches: [codex/drift-mac-video-release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: drift-mac-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Preserve exact public candidate source for offline inspection
        run: |
          mkdir -p "$RUNNER_TEMP/drift-workspace"
          git rev-parse HEAD > "$RUNNER_TEMP/drift-workspace/SOURCE_SHA.txt"
          git archive --format=tar HEAD > "$RUNNER_TEMP/drift-workspace/source.tar"
          tar -czf "$RUNNER_TEMP/drift-workspace/test-dependencies.tar.gz" node_modules
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: drift-candidate-workspace-${{ github.sha }}
          path: ${{ runner.temp }}/drift-workspace/
          retention-days: 3
          if-no-files-found: error
