name: codex-prove-native-document-authority

on:
  push:
    branches:
      - feat/native-macos-document-authority
    paths:
      - .github/workflows/codex-repair-document-authority-runner.yml

permissions:
  contents: write

concurrency:
  group: codex-native-document-authority
  cancel-in-progress: true

jobs:
  prove:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out stacked branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/native-macos-document-authority
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Publish runner-started receipt
        shell: bash
        run: |
          cat > docs/.native-authority-gauntlet-running <<EOF
          workflow=codex-prove-native-document-authority
          source=${GITHUB_SHA}
          runner=${RUNNER_OS}-${RUNNER_ARCH}
          state=running
          EOF
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add docs/.native-authority-gauntlet-running
          git commit -m "chore(mac): record authority gauntlet start"
          git push origin HEAD:feat/native-macos-document-authority

      - name: Repair stale assumptions and apply authority model
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/codex-native-document-authority.yml')
          source = workflow.read_text(encoding='utf-8')

          old_helper = '''              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {count}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))
          '''
          new_helper = '''              count = text.count(old)
              if count < 1:
                  raise SystemExit(f"{path}: replacement target was not found: {old[:120]!r}")
              write(path, text.replace(old, new, 1))
          '''
          if source.count(old_helper) != 1:
              raise SystemExit('The authority runner replacement helper changed unexpectedly.')
          source = source.replace(old_helper, new_helper, 1)

          def remove_replace_block(text: str, marker: str) -> str:
              marker_at = text.find(marker)
              if marker_at < 0:
                  raise SystemExit(f'Stale authority patch marker was not found: {marker!r}')
              start = text.rfind('          replace_once(', 0, marker_at)
              if start < 0:
                  raise SystemExit(f'Could not locate replace_once start for {marker!r}')
              end = text.find('\n          replace_once(', marker_at)
              if end < 0:
                  raise SystemExit(f'Could not locate replace_once end for {marker!r}')
              return text[:start] + text[end + 1:]

          source = remove_replace_block(
              source,
              "'''    func claimBootstrap(rawNonce: String) throws -> NativeDocumentTicket {",
          )
          source = remove_replace_block(
              source,
              "'''        do {\n                      _ = try session.claimBootstrap(rawNonce: firstNonce)",
          )

          old_marker = '            "A malformed bootstrap nonce was accepted.",\n'
          new_marker = '            "Malformed document nonce unexpectedly bootstrapped.",\n'
          if source.count(old_marker) != 1:
              raise SystemExit('The generated authority checker malformed-nonce marker changed unexpectedly.')
          source = source.replace(old_marker, new_marker, 1)
          workflow.write_text(source, encoding='utf-8')

          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.find(start_marker)
          if start < 0:
              raise SystemExit('Could not locate authority implementation script.')
          start += len(start_marker)
          end = source.find(end_marker, start)
          if end < 0:
              raise SystemExit('Could not locate authority implementation script terminator.')
          embedded = source[start:end]
          lines = embedded.splitlines()
          if any(line and not line.startswith('          ') for line in lines):
              raise SystemExit('Authority implementation script indentation changed unexpectedly.')
          script = '\n'.join(line[10:] if line else '' for line in lines) + '\n'
          compiled = compile(script, str(workflow) + ':embedded-python', 'exec')
          namespace = {'__name__': '__main__'}
          exec(compiled, namespace, namespace)
          PY

      - name: Run source, unit, and production-build gauntlet
        run: npm run check

      - name: Build and verify the signed local app
        env:
          DRIFT_MACOS_ARCHS: arm64
          DRIFT_SKIP_WEB_CHECKS: "1"
        run: npm run build:mac

      - name: Remove temporary transport and commit only proven source
        shell: bash
        run: |
          rm docs/.native-authority-gauntlet-running
          rm .github/workflows/codex-native-document-authority.yml
          rm .github/workflows/codex-repair-document-authority-runner.yml
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "security(mac): bind native capabilities to one document generation"
          git push origin HEAD:feat/native-macos-document-authority
