name: Director's Cut third-pass receipt

on:
  push:
    branches: [gauntlet/directors-cut-optical-pipeline]

permissions:
  contents: write

concurrency:
  group: directors-cut-third-pass
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/directors-cut-optical-pipeline
          fetch-depth: 0

      - name: Wait for the clean-lens correction
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 90); do
            git fetch origin gauntlet/directors-cut-optical-pipeline
            if ! git cat-file -e origin/gauntlet/directors-cut-optical-pipeline:.github/workflows/fix-clean-lens-contract.yml 2>/dev/null \
              && git show origin/gauntlet/directors-cut-optical-pipeline:e2e/cleanLensComparison.e2e.ts 2>/dev/null | grep -q "expressiveWorld"; then
              git reset --hard origin/gauntlet/directors-cut-optical-pipeline
              exit 0
            fi
            sleep 4
          done
          echo "Clean-lens correction did not settle before the QA receipt." >&2
          exit 1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run typed, unit, build, and browser gates
        id: gates
        shell: bash
        run: |
          set +e
          npm run typecheck > /tmp/typecheck.log 2>&1
          TYPECHECK=$?
          npx vitest run --reporter=json --outputFile=/tmp/vitest.json > /tmp/vitest.log 2>&1
          UNIT=$?
          npm run build > /tmp/build.log 2>&1
          BUILD=$?
          npx playwright test --reporter=json > /tmp/playwright.json 2> /tmp/playwright.stderr
          BROWSER=$?
          echo "typecheck=$TYPECHECK" >> "$GITHUB_OUTPUT"
          echo "unit=$UNIT" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "browser=$BROWSER" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write exact third-pass receipt
        env:
          TYPECHECK_STATUS: ${{ steps.gates.outputs.typecheck }}
          UNIT_STATUS: ${{ steps.gates.outputs.unit }}
          BUILD_STATUS: ${{ steps.gates.outputs.build }}
          BROWSER_STATUS: ${{ steps.gates.outputs.browser }}
        shell: python
        run: |
          import json
          import os
          import platform
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          def load(path):
              try:
                  return json.loads(Path(path).read_text())
              except Exception:
                  return {}

          vitest = load("/tmp/vitest.json")
          playwright = load("/tmp/playwright.json")
          stats = playwright.get("stats", {}) if isinstance(playwright, dict) else {}
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")

          unit_total = vitest.get("numTotalTests", "unknown")
          unit_passed = vitest.get("numPassedTests", "unknown")
          unit_failed = vitest.get("numFailedTests", "unknown")
          unit_pending = vitest.get("numPendingTests", "unknown")
          browser_expected = stats.get("expected", "unknown")
          browser_unexpected = stats.get("unexpected", "unknown")
          browser_flaky = stats.get("flaky", "unknown")
          browser_skipped = stats.get("skipped", "unknown")

          statuses = {
              "TypeScript project build": int(os.environ["TYPECHECK_STATUS"]),
              "Unit and contract tests": int(os.environ["UNIT_STATUS"]),
              "Production Vite build": int(os.environ["BUILD_STATUS"]),
              "Chromium user and visual journeys": int(os.environ["BROWSER_STATUS"]),
          }
          result = lambda code: "Passed" if code == 0 else "FAILED"
          overall = all(code == 0 for code in statuses.values())

          text = f'''# Director's Cut — third-pass QA receipt

          Generated from a clean GitHub Actions checkout on **{now}**.

          - Commit: `{sha}`
          - Node: `{subprocess.check_output(["node", "--version"], text=True).strip()}`
          - Runner: `{platform.platform()}`
          - Overall: **{"PASSED" if overall else "FAILED"}**

          | Gate | Result |
          | --- | --- |
          | TypeScript project build | {result(statuses["TypeScript project build"])} |
          | Unit and contract tests | {result(statuses["Unit and contract tests"])} — {unit_passed}/{unit_total} passed; {unit_failed} failed; {unit_pending} pending |
          | Production Vite build | {result(statuses["Production Vite build"])} |
          | Chromium user and visual journeys | {result(statuses["Chromium user and visual journeys"])} — {browser_expected} expected; {browser_unexpected} unexpected; {browser_flaky} flaky; {browser_skipped} skipped |

          The browser gate includes authored-world uniqueness, exposure preservation, paused reduced-motion pixel stability, reversible Clean lens comparison, command navigation, export lifecycle, transparency, fallback rendering, project portability, and media failure paths.

          This receipt reports the machine result. It does not replace the real-deck visual gauntlet in `docs/USER_GAUNTLET.md`.
          '''
          Path("docs/QA_THIRD_PASS.md").write_text("\n".join(line.strip() for line in text.splitlines()) + "\n")
          Path("/tmp/overall-status").write_text("0" if overall else "1")

      - name: Remove temporary QA hook and commit receipt
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/directors-cut-third-pass.yml
          git config user.name "pitch.dog"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "test: record Director's Cut third-pass receipt"
          git push origin HEAD:gauntlet/directors-cut-optical-pipeline

      - name: Fail visibly when any gate failed
        shell: bash
        run: exit "$(cat /tmp/overall-status)"
