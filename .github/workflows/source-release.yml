name: Publish verified native installer
on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact current main SHA whose CI installer has been accepted
        required: true
        type: string
      build_run:
        description: Successful push-to-main CI run ID containing the frozen installer
        required: true
        type: string
      prerelease:
        description: Publish a candidate without changing the latest stable release
        required: true
        default: true
        type: boolean
  # Explicit one-version promotion, requested for the slide geometry hotfix.
  # No other version or ordinary main commit is automatically published.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
permissions:
  actions: read
  contents: write
concurrency:
  group: native-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       contains(github.event.workflow_run.head_commit.message, '[release-drift-0.5.1]'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_SHA: ${{ inputs.source_commit || github.event.workflow_run.head_sha }}
      BUILD_RUN: ${{ inputs.build_run || github.event.workflow_run.id }}
      RELEASE_PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease && 'true' || 'false' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require trusted current main and explicit hotfix authority
        env:
          DISPATCH_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$DISPATCH_REF" = refs/heads/main
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$BUILD_RUN" =~ ^[0-9]+$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq .commit.sha)" = "$RELEASE_SHA"
          if [[ "$EVENT_NAME" = workflow_run ]]; then
            gh api "repos/$GITHUB_REPOSITORY/contents/package.json?ref=$RELEASE_SHA" --jq .content | base64 --decode > "$RUNNER_TEMP/hotfix-version.json"
            python3 -c 'import json,os; from pathlib import Path; assert json.loads((Path(os.environ["RUNNER_TEMP"])/"hotfix-version.json").read_text())["version"] == "0.5.1"'
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Verify exact successful CI authority
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN" > "$RUNNER_TEMP/run.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run=json.loads((Path(os.environ['RUNNER_TEMP'])/'run.json').read_text())
          assert run['head_sha']==os.environ['RELEASE_SHA'] and run['head_branch']=='main'
          assert run['event']=='push' and run['status']=='completed' and run['conclusion']=='success'
          assert run['path']=='.github/workflows/ci.yml'
          assert run['head_repository']['full_name']==os.environ['GITHUB_REPOSITORY']
          PY
      - name: Download accepted frozen bytes and release notes
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY" --name "drift-native-installer-$RELEASE_SHA" --dir "$RUNNER_TEMP/drift-installer"
          python3 scripts/freeze-macos-artifact.py --verify "$RUNNER_TEMP/drift-installer" "$RELEASE_SHA"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version=json.loads(Path('package.json').read_text())['version']
          text=Path('CHANGELOG.md').read_text().split('## ['+version+']',1)[1].split('\n',1)[1].split('\n## ',1)[0].strip()
          assert text
          receipt=json.loads((Path(os.environ['RUNNER_TEMP'])/'drift-installer/MacReleaseReceipt.json').read_text())
          text+='\n\nSource: `'+os.environ['RELEASE_SHA']+'`. Build: `'+receipt['buildNumber']+'`. Installer SHA-256: `'+receipt['installer']['sha256']+'`.\n'
          text+='\nExact-main proof: https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['BUILD_RUN']+'\n'
          (Path(os.environ['RUNNER_TEMP'])/'native-release-notes.md').write_text(text)
          with open(os.environ['GITHUB_ENV'],'a') as env: env.write('TAG=v'+version+'\n')
          PY
      - name: Publish by immutable release ID without rebuilding
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/drift-installer
          NOTES_PATH: ${{ runner.temp }}/native-release-notes.md
        run: python3 scripts/publish-macos-installer.py
