name: Native application integration
on:
  push:
    branches: [codex/drift-native-completion, main]
    paths: [macos/NativeCore/**, scripts/build-native-codecs.sh, scripts/build-native-archive.sh, scripts/generate-native-catalog.mjs, .github/workflows/native-integration.yml]
  pull_request:
    paths: [macos/NativeCore/**, scripts/build-native-codecs.sh, scripts/build-native-archive.sh, scripts/generate-native-catalog.mjs, .github/workflows/native-integration.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-integration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/generate-native-catalog.mjs
      - run: scripts/build-native-codecs.sh
      - run: scripts/build-native-archive.sh
      - name: Native document and media integration
        env:
          DRIFT_TIMING_DIAGNOSTICS: "1"
        run: |
          set -euo pipefail
          mkdir -p build/native-integration
          git rev-parse HEAD > build/native-integration/SOURCE_SHA.txt
          git archive --format=zip --output=build/native-integration/native-source.zip HEAD -- macos/NativeCore scripts .github docs README.md CONTRIBUTING.md LICENSE NOTICE ASSET-LICENSE.md package.json package-lock.json
          sw_vers > build/native-integration/HOST.txt
          xcrun swift --version >> build/native-integration/HOST.txt
          xcrun swift test --package-path macos/NativeCore 2>&1 | tee build/native-integration/tests.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: drift-native-integration-${{ github.sha }}
          path: build/native-integration/
          if-no-files-found: warn
          retention-days: 14
