name: Temporary audit snapshot

on:
  pull_request:
  push:
    branches: [gauntlet/directors-cut-optical-pipeline]

permissions:
  contents: read

concurrency:
  group: audit-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Package exact source and dependencies
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=drift-source.tgz HEAD
          tar -czf drift-node-modules.tgz node_modules
          sha256sum drift-source.tgz drift-node-modules.tgz > snapshot-sha256.txt

      - name: Upload exact branch source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: directors-cut-audit-source
          path: |
            drift-source.tgz
            snapshot-sha256.txt
          retention-days: 2

      - name: Upload locked dependencies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: directors-cut-audit-dependencies
          path: drift-node-modules.tgz
          retention-days: 2
