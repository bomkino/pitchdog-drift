name: Apply Director Desk manifest product pass

on:
  push:
    branches: [gauntlet/directors-cut-optical-pipeline]

permissions:
  contents: write

concurrency:
  group: apply-director-desk-manifest
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the triggering branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify the complete numbered manifest
        shell: bash
        run: |
          set -euo pipefail
          root=.github/director-desk-payload
          expected=(part-00 part-01 part-02 part-03 part-04 part-05 part-06 part-07 part-08)
          mapfile -t actual < <(find "$root" -maxdepth 1 -type f -name 'part-*' -printf '%f\n' | sort)
          test "${#actual[@]}" -eq "${#expected[@]}"
          for index in "${!expected[@]}"; do
            test "${actual[$index]}" = "${expected[$index]}"
          done
          for index in 00 01 02 03 04 05 06 07; do
            test "$(wc -c < "$root/part-$index")" -eq 7000
          done
          test "$(wc -c < "$root/part-08")" -eq 1628
          cat \
            "$root/part-00" "$root/part-01" "$root/part-02" \
            "$root/part-03" "$root/part-04" "$root/part-05" \
            "$root/part-06" "$root/part-07" "$root/part-08" \
            > /tmp/director-desk-product.b64
          test "$(wc -c < /tmp/director-desk-product.b64)" -eq 57628
          base64 --decode /tmp/director-desk-product.b64 > /tmp/director-desk-product.tgz
          echo '11e1c29dab592fc7ecd7091c9c0abdb7d36954016c8fe95e42d27d147f3e0e3e  /tmp/director-desk-product.tgz' | sha256sum --check --strict
          tar -tzf /tmp/director-desk-product.tgz > /tmp/director-desk-product-files.txt
          test "$(wc -l < /tmp/director-desk-product-files.txt)" -eq 15
          if grep -Eq '(^|/)\.\.(/|$)|^/' /tmp/director-desk-product-files.txt; then
            echo 'Unsafe archive path detected.' >&2
            exit 1
          fi
          tar -xzf /tmp/director-desk-product.tgz
          rm -rf "$root"
          rm -f \
            .github/workflows/apply-director-desk-manifest.yml \
            .github/workflows/audit-snapshot.yml

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run strict product gate
        run: npm run check

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run hosted creator gauntlet
        run: npm run test:e2e

      - name: Commit the verified product pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A src tests e2e .github
          git commit \
            -m 'feat: wire the Director Desk creator journey' \
            -m "Verified by transactional gauntlet run ${GITHUB_RUN_ID}."
          git push origin HEAD:gauntlet/directors-cut-optical-pipeline

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: director-desk-browser-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove failed transport from the branch
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin gauntlet/directors-cut-optical-pipeline
          git reset --hard origin/gauntlet/directors-cut-optical-pipeline
          git rm -rf --ignore-unmatch \
            .github/director-desk-payload \
            .github/workflows/apply-director-desk-manifest.yml \
            .github/workflows/audit-snapshot.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: remove failed Director Desk transport (run ${GITHUB_RUN_ID})"
          git push origin HEAD:gauntlet/directors-cut-optical-pipeline
