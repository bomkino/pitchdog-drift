name: Apply sonic focus-handoff parity

on:
  push:
    branches: [feat/tactile-sound-system-v2]

permissions:
  contents: write

concurrency:
  group: sonic-focus-handoff-parity
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[apply-sonic-phase-parity-v2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/tactile-sound-system-v2
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Reconstruct and verify audited timing patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/sonic-phase-parity.b64 <<'PATCH_B64'

PATCH_B64
          base64 --decode /tmp/sonic-phase-parity.b64 > /tmp/sonic-phase-parity.patch
          echo "35ca601210ab3842064f6f2dfd7386228ad0611dda6913cce54b5b5981225365  /tmp/sonic-phase-parity.patch" | sha256sum --check --strict
          git apply --check /tmp/sonic-phase-parity.patch

      - name: Apply patch and remove transport workflow
        shell: bash
        run: |
          set -euo pipefail
          git apply --whitespace=error-all /tmp/sonic-phase-parity.patch
          rm -f .github/workflows/apply-sonic-phase-parity.yml

      - name: Install exact lockfile
        run: npm ci

      - name: Run deterministic static, unit, build, bundle, acoustic, and provenance gate
        run: |
          npm run check
          npm run sound:verify

      - name: Commit conflict-safely
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(sound): align preview and export focus hand-offs"
          git fetch origin feat/tactile-sound-system-v2
          git rebase origin/feat/tactile-sound-system-v2
          git push origin HEAD:feat/tactile-sound-system-v2

      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-phase-parity-v2-failure-evidence
          path: /tmp/sonic-phase-parity.patch
          if-no-files-found: ignore
          retention-days: 7
