name: Director's Cut visual evidence

on:
  pull_request:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Capture authored film worlds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p visual-evidence
          npm run dev -- --host 127.0.0.1 --port 5187 > /tmp/drift-vite.log 2>&1 &
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:5187 >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({
            headless: true,
            args: ['--enable-webgl', '--ignore-gpu-blocklist', '--use-angle=swiftshader'],
          });
          const page = await browser.newPage({ viewport: { width: 1440, height: 900 }, deviceScaleFactor: 1 });
          const errors = [];
          page.on('console', (message) => { if (message.type() === 'error') errors.push(`console: ${message.text()}`); });
          page.on('pageerror', (error) => errors.push(`page: ${error.message}`));
          await page.goto('http://127.0.0.1:5187', { waitUntil: 'networkidle' });
          await page.locator('[data-testid=webgl-stage]').waitFor({ state: 'visible' });
          await page.waitForTimeout(1200);
          await page.screenshot({ path: 'visual-evidence/00-studio-editorial-drift.png', fullPage: true });
          const worlds = [
            ['Sunstruck Atlas', '01-sunstruck-atlas.png'],
            ['Dread', '02-dread.png'],
            ['Blue Hour', '03-blue-hour.png'],
            ['Night Run', '04-night-run.png'],
            ['Eclipse Ritual', '05-eclipse-ritual.png'],
          ];
          for (const [name, file] of worlds) {
            await page.getByRole('button', { name: new RegExp(name) }).click();
            await page.waitForTimeout(900);
            await page.locator('.stage-frame').screenshot({ path: `visual-evidence/${file}` });
          }
          if (errors.length) throw new Error(errors.join('\n'));
          await browser.close();
          NODE

      - name: Upload visual evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: directors-cut-visual-evidence
          path: visual-evidence/
          retention-days: 7
