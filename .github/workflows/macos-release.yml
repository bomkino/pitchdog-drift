name: macOS signed release evidence

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character commit already reachable from main
        required: true
        type: string
      confirm_no_binary_upload:
        description: Build and verify on the runner; retain text receipts only
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: macos-release-evidence-${{ inputs.source_commit }}
  cancel-in-progress: false

jobs:
  release-evidence:
    if: ${{ inputs.confirm_no_binary_upload }}
    runs-on: macos-15
    timeout-minutes: 90
    environment:
      name: macos-release
    env:
      KEYCHAIN_PATH: ${{ runner.temp }}/drift-release.keychain-db
      CERTIFICATE_PATH: ${{ runner.temp }}/drift-developer-id.p12
      NOTARY_KEY_PATH: ${{ runner.temp }}/AuthKey_Drift.p8
    steps:
      - name: Check out trusted main history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve an exact trusted main commit before secrets exist
        env:
          REQUESTED_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          if [[ ! "$REQUESTED_COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "source_commit must be one exact 40-character Git commit SHA." >&2
            exit 1
          fi
          git fetch --no-tags origin main
          git cat-file -e "${REQUESTED_COMMIT}^{commit}"
          if ! git merge-base --is-ancestor "$REQUESTED_COMMIT" origin/main; then
            echo "The requested commit is not reachable from trusted main." >&2
            exit 1
          fi
          git checkout --detach "$REQUESTED_COMMIT"
          RESOLVED_COMMIT="$(git rev-parse HEAD)"
          [[ "$RESOLVED_COMMIT" == "${REQUESTED_COMMIT,,}" ]] || {
            echo "Resolved commit differs from the requested commit." >&2
            exit 1
          }
          echo "DRIFT_RELEASE_SOURCE_COMMIT=$RESOLVED_COMMIT" >> "$GITHUB_ENV"

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Require signing and notarisation secrets
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          for variable in CERTIFICATE_P12 CERTIFICATE_PASSWORD SIGN_IDENTITY NOTARY_KEY_P8 NOTARY_KEY_ID NOTARY_ISSUER_ID; do
            if [[ -z "${!variable}" ]]; then
              echo "Required macos-release environment secret is empty: $variable" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate into an isolated keychain
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          export CERTIFICATE_PATH KEYCHAIN_PATH CERTIFICATE_P12
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path(os.environ["CERTIFICATE_PATH"]).write_bytes(
              base64.b64decode(os.environ["CERTIFICATE_P12"], validate=True)
          )
          PY
          KEYCHAIN_PASSWORD="$(python3 - <<'PY'
          import secrets
          print(secrets.token_urlsafe(32))
          PY
          )"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          echo "DRIFT_TEMP_KEYCHAIN_PASSWORD=$KEYCHAIN_PASSWORD" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Materialise App Store Connect API key
        env:
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          export NOTARY_KEY_PATH NOTARY_KEY_P8
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path(os.environ["NOTARY_KEY_PATH"])
          path.write_bytes(base64.b64decode(os.environ["NOTARY_KEY_P8"], validate=True))
          path.chmod(0o600)
          PY

      - name: Build, sign, notarise, staple, and verify without publishing
        env:
          DRIFT_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_NOTARY_KEY_PATH: ${{ env.NOTARY_KEY_PATH }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          DRIFT_MACOS_ARCHS: arm64 x86_64
        run: scripts/release-macos-app.sh --notarize

      - name: Record workflow source and non-publication identity
        env:
          REQUESTED_COMMIT: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          {
            echo "requested_commit=$REQUESTED_COMMIT"
            echo "resolved_commit=$(git rev-parse HEAD)"
            echo "main_ancestor=yes"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "workflow_run=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "binary_uploaded=no"
            echo "github_release_created=no"
          } > build/release/WorkflowSource.txt

      - name: Retain text receipts only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: drift-macos-signed-receipts-${{ github.run_id }}
          path: |
            build/release/ReleaseManifest.json
            build/release/SHA256SUMS.txt
            build/release/notary-app.json
            build/release/notary-dmg.json
            build/release/WorkflowSource.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      - name: Remove signing material and every compiled binary
        if: always()
        run: |
          set +e
          security delete-keychain "$KEYCHAIN_PATH" >/dev/null 2>&1
          rm -f "$CERTIFICATE_PATH" "$NOTARY_KEY_PATH"
          rm -rf build/macos/Drift.app
          rm -f build/release/Drift-macOS.zip build/release/Drift-macOS.dmg
