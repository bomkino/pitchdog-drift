name: Privacy-safe support diagnostics

on:
  push:
    branches: [gauntlet/directors-cut-optical-pipeline]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: privacy-safe-support-diagnostics
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/directors-cut-optical-pipeline
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Wait for live world audition
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            git fetch origin gauntlet/directors-cut-optical-pipeline
            if git cat-file -e origin/gauntlet/directors-cut-optical-pipeline:src/lib/worldAudition.ts 2>/dev/null \
              && git show origin/gauntlet/directors-cut-optical-pipeline:src/lib/directorCommands.ts 2>/dev/null | grep -q 'drift:director-world-apply'; then
              git reset --hard origin/gauntlet/directors-cut-optical-pipeline
              exit 0
            fi
            if [ "$attempt" -eq 180 ]; then echo "World Audition never reached the branch." >&2; exit 1; fi
            sleep 10
          done

      - name: Cancel stale branch runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?branch=gauntlet%2Fdirectors-cut-optical-pipeline&per_page=100" \
            --jq ".workflow_runs[] | select(.id != (${CURRENT_RUN}|tonumber)) | select(.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\") | .id" \
            | while read -r run_id; do gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true; done
          sleep 8

      - name: Install locked dependencies
        run: npm ci

      - name: Build inspectable diagnostics
        shell: bash
        run: |
          set -euo pipefail
          cat > src/lib/diagnostics.ts <<'TS'
          import {
            ENGINE_VERSION,
            SCHEMA_VERSION,
            SHADER_VERSION,
            THEME_VERSION,
          } from "../model";

          export interface DiagnosticsInput {
            generatedAt: string;
            app: {
              schemaVersion: number;
              engineVersion: string;
              shaderVersion: string;
              themeVersion: string;
            };
            runtime: {
              userAgent: string;
              language: string;
              platform: string;
              crossOriginIsolated: boolean;
              reducedMotion: boolean;
            };
            viewport: {
              width: number;
              height: number;
              devicePixelRatio: number;
            };
            browserCapabilities: {
              webgl2: boolean;
              videoEncoder: boolean;
              videoDecoder: boolean;
              audioEncoder: boolean;
              offscreenCanvas: boolean;
              imageBitmap: boolean;
              fileSavePicker: boolean;
              directoryPicker: boolean;
            };
            webgl: null | {
              vendor: string;
              renderer: string;
              maxTextureSize: number;
              maxRenderbufferSize: number;
              maxViewportWidth: number;
              maxViewportHeight: number;
              maxSamples: number;
              maxAnisotropy: number;
              contextLost: boolean;
              drawingBufferWidth: number;
              drawingBufferHeight: number;
            };
            storage: {
              localStorage: boolean;
              indexedDB: boolean;
              quotaBytes: number | null;
              usageBytes: number | null;
            };
          }

          export type DriftDiagnostics = Readonly<DiagnosticsInput>;

          export function buildDiagnostics(input: DiagnosticsInput): DriftDiagnostics {
            return structuredClone(input);
          }

          export function diagnosticsText(report: DriftDiagnostics): string {
            return JSON.stringify(report, null, 2);
          }

          export function diagnosticsFieldNames(value: unknown, prefix = ""): string[] {
            if (!value || typeof value !== "object") return [];
            const fields: string[] = [];
            for (const [key, child] of Object.entries(value as Record<string, unknown>)) {
              const path = prefix ? `${prefix}.${key}` : key;
              fields.push(path);
              fields.push(...diagnosticsFieldNames(child, path));
            }
            return fields;
          }

          function localStorageAvailable(): boolean {
            try {
              const key = "drift:diagnostic-probe";
              localStorage.setItem(key, "1");
              localStorage.removeItem(key);
              return true;
            } catch {
              return false;
            }
          }

          function safeNumber(value: unknown): number {
            return typeof value === "number" && Number.isFinite(value) ? value : 0;
          }

          function collectWebGL(): DiagnosticsInput["webgl"] {
            const canvas = document.querySelector<HTMLCanvasElement>("canvas");
            if (!canvas) return null;
            const context = canvas.getContext("webgl2");
            if (!context) return null;
            const debug = context.getExtension("WEBGL_debug_renderer_info");
            const anisotropy = context.getExtension("EXT_texture_filter_anisotropic")
              ?? context.getExtension("MOZ_EXT_texture_filter_anisotropic")
              ?? context.getExtension("WEBKIT_EXT_texture_filter_anisotropic");
            const viewport = context.getParameter(context.MAX_VIEWPORT_DIMS) as Int32Array | number[];
            return {
              vendor: debug
                ? String(context.getParameter(debug.UNMASKED_VENDOR_WEBGL))
                : String(context.getParameter(context.VENDOR)),
              renderer: debug
                ? String(context.getParameter(debug.UNMASKED_RENDERER_WEBGL))
                : String(context.getParameter(context.RENDERER)),
              maxTextureSize: safeNumber(context.getParameter(context.MAX_TEXTURE_SIZE)),
              maxRenderbufferSize: safeNumber(context.getParameter(context.MAX_RENDERBUFFER_SIZE)),
              maxViewportWidth: safeNumber(viewport?.[0]),
              maxViewportHeight: safeNumber(viewport?.[1]),
              maxSamples: safeNumber(context.getParameter(context.MAX_SAMPLES)),
              maxAnisotropy: anisotropy
                ? safeNumber(context.getParameter(anisotropy.MAX_TEXTURE_MAX_ANISOTROPY_EXT))
                : 1,
              contextLost: context.isContextLost(),
              drawingBufferWidth: context.drawingBufferWidth,
              drawingBufferHeight: context.drawingBufferHeight,
            };
          }

          export async function collectDiagnostics(): Promise<DriftDiagnostics> {
            let quotaBytes: number | null = null;
            let usageBytes: number | null = null;
            try {
              const estimate = await navigator.storage?.estimate?.();
              quotaBytes = typeof estimate?.quota === "number" ? estimate.quota : null;
              usageBytes = typeof estimate?.usage === "number" ? estimate.usage : null;
            } catch {
              // Storage estimates are optional and permission-dependent.
            }
            const navigatorWithPlatform = navigator as Navigator & { userAgentData?: { platform?: string } };
            return buildDiagnostics({
              generatedAt: new Date().toISOString(),
              app: {
                schemaVersion: SCHEMA_VERSION,
                engineVersion: ENGINE_VERSION,
                shaderVersion: SHADER_VERSION,
                themeVersion: THEME_VERSION,
              },
              runtime: {
                userAgent: navigator.userAgent,
                language: navigator.language,
                platform: navigatorWithPlatform.userAgentData?.platform ?? navigator.platform ?? "unknown",
                crossOriginIsolated: window.crossOriginIsolated,
                reducedMotion: window.matchMedia("(prefers-reduced-motion: reduce)").matches,
              },
              viewport: {
                width: window.innerWidth,
                height: window.innerHeight,
                devicePixelRatio: window.devicePixelRatio || 1,
              },
              browserCapabilities: {
                webgl2: Boolean(document.createElement("canvas").getContext("webgl2")),
                videoEncoder: "VideoEncoder" in window,
                videoDecoder: "VideoDecoder" in window,
                audioEncoder: "AudioEncoder" in window,
                offscreenCanvas: "OffscreenCanvas" in window,
                imageBitmap: "createImageBitmap" in window,
                fileSavePicker: "showSaveFilePicker" in window,
                directoryPicker: "showDirectoryPicker" in window,
              },
              webgl: collectWebGL(),
              storage: {
                localStorage: localStorageAvailable(),
                indexedDB: "indexedDB" in window,
                quotaBytes,
                usageBytes,
              },
            });
          }

          function exportActive(): boolean {
            return Array.from(document.querySelectorAll<HTMLElement>(
              ".export-overlay, [data-exporting='true'], [aria-label='Export progress']",
            )).some((element) => {
              const style = window.getComputedStyle(element);
              const rect = element.getBoundingClientRect();
              return style.display !== "none" && style.visibility !== "hidden" && rect.width > 0 && rect.height > 0;
            });
          }

          function fallbackCopy(text: string): boolean {
            const area = document.createElement("textarea");
            area.value = text;
            area.setAttribute("readonly", "true");
            area.style.cssText = "position:fixed;left:-9999px;top:0";
            document.body.append(area);
            area.select();
            const copied = document.execCommand("copy");
            area.remove();
            return copied;
          }

          const ROOT_ID = "drift-diagnostics-root";
          const STYLE_ID = "drift-diagnostics-style";

          function installStyles(): void {
            if (document.getElementById(STYLE_ID)) return;
            const style = document.createElement("style");
            style.id = STYLE_ID;
            style.textContent = `
              .drift-diagnostics-root { position: fixed; inset: 0; z-index: 10003; display: none; place-items: start center; padding: max(7vh,48px) 18px 24px; background: rgba(5,5,7,.66); backdrop-filter: blur(18px) saturate(.82); }
              .drift-diagnostics-root[data-open='true'] { display: grid; }
              .drift-diagnostics-dialog { display: grid; grid-template-rows: auto minmax(0,1fr) auto; width: min(760px,100%); max-height: min(84vh,820px); overflow: hidden; border: 1px solid rgba(255,255,255,.16); border-radius: 24px; background: #151518; color: #f5f1e8; box-shadow: 0 36px 120px rgba(0,0,0,.58); }
              .drift-diagnostics-head { padding: 18px 20px 14px; border-bottom: 1px solid rgba(255,255,255,.1); }
              .drift-diagnostics-kicker { margin: 0 0 6px; font: 600 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .14em; text-transform: uppercase; opacity: .58; }
              .drift-diagnostics-title { margin: 0; font: 620 22px/1.15 system-ui,sans-serif; }
              .drift-diagnostics-note { margin: 8px 0 0; max-width: 62ch; color: rgba(245,241,232,.57); font: 470 11px/1.5 system-ui,sans-serif; }
              .drift-diagnostics-pre { overflow: auto; margin: 0; padding: 18px 20px; background: #0c0c0f; color: rgba(245,241,232,.77); font: 500 10px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace; white-space: pre-wrap; word-break: break-word; }
              .drift-diagnostics-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; padding: 12px 20px max(16px,env(safe-area-inset-bottom)); border-top: 1px solid rgba(255,255,255,.1); }
              .drift-diagnostics-action { min-height: 38px; padding: 0 13px; border: 1px solid rgba(255,255,255,.13); border-radius: 999px; background: transparent; color: rgba(245,241,232,.74); font: 650 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .07em; text-transform: uppercase; cursor: pointer; }
              .drift-diagnostics-action:hover, .drift-diagnostics-action:focus-visible { color: #fffaf0; border-color: rgba(255,255,255,.28); outline: none; }
              .drift-diagnostics-copy { background: rgba(255,255,255,.1); }
              .drift-diagnostics-live { position: fixed; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
              @media (max-width: 620px) { .drift-diagnostics-root { padding-top: 18px; } .drift-diagnostics-dialog { border-radius: 20px; } .drift-diagnostics-actions { justify-content: stretch; } .drift-diagnostics-action { flex: 1; } }
              @media (prefers-reduced-motion: reduce) { .drift-diagnostics-root { backdrop-filter: none; } }
            `;
            document.head.append(style);
          }

          export function installDiagnosticsDialog(): () => void {
            if (document.getElementById(ROOT_ID)) return () => undefined;
            installStyles();
            const root = document.createElement("div");
            root.id = ROOT_ID;
            root.className = "drift-diagnostics-root";
            root.dataset.open = "false";
            root.innerHTML = `
              <section class="drift-diagnostics-dialog" role="dialog" aria-modal="true" aria-label="Support diagnostics">
                <header class="drift-diagnostics-head"><p class="drift-diagnostics-kicker">Inspect before sharing</p><h2 class="drift-diagnostics-title">Privacy-safe support receipt</h2><p class="drift-diagnostics-note">Contains browser, codec, canvas, storage quota and GPU-limit information. It never includes slides, filenames, project names, file paths, asset hashes, or presenter metadata.</p></header>
                <pre class="drift-diagnostics-pre" aria-label="Diagnostics payload">Collecting capability truth…</pre>
                <footer class="drift-diagnostics-actions"><button class="drift-diagnostics-action drift-diagnostics-close" type="button">Close</button><button class="drift-diagnostics-action drift-diagnostics-download" type="button">Download JSON</button><button class="drift-diagnostics-action drift-diagnostics-copy" type="button">Copy receipt</button></footer>
              </section>`;
            const live = document.createElement("div");
            live.className = "drift-diagnostics-live";
            live.setAttribute("role", "status");
            live.setAttribute("aria-live", "polite");
            document.body.append(root, live);
            const pre = root.querySelector<HTMLPreElement>(".drift-diagnostics-pre")!;
            const closeButton = root.querySelector<HTMLButtonElement>(".drift-diagnostics-close")!;
            const copyButton = root.querySelector<HTMLButtonElement>(".drift-diagnostics-copy")!;
            const downloadButton = root.querySelector<HTMLButtonElement>(".drift-diagnostics-download")!;
            let report: DriftDiagnostics | null = null;
            let returnFocus: HTMLElement | null = null;

            const close = (): void => {
              root.dataset.open = "false";
              returnFocus?.focus({ preventScroll: true });
              returnFocus = null;
            };
            const open = async (): Promise<void> => {
              if (exportActive() || root.dataset.open === "true") return;
              returnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
              root.dataset.open = "true";
              report = null;
              pre.textContent = "Collecting capability truth…";
              requestAnimationFrame(() => closeButton.focus());
              try {
                report = await collectDiagnostics();
                pre.textContent = diagnosticsText(report);
                live.textContent = "Support receipt ready for inspection.";
              } catch (error) {
                pre.textContent = error instanceof Error ? error.message : "Diagnostics could not be collected.";
              }
            };
            const copy = async (): Promise<void> => {
              if (!report) return;
              const text = diagnosticsText(report);
              try {
                if (navigator.clipboard?.writeText) await navigator.clipboard.writeText(text);
                else if (!fallbackCopy(text)) throw new Error("Clipboard unavailable.");
                live.textContent = "Support receipt copied.";
              } catch {
                live.textContent = fallbackCopy(text) ? "Support receipt copied." : "Clipboard access was refused. Download the JSON instead.";
              }
            };
            const download = (): void => {
              if (!report) return;
              const blob = new Blob([diagnosticsText(report)], { type: "application/json" });
              const url = URL.createObjectURL(blob);
              const anchor = document.createElement("a");
              anchor.href = url;
              anchor.download = `drift-support-${new Date().toISOString().replace(/[:.]/g, "-")}.json`;
              anchor.click();
              window.setTimeout(() => URL.revokeObjectURL(url), 1000);
              live.textContent = "Support receipt downloaded.";
            };
            const onOpen = (): void => { void open(); };
            const onBackdrop = (event: MouseEvent): void => { if (event.target === root) close(); };
            const onKeydown = (event: KeyboardEvent): void => {
              if (root.dataset.open !== "true") return;
              if (event.key === "Escape") { event.preventDefault(); close(); return; }
              if (event.key !== "Tab") return;
              const focusable = Array.from(root.querySelectorAll<HTMLElement>("button:not([disabled]), [href], [tabindex]:not([tabindex='-1'])"));
              const first = focusable[0];
              const last = focusable[focusable.length - 1];
              if (first && last && event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
              else if (first && last && !event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
            };
            const syncExportBoundary = (): void => { if (exportActive() && root.dataset.open === "true") close(); };
            const observer = new MutationObserver(syncExportBoundary);
            observer.observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["class", "hidden", "aria-hidden", "data-exporting"] });
            closeButton.addEventListener("click", close);
            copyButton.addEventListener("click", copy);
            downloadButton.addEventListener("click", download);
            root.addEventListener("click", onBackdrop);
            window.addEventListener("drift:diagnostics-open", onOpen);
            document.addEventListener("keydown", onKeydown);
            return () => {
              observer.disconnect();
              closeButton.removeEventListener("click", close);
              copyButton.removeEventListener("click", copy);
              downloadButton.removeEventListener("click", download);
              root.removeEventListener("click", onBackdrop);
              window.removeEventListener("drift:diagnostics-open", onOpen);
              document.removeEventListener("keydown", onKeydown);
              root.remove();
              live.remove();
            };
          }
          TS

          python - <<'PY'
          from pathlib import Path
          path = Path('src/main.tsx')
          original = path.read_text(); text = original
          import_line = 'import { installDiagnosticsDialog } from "./lib/diagnostics";'
          if import_line not in text:
              lines = text.splitlines(); last_import = max(i for i, line in enumerate(lines) if line.startswith('import ')); lines.insert(last_import + 1, import_line); text = '\n'.join(lines) + ('\n' if original.endswith('\n') else '')
          if 'installDiagnosticsDialog();' not in text:
              anchor = 'installWorldAudition();'
              if anchor not in text: raise SystemExit('World Audition installer not found')
              text = text.replace(anchor, anchor + '\ninstallDiagnosticsDialog();', 1)
          path.write_text(text)
          PY

          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/directorCommands.ts'); text = path.read_text()
          if 'id: "diagnostics"' not in text:
              anchor = '''  {
              id: "takes",'''
              insertion = '''  {
              id: "diagnostics",
              title: "Inspect support diagnostics",
              description: "Review a media-free browser, codec, canvas and GPU receipt before sharing it.",
              section: "Recover",
              keywords: ["support", "diagnostics", "gpu", "webgl", "codec", "browser", "receipt", "debug"],
              targets: [],
              event: "drift:diagnostics-open",
              shortcut: "⇧D",
            },
            {
              id: "takes",'''
              if anchor not in text: raise SystemExit('Take command anchor not found')
              text = text.replace(anchor, insertion, 1)
          shortcut_anchor = '''                if (key === "w" && event.shiftKey) {'''
          shortcut_replacement = '''                if (key === "d" && event.shiftKey) {
                  const diagnostics = DIRECTOR_COMMANDS.find((command) => command.id === "diagnostics");
                  if (diagnostics && runCommand(diagnostics)) {
                    event.preventDefault();
                    return;
                  }
                }
                if (key === "w" && event.shiftKey) {'''
          if 'command.id === "diagnostics"' not in text:
              if shortcut_anchor not in text: raise SystemExit('Shift-W shortcut anchor not found')
              text = text.replace(shortcut_anchor, shortcut_replacement, 1)
          path.write_text(text)
          PY

          cat > tests/diagnostics.test.ts <<'TS'
          import { describe, expect, it } from "vitest";
          import { buildDiagnostics, diagnosticsFieldNames, diagnosticsText, type DiagnosticsInput } from "../src/lib/diagnostics";

          const input: DiagnosticsInput = {
            generatedAt: "2026-08-20T00:00:00.000Z",
            app: { schemaVersion: 1, engineVersion: "1", shaderVersion: "1", themeVersion: "1" },
            runtime: { userAgent: "Browser Test", language: "en", platform: "test", crossOriginIsolated: false, reducedMotion: false },
            viewport: { width: 1080, height: 1920, devicePixelRatio: 2 },
            browserCapabilities: { webgl2: true, videoEncoder: true, videoDecoder: true, audioEncoder: true, offscreenCanvas: true, imageBitmap: true, fileSavePicker: true, directoryPicker: true },
            webgl: { vendor: "Test", renderer: "Test GPU", maxTextureSize: 8192, maxRenderbufferSize: 8192, maxViewportWidth: 8192, maxViewportHeight: 8192, maxSamples: 4, maxAnisotropy: 8, contextLost: false, drawingBufferWidth: 1080, drawingBufferHeight: 1920 },
            storage: { localStorage: true, indexedDB: true, quotaBytes: 1000, usageBytes: 10 },
          };

          describe("support diagnostics", () => {
            it("contains only capability and runtime fields", () => {
              const fields = diagnosticsFieldNames(buildDiagnostics(input)).join(" ").toLowerCase();
              for (const forbidden of ["asset", "filename", "filepath", "projectname", "presenter", "hash", "slide"]) {
                expect(fields).not.toContain(forbidden);
              }
            });
            it("deep-clones the inspected report", () => {
              const report = buildDiagnostics(input);
              input.viewport.width = 1;
              expect(report.viewport.width).toBe(1080);
            });
            it("serializes as inspectable JSON", () => {
              const text = diagnosticsText(buildDiagnostics(input));
              expect(JSON.parse(text).webgl.maxTextureSize).toBe(8192);
            });
          });
          TS

          cat > e2e/diagnostics.e2e.ts <<'TS'
          import { expect, test } from "@playwright/test";

          test("support receipt is inspectable and excludes project media", async ({ page }) => {
            await page.goto("/");
            await expect(page.locator("canvas").first()).toBeVisible();
            await page.keyboard.press("Shift+d");
            const dialog = page.getByRole("dialog", { name: "Support diagnostics" });
            await expect(dialog).toBeVisible();
            const payload = page.getByLabel("Diagnostics payload");
            await expect(payload).toContainText("engineVersion");
            await expect(payload).toContainText("maxTextureSize");
            const text = (await payload.textContent())?.toLowerCase() ?? "";
            for (const forbidden of ["slide.png", "presenter.mp4", "assetid", "projectname", "filepath"]) expect(text).not.toContain(forbidden);
            await page.getByRole("button", { name: "Close" }).click();
            await expect(dialog).toBeHidden();
          });
          TS

          if [ -f docs/CREATOR_JOURNEY.md ] && ! grep -q "Support receipt" docs/CREATOR_JOURNEY.md; then
            cat >> docs/CREATOR_JOURNEY.md <<'MD'

          ## Support without surrendering the deck

          Support Diagnostics shows its complete JSON before anything is copied or downloaded. It contains Drift versions, browser capabilities, codec availability, viewport, storage quota, canvas dimensions and WebGL limits. It excludes slides, filenames, project names, paths, asset identifiers, hashes and presenter metadata.
          MD
          fi

          find .github/workflows -maxdepth 1 -type f ! -name 'ci.yml' -delete

      - name: Typecheck
        run: npm run typecheck

      - name: Run machine-readable unit gauntlet
        run: npx vitest run --reporter=json --outputFile=/tmp/vitest.json

      - name: Build production bundle
        run: npm run build

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Run complete browser gauntlet
        run: npx playwright test --reporter=json > /tmp/playwright.json

      - name: Capture the inspectable receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/media
          npm run dev -- --port 4179 > /tmp/drift-vite.log 2>&1 &
          SERVER_PID=$!; cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }; trap cleanup EXIT
          for attempt in $(seq 1 60); do if curl -fsS http://127.0.0.1:4179/ >/dev/null; then break; fi; if [ "$attempt" -eq 60 ]; then cat /tmp/drift-vite.log; exit 1; fi; sleep 1; done
          node --input-type=module <<'JS'
          import { chromium } from "@playwright/test";
          const browser = await chromium.launch({ headless: true, args: ["--use-gl=swiftshader", "--enable-webgl", "--ignore-gpu-blocklist"] });
          const page = await browser.newPage({ viewport: { width: 1600, height: 1100 }, deviceScaleFactor: 1 });
          await page.goto("http://127.0.0.1:4179/", { waitUntil: "networkidle" });
          await page.locator("canvas").first().waitFor({ state: "visible" });
          await page.keyboard.press("Shift+d");
          await page.getByRole("dialog", { name: "Support diagnostics" }).waitFor({ state: "visible" });
          await page.getByLabel("Diagnostics payload").waitFor({ state: "visible" });
          await page.screenshot({ path: "docs/media/support-diagnostics.png", fullPage: true });
          await browser.close();
          JS

      - name: Refresh exact QA receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone
          vitest = json.loads(Path('/tmp/vitest.json').read_text()); playwright = json.loads(Path('/tmp/playwright.json').read_text())
          unit_total = vitest.get('numTotalTests'); unit_passed = vitest.get('numPassedTests'); unit_failed = vitest.get('numFailedTests')
          if unit_total is None:
