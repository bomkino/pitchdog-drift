name: Live world audition

on:
  push:
    branches: [gauntlet/directors-cut-optical-pipeline]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: live-world-audition
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/directors-cut-optical-pipeline
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Wait for the verified Take Shelf
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 180); do
            git fetch origin gauntlet/directors-cut-optical-pipeline
            if git cat-file -e origin/gauntlet/directors-cut-optical-pipeline:src/lib/directorTakes.ts 2>/dev/null \
              && git show origin/gauntlet/directors-cut-optical-pipeline:src/lib/directorCommands.ts 2>/dev/null | grep -q 'id: "takes"'; then
              git reset --hard origin/gauntlet/directors-cut-optical-pipeline
              exit 0
            fi
            if [ "$attempt" -eq 180 ]; then echo "Take Shelf never reached the branch." >&2; exit 1; fi
            sleep 10
          done

      - name: Cancel stale branch runs
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs?branch=gauntlet%2Fdirectors-cut-optical-pipeline&per_page=100" \
            --jq ".workflow_runs[] | select(.id != (${CURRENT_RUN}|tonumber)) | select(.status == \"queued\" or .status == \"in_progress\" or .status == \"waiting\" or .status == \"pending\") | .id" \
            | while read -r run_id; do gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" || true; done
          sleep 8

      - name: Install locked dependencies
        run: npm ci

      - name: Build live world audition
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/directorTakes.ts')
          text = path.read_text()
          text = text.replace(
              'function requestCurrentPatch(): Promise<DirectorTakePatch> {',
              'export function requestCurrentDirectorTake(): Promise<DirectorTakePatch> {',
          )
          text = text.replace('await requestCurrentPatch();', 'await requestCurrentDirectorTake();')
          anchor = '''          function exportActive(): boolean {'''
          insertion = '''          export function applyDirectorTakeToStudio(patch: DirectorTakePatch): void {
            window.dispatchEvent(new CustomEvent<DirectorTakePatch>("drift:director-take-apply", {
              detail: structuredClone(patch),
            }));
          }

          function exportActive(): boolean {'''
          if 'export function applyDirectorTakeToStudio' not in text:
              if anchor not in text:
                  raise SystemExit('Take application anchor not found')
              text = text.replace(anchor, insertion, 1)
          text = text.replace(
              'window.dispatchEvent(new CustomEvent<DirectorTakePatch>("drift:director-take-apply", { detail: structuredClone(take.patch) }));',
              'applyDirectorTakeToStudio(take.patch);',
          )
          path.write_text(text)
          PY

          cat > src/lib/worldAudition.ts <<'TS'
          import { THEMES, type ThemePreset } from "../themes";
          import {
            applyDirectorTakeToStudio,
            captureDirectorTake,
            requestCurrentDirectorTake,
            type DirectorTakePatch,
          } from "./directorTakes";

          export function normalizeWorldQuery(value: string): string {
            return value
              .normalize("NFKD")
              .replace(/[\u0300-\u036f]/g, "")
              .toLocaleLowerCase()
              .replace(/[^a-z0-9]+/g, " ")
              .trim();
          }

          export function worldSearchText(theme: ThemePreset): string {
            return normalizeWorldQuery([
              theme.id,
              theme.name,
              theme.eyebrow,
              theme.description,
              "film world theme genre",
            ].join(" "));
          }

          export function filterWorlds(query: string, themes: readonly ThemePreset[] = THEMES): ThemePreset[] {
            const normalized = normalizeWorldQuery(query);
            if (!normalized) return [...themes];
            const terms = normalized.split(" ").filter(Boolean);
            return themes.filter((theme) => {
              const haystack = worldSearchText(theme);
              return terms.every((term) => haystack.includes(term));
            });
          }

          export function worldDirectorTake(theme: ThemePreset): DirectorTakePatch {
            return captureDirectorTake(theme.settings);
          }

          function visible(element: HTMLElement): boolean {
            const style = window.getComputedStyle(element);
            const rect = element.getBoundingClientRect();
            return style.display !== "none" && style.visibility !== "hidden" && rect.width > 0 && rect.height > 0;
          }

          function exportActive(): boolean {
            return Array.from(document.querySelectorAll<HTMLElement>(
              ".export-overlay, [data-exporting='true'], [aria-label='Export progress']",
            )).some(visible);
          }

          const ROOT_ID = "drift-world-audition-root";
          const STYLE_ID = "drift-world-audition-style";

          function installStyles(): void {
            if (document.getElementById(STYLE_ID)) return;
            const style = document.createElement("style");
            style.id = STYLE_ID;
            style.textContent = `
              .world-audition-root { position: fixed; inset: 0; z-index: 10002; display: none; align-items: stretch; justify-content: flex-start; background: linear-gradient(90deg,rgba(5,5,7,.95) 0,rgba(5,5,7,.91) 390px,rgba(5,5,7,.28) 66%,rgba(5,5,7,.08)); backdrop-filter: saturate(.86); }
              .world-audition-root[data-open='true'] { display: flex; }
              .world-audition-panel { display: grid; grid-template-rows: auto auto minmax(0,1fr) auto; width: min(390px,100vw); min-height: 100%; border-right: 1px solid rgba(255,255,255,.12); background: rgba(17,17,20,.7); color: #f5f1e8; box-shadow: 30px 0 90px rgba(0,0,0,.24); }
              .world-audition-head { padding: max(24px,env(safe-area-inset-top)) 20px 14px; }
              .world-audition-kicker { margin: 0 0 7px; font: 600 10px/1.2 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .14em; text-transform: uppercase; opacity: .58; }
              .world-audition-title { margin: 0; font: 620 24px/1.08 system-ui,sans-serif; }
              .world-audition-search-wrap { padding: 0 20px 14px; border-bottom: 1px solid rgba(255,255,255,.08); }
              .world-audition-search { box-sizing: border-box; width: 100%; min-height: 40px; border: 1px solid rgba(255,255,255,.12); border-radius: 13px; outline: 0; padding: 0 12px; background: rgba(255,255,255,.055); color: inherit; font: 520 13px/1 system-ui,sans-serif; }
              .world-audition-search:focus { border-color: rgba(255,235,194,.45); }
              .world-audition-list { overflow: auto; padding: 8px; }
              .world-audition-card { display: block; width: 100%; padding: 13px 12px; border: 1px solid transparent; border-radius: 15px; background: transparent; color: inherit; text-align: left; cursor: pointer; }
              .world-audition-card:hover, .world-audition-card:focus-visible { background: rgba(255,255,255,.055); outline: none; }
              .world-audition-card[aria-pressed='true'] { border-color: rgba(255,235,194,.34); background: rgba(255,235,194,.09); }
              .world-audition-card-name { display: block; font: 620 13px/1.25 system-ui,sans-serif; }
              .world-audition-card-note { display: block; margin-top: 4px; color: rgba(245,241,232,.58); font: 470 10px/1.45 system-ui,sans-serif; }
              .world-audition-empty { padding: 34px 18px; color: rgba(245,241,232,.54); text-align: center; font: 480 12px/1.5 system-ui,sans-serif; }
              .world-audition-foot { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px 20px max(18px,env(safe-area-inset-bottom)); border-top: 1px solid rgba(255,255,255,.08); }
              .world-audition-action { min-height: 40px; border: 1px solid rgba(255,255,255,.13); border-radius: 999px; background: transparent; color: rgba(245,241,232,.76); font: 650 9px/1 ui-monospace,SFMono-Regular,Menlo,monospace; letter-spacing: .07em; text-transform: uppercase; cursor: pointer; }
              .world-audition-action:hover, .world-audition-action:focus-visible { color: #fffaf0; border-color: rgba(255,255,255,.28); outline: none; }
              .world-audition-keep { background: rgba(255,255,255,.1); }
              .world-audition-live { position: fixed; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
              @media (max-width: 660px) { .world-audition-root { background: rgba(5,5,7,.9); } .world-audition-panel { width: 100%; border-right: 0; } }
              @media (prefers-reduced-motion: reduce) { .world-audition-root { backdrop-filter: none; } }
            `;
            document.head.append(style);
          }

          export function installWorldAudition(): () => void {
            if (document.getElementById(ROOT_ID)) return () => undefined;
            installStyles();
            const root = document.createElement("div");
            root.id = ROOT_ID;
            root.className = "world-audition-root";
            root.dataset.open = "false";
            root.innerHTML = `
              <section class="world-audition-panel" role="dialog" aria-modal="true" aria-label="World audition">
                <header class="world-audition-head"><p class="world-audition-kicker">Live on your deck · arrows move</p><h2 class="world-audition-title">Audition film worlds</h2></header>
                <div class="world-audition-search-wrap"><input class="world-audition-search" type="search" autocomplete="off" spellcheck="false" aria-label="Search film worlds" placeholder="Horror, travel, romance, night…" /></div>
                <div class="world-audition-list"></div>
                <footer class="world-audition-foot"><button class="world-audition-action world-audition-return" type="button">Return to previous</button><button class="world-audition-action world-audition-keep" type="button">Keep this world</button></footer>
              </section>`;
            const live = document.createElement("div");
            live.className = "world-audition-live";
            live.setAttribute("role", "status");
            live.setAttribute("aria-live", "polite");
            document.body.append(root, live);
            const search = root.querySelector<HTMLInputElement>(".world-audition-search")!;
            const list = root.querySelector<HTMLDivElement>(".world-audition-list")!;
            const keep = root.querySelector<HTMLButtonElement>(".world-audition-keep")!;
            const restore = root.querySelector<HTMLButtonElement>(".world-audition-return")!;
            let baseline: DirectorTakePatch | null = null;
            let selectedId = THEMES[0]?.id ?? "";
            let filtered = [...THEMES];
            let returnFocus: HTMLElement | null = null;

            const applyTheme = (theme: ThemePreset, announce = true): void => {
              selectedId = theme.id;
              applyDirectorTakeToStudio(worldDirectorTake(theme));
              if (announce) live.textContent = `${theme.name} is live on the stage.`;
              render();
            };
            const render = (): void => {
              filtered = filterWorlds(search.value);
              list.replaceChildren();
              if (filtered.length === 0) {
                const empty = document.createElement("div");
                empty.className = "world-audition-empty";
                empty.textContent = "No authored world matches. Search a feeling, genre, or world name.";
                list.append(empty);
                return;
              }
              for (const theme of filtered) {
                const card = document.createElement("button");
                card.type = "button";
                card.className = "world-audition-card";
                card.dataset.themeId = theme.id;
                card.setAttribute("aria-pressed", String(theme.id === selectedId));
                card.setAttribute("aria-label", `${theme.name} — ${theme.eyebrow}`);
                const name = document.createElement("span");
                name.className = "world-audition-card-name";
                name.textContent = theme.name;
                const note = document.createElement("span");
                note.className = "world-audition-card-note";
                note.textContent = `${theme.eyebrow} · ${theme.description}`;
                card.append(name, note);
                card.addEventListener("click", () => applyTheme(theme));
                list.append(card);
              }
              list.querySelector<HTMLElement>(`[data-theme-id='${selectedId}']`)?.scrollIntoView({ block: "nearest" });
            };
            const close = (): void => {
              root.dataset.open = "false";
              baseline = null;
              search.value = "";
              returnFocus?.focus({ preventScroll: true });
              returnFocus = null;
            };
            const open = async (): Promise<void> => {
              if (exportActive() || root.dataset.open === "true") return;
              try {
                baseline = await requestCurrentDirectorTake();
                selectedId = baseline.themeId;
                returnFocus = document.activeElement instanceof HTMLElement ? document.activeElement : null;
                root.dataset.open = "true";
                search.value = "";
                render();
                requestAnimationFrame(() => search.focus());
              } catch (error) {
                live.textContent = error instanceof Error ? error.message : "World audition is unavailable.";
              }
            };
            const keepCurrent = (): void => {
              const theme = THEMES.find((candidate) => candidate.id === selectedId);
              live.textContent = `${theme?.name ?? "This world"} kept.`;
              close();
            };
            const restoreBaseline = (): void => {
              if (baseline) applyDirectorTakeToStudio(baseline);
              live.textContent = "The pre-audition direction is back.";
              close();
            };
            const move = (offset: number): void => {
              if (filtered.length === 0) return;
              const currentIndex = Math.max(0, filtered.findIndex((theme) => theme.id === selectedId));
              const next = filtered[(currentIndex + offset + filtered.length) % filtered.length];
              if (next) applyTheme(next);
            };
            const onSearch = (): void => render();
            const onOpen = (): void => { void open(); };
            const onDirectWorld = (event: Event): void => {
              const id = (event as CustomEvent<unknown>).detail;
              if (typeof id !== "string") return;
              const theme = THEMES.find((candidate) => candidate.id === id);
              if (theme && !exportActive()) applyTheme(theme);
            };
            const onKeydown = (event: KeyboardEvent): void => {
              if (root.dataset.open !== "true") return;
              if (event.key === "Escape") { event.preventDefault(); restoreBaseline(); return; }
              if (event.key === "ArrowDown" || event.key === "ArrowRight") { event.preventDefault(); move(1); return; }
              if (event.key === "ArrowUp" || event.key === "ArrowLeft") { event.preventDefault(); move(-1); return; }
              if (event.key === "Enter" && document.activeElement === search && filtered.length === 1 && filtered[0]) {
                event.preventDefault();
                applyTheme(filtered[0]);
                return;
              }
              if (event.key !== "Tab") return;
              const focusable = Array.from(root.querySelectorAll<HTMLElement>("input, button:not([disabled]), [href], [tabindex]:not([tabindex='-1'])")).filter(visible);
              const first = focusable[0];
              const last = focusable[focusable.length - 1];
              if (first && last && event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
              else if (first && last && !event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
            };
            const syncExportBoundary = (): void => {
              if (exportActive() && root.dataset.open === "true") restoreBaseline();
            };
            const observer = new MutationObserver(syncExportBoundary);
            observer.observe(document.body, { subtree: true, childList: true, attributes: true, attributeFilter: ["class", "hidden", "aria-hidden", "data-exporting"] });
            search.addEventListener("input", onSearch);
            keep.addEventListener("click", keepCurrent);
            restore.addEventListener("click", restoreBaseline);
            window.addEventListener("drift:world-audition-open", onOpen);
            window.addEventListener("drift:director-world-apply", onDirectWorld as EventListener);
            document.addEventListener("keydown", onKeydown);
            render();
            document.documentElement.dataset.worldAuditionReady = "true";
            return () => {
              observer.disconnect();
              search.removeEventListener("input", onSearch);
              keep.removeEventListener("click", keepCurrent);
              restore.removeEventListener("click", restoreBaseline);
              window.removeEventListener("drift:world-audition-open", onOpen);
              window.removeEventListener("drift:director-world-apply", onDirectWorld as EventListener);
              document.removeEventListener("keydown", onKeydown);
              delete document.documentElement.dataset.worldAuditionReady;
              root.remove();
              live.remove();
            };
          }
          TS

          python - <<'PY'
          from pathlib import Path
          path = Path('src/main.tsx')
          original = path.read_text()
          text = original
          import_line = 'import { installWorldAudition } from "./lib/worldAudition";'
          if import_line not in text:
              lines = text.splitlines()
              last_import = max(i for i, line in enumerate(lines) if line.startswith('import '))
              lines.insert(last_import + 1, import_line)
              text = '\n'.join(lines) + ('\n' if original.endswith('\n') else '')
          if 'installWorldAudition();' not in text:
              anchor = 'installDirectorTakeShelf();'
              if anchor not in text:
                  raise SystemExit('Take Shelf installer not found')
              text = text.replace(anchor, anchor + '\ninstallWorldAudition();', 1)
          path.write_text(text)
          PY

          python - <<'PY'
          from pathlib import Path
          path = Path('src/lib/directorCommands.ts')
          text = path.read_text()
          if 'event?: string;' not in text:
              anchor = '  hiddenWhenIdle?: boolean;\n'
              if anchor not in text:
                  raise SystemExit('DirectorCommand extension anchor not found')
              text = text.replace(anchor, anchor + '  event?: string;\n  detail?: unknown;\n', 1)
          world_anchor = '''    targets: [theme.name],
            mode: "click",
            hiddenWhenIdle: true,'''
          world_replacement = '''    targets: [theme.name],
            mode: "click",
            hiddenWhenIdle: true,
            event: "drift:director-world-apply",
            detail: theme.id,'''
          if 'event: "drift:director-world-apply"' not in text:
              if world_anchor not in text:
                  raise SystemExit('World command anchor not found')
              text = text.replace(world_anchor, world_replacement, 1)
          run_anchor = '''          function runCommand(command: DirectorCommand): boolean {
            const target = findTarget(command);'''
          run_replacement = '''          function runCommand(command: DirectorCommand): boolean {
            if (command.event) {
              window.dispatchEvent(new CustomEvent(command.event, { detail: structuredClone(command.detail) }));
              return true;
            }
            const target = findTarget(command);'''
          if 'if (command.event)' not in text:
              if run_anchor not in text:
                  raise SystemExit('runCommand anchor not found')
              text = text.replace(run_anchor, run_replacement, 1)
          if 'id: "audition-worlds"' not in text:
              anchor = '''  {
              id: "choose-world",'''
              insertion = '''  {
              id: "audition-worlds",
              title: "Audition film worlds",
              description: "Apply authored worlds live, move with the arrow keys, then keep one or return exactly.",
              section: "Direct",
              keywords: ["audition", "browse", "compare", "worlds", "genres", "moods", "live"],
              targets: [],
              event: "drift:world-audition-open",
              shortcut: "⇧W",
            },
            {
              id: "choose-world",'''
              if anchor not in text:
                  raise SystemExit('Choose-world command anchor not found')
              text = text.replace(anchor, insertion, 1)
          shortcut_anchor = '''                if (key === "w") {
                  event.preventDefault();
                  open();'''
          shortcut_replacement = '''                if (key === "w" && event.shiftKey) {
                  const audition = DIRECTOR_COMMANDS.find((command) => command.id === "audition-worlds");
                  if (audition && runCommand(audition)) {
                    event.preventDefault();
                    return;
                  }
                }
                if (key === "w") {
                  event.preventDefault();
                  open();'''
          if 'command.id === "audition-worlds"' not in text:
              if shortcut_anchor not in text:
                  raise SystemExit('World shortcut anchor not found')
              text = text.replace(shortcut_anchor, shortcut_replacement, 1)
          path.write_text(text)
          PY

          cat > tests/worldAudition.test.ts <<'TS'
          import { describe, expect, it } from "vitest";
          import { THEMES } from "../src/themes";
          import { filterWorlds, normalizeWorldQuery, worldDirectorTake, worldSearchText } from "../src/lib/worldAudition";

          describe("world audition", () => {
            it("indexes every authored world through its complete direction note", () => {
              expect(filterWorlds("")).toHaveLength(THEMES.length);
              for (const theme of THEMES) {
                expect(worldSearchText(theme)).toContain(normalizeWorldQuery(theme.name));
                expect(filterWorlds(theme.name).some((candidate) => candidate.id === theme.id)).toBe(true);
              }
            });
            it("understands genre language rather than requiring exact preset names", () => {
              expect(filterWorlds("horror").length).toBeGreaterThan(0);
              expect(filterWorlds("travel").length).toBeGreaterThan(0);
            });
            it("compiles a world to a media-free take", () => {
              const take = worldDirectorTake(THEMES[0]!);
              expect(take.themeId).toBe(THEMES[0]!.id);
              expect("presenter" in take).toBe(false);
              expect("output" in take).toBe(false);
            });
          });
          TS

          cat > e2e/worldAudition.e2e.ts <<'TS'
          import { expect, test } from "@playwright/test";

          test("world audition applies live worlds and restores the prior direction", async ({ page }) => {
            await page.goto("/");
            await expect(page.locator("canvas").first()).toBeVisible();
            await page.keyboard.press("Control+K");
            const commandSearch = page.getByRole("searchbox", { name: "Search director commands" });
            await commandSearch.fill("audition worlds");
            await page.getByRole("option", { name: /Audition film worlds/i }).click();
            const dialog = page.getByRole("dialog", { name: "World audition" });
            await expect(dialog).toBeVisible();
            const search = page.getByRole("searchbox", { name: "Search film worlds" });
            await search.fill("horror");
            const cards = page.locator(".world-audition-card");
            expect(await cards.count()).toBeGreaterThan(0);
            await cards.first().click();
            await expect(cards.first()).toHaveAttribute("aria-pressed", "true");
            await page.keyboard.press("ArrowRight");
            await page.getByRole("button", { name: "Return to previous" }).click();
            await expect(dialog).toBeHidden();

            await page.keyboard.press("Shift+w");
            await expect(dialog).toBeVisible();
            await page.getByRole("button", { name: "Keep this world" }).click();
            await expect(dialog).toBeHidden();
          });
          TS

          if [ -f docs/CREATOR_JOURNEY.md ] && ! grep -q "Audition before committing" docs/CREATOR_JOURNEY.md; then
            cat >> docs/CREATOR_JOURNEY.md <<'MD'

          ## Audition before committing

          World Audition keeps the deck live behind a narrow directing rail. Search by genre or feeling, use the arrow keys to move through authored worlds, then keep the active world or restore the exact pre-audition direction. Direct world commands use the same settings bridge, so they no longer depend on visible button copy or an expanded panel.
          MD
          fi

          find .github/workflows -maxdepth 1 -type f ! -name 'ci.yml' -delete

      - name: Typecheck
        run: npm run typecheck

      - name: Run machine-readable unit gauntlet
        run: npx vitest run --reporter=json --outputFile=/tmp/vitest.json

      - name: Build production bundle
        run: npm run build

      - name: Install browser runtime
        run: npx playwright install --with-deps chromium

      - name: Run complete browser gauntlet
        run: npx playwright test --reporter=json > /tmp/playwright.json

      - name: Capture live world audition
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p docs/media
          npm run dev -- --port 4179 > /tmp/drift-vite.log 2>&1 &
          SERVER_PID=$!
          cleanup() { kill "$SERVER_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4179/ >/dev/null; then break; fi
            if [ "$attempt" -eq 60 ]; then cat /tmp/drift-vite.log; exit 1; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import { chromium } from "@playwright/test";
          const browser = await chromium.launch({ headless: true, args: ["--use-gl=swiftshader", "--enable-webgl", "--ignore-gpu-blocklist"] });
          const page = await browser.newPage({ viewport: { width: 1600, height: 1100 }, deviceScaleFactor: 1 });
          await page.goto("http://127.0.0.1:4179/", { waitUntil: "networkidle" });
          await page.locator("canvas").first().waitFor({ state: "visible" });
          await page.keyboard.press("Shift+w");
          await page.getByRole("dialog", { name: "World audition" }).waitFor({ state: "visible" });
          await page.getByRole("searchbox", { name: "Search film worlds" }).fill("night");
          await page.locator(".world-audition-card").first().waitFor({ state: "visible" });
          await page.screenshot({ path: "docs/media/world-audition.png", fullPage: true });
          await browser.close();
          JS

      - name: Refresh exact QA receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
