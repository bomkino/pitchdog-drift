name: Harden cinematic lighting integrity

on:
  push:
    branches:
      - feat/cinematic-lighting-rig
    paths:
      - .gauntlet/lighting-integrity.py

permissions:
  contents: write

concurrency:
  group: lighting-integrity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out lighting branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: feat/cinematic-lighting-rig

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Apply versioning, portability, and shadow-space hardening
        run: python .gauntlet/lighting-integrity.py

      - name: Reject malformed diffs
        run: git diff --check

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, unit test, and production build
        run: npm run check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run complete real-browser gauntlet
        run: npm run test:e2e

      - name: Commit only the verified result
        run: |
          git config user.name "pitch.dog lighting gauntlet"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: harden lighting versioning, portability, and shadow space"
          git push origin HEAD:feat/cinematic-lighting-rig
