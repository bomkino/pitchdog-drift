name: Apply final tactile sound hardening v2

on:
  push:
    branches:
      - gauntlet/tactile-sound-final-gpt56pro

permissions:
  contents: write

concurrency:
  group: final-tactile-sound-hardening-v2
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[apply-final-sound-hardening-v2]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out isolated final branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/tactile-sound-final-gpt56pro
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Apply audited large-file patches
        run: |
          python3 scripts/apply-final-sonic-hardening.py
          python3 scripts/apply-final-sonic-followups.py

      - name: Refresh and verify the exact pinned corpus
        run: python3 scripts/vendor-sonic-assets.py

      - name: Remove all temporary delivery machinery
        shell: bash
        run: |
          rm -f \
            .github/workflows/apply-final-sound-hardening.yml \
            .github/workflows/apply-final-sound-hardening-v2.yml \
            scripts/apply-final-sonic-hardening.py \
            scripts/apply-final-sonic-followups.py
          git diff --check

      - name: Install exact dependency lock
        run: npm ci

      - name: Run static, unit, rollback, production, bundle, and treatment gates
        run: npm run check

      - name: Verify committed source and licence provenance
        run: npm run sound:verify

      - name: Install pinned Chromium
        run: npx playwright install chromium

      - name: Run development and production browser gauntlets
        run: npm run test:e2e

      - name: Commit the reviewable hardening tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "feat(sound): finish timing, dialogue, and provenance hardening"
          git push origin HEAD:gauntlet/tactile-sound-final-gpt56pro

      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: final-tactile-sound-v2-failure-evidence
          path: |
            playwright-report/
            playwright-production-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
