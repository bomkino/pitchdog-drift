name: Harden continuous mixed audio master

on:
  push:
    branches:
      - feat/tactile-sound-system-v2
    paths:
      - .github/workflows/mixed-master-hardening.yml
      - scripts/apply-mixed-master-export.py
      - src/sonic/renderMixedMaster.ts
      - e2e/sonicMixFixture.ts
      - e2e/sonic-mix.e2e.ts
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tactile-sound-continuous-mix
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact draft head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/tactile-sound-system-v2
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Apply exact-duration mixed-master integration
        run: python3 scripts/apply-mixed-master-export.py

      - name: Install exact dependency lock
        run: npm ci

      - name: Run type, unit, production-build, and bundle gates
        run: npm run check

      - name: Install pinned Chromium
        run: npx playwright install chromium

      - name: Run full browser and AAC gauntlet
        run: npm run test:e2e

      - name: Remove one-shot integration machinery
        run: |
          rm -f \
            .github/workflows/mixed-master-hardening.yml \
            scripts/apply-mixed-master-export.py
          git diff --check

      - name: Commit only after every gate passes
        run: |
          git config user.name "pitchdog-drift sound gauntlet"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "fix(sound): preserve foley through presenter gaps"
          git push origin HEAD:feat/tactile-sound-system-v2
