name: Dependency snapshot

on:
  push:
    branches: [gauntlet/directors-cut-optical-pipeline]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Pack dependencies
        run: tar -czf /tmp/pitchdog-drift-node-modules.tgz node_modules

      - name: Upload dependency snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitchdog-drift-node-modules
          path: /tmp/pitchdog-drift-node-modules.tgz
          retention-days: 1
