name: Continued source snapshot

on:
  push:
    branches: [gauntlet/directors-cut-optical-pipeline]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/directors-cut-optical-pipeline

      - name: Pack working tree
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/pitchdog-drift-current.tgz .

      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitchdog-drift-current-source
          path: /tmp/pitchdog-drift-current.tgz
          retention-days: 1
