name: Materialize audit workspace

on:
  push:
    branches: [feat/tactile-sound-system-v2]

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install exact lockfile
        run: npm ci

      - name: Install pinned Chromium runtime
        run: npx playwright install chromium

      - name: Pack exact source checkout
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/pitchdog-drift-source.tar.gz .

      - name: Pack exact dependencies
        run: tar -czf /tmp/pitchdog-drift-node-modules.tar.gz node_modules

      - name: Pack browser runtime
        run: tar -C "$HOME/.cache" -czf /tmp/pitchdog-drift-playwright.tar.gz ms-playwright

      - name: Upload source checkout
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitchdog-drift-audit-source
          path: /tmp/pitchdog-drift-source.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload exact dependencies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitchdog-drift-audit-node-modules
          path: /tmp/pitchdog-drift-node-modules.tar.gz
          if-no-files-found: error
          retention-days: 1

      - name: Upload browser runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pitchdog-drift-audit-playwright
          path: /tmp/pitchdog-drift-playwright.tar.gz
          if-no-files-found: error
          retention-days: 1
