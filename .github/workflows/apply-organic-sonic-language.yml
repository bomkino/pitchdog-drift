name: Apply organic editorial sonic language

on:
  push:
    branches:
      - feat/organic-editorial-sonic-language-gpt56pro

permissions:
  contents: write

concurrency:
  group: organic-editorial-sonic-language
  cancel-in-progress: false

jobs:
  apply:
    if: ${{ contains(github.event.head_commit.message, '[apply-organic-sonic]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact stacked draft head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/organic-editorial-sonic-language-gpt56pro
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Prove the stacked source has not drifted
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code 55b4d157a7c09b83b87601eaee708d0b8ea9ffd2 HEAD -- . \
            ':(exclude).github/organic-sonic-patch.part-*' \
            ':(exclude).github/workflows/apply-organic-sonic-language.yml'

      - name: Reconstruct and verify the audited implementation patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .github -maxdepth 1 -type f -name 'organic-sonic-patch.part-*' | wc -l)" -eq 6
          cat > /tmp/organic-sonic-parts.sha256 <<'SUMS'
          b993ce276d1701fa3cf32d1bf75c47e70aea59d3c691e76c644337941e7b998c  .github/organic-sonic-patch.part-00
          3afeb30a63f749b9e49d6cdcfe6d47a5011b78660bd3417177627be7fc230f24  .github/organic-sonic-patch.part-01
          255f7308516030808c0ca1460ef28c0c625a57f28f9156f82563f21e5a08651d  .github/organic-sonic-patch.part-02
          01ba67d1e28ed05a5b2f0f73c2af95e1ee17e8e94866521160d2eff8698ef81f  .github/organic-sonic-patch.part-03
          319efb22f4d61c3a9064ff5fd427d45e3610f9474c2c69b25aa3422866e3aa55  .github/organic-sonic-patch.part-04
          96a97f6720afdd17fa221cac9a4bb92ac43c2ad1405d2eebfd52b8132ad4399b  .github/organic-sonic-patch.part-05
          SUMS
          sha256sum --check --strict /tmp/organic-sonic-parts.sha256
          LC_ALL=C cat .github/organic-sonic-patch.part-{00..05} | base64 --decode > /tmp/organic-sonic-language.patch.gz
          echo '6c26a45a35dd8fd519253758cf6a390256d333113308dd3bba762eb1bdec16ee  /tmp/organic-sonic-language.patch.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/organic-sonic-language.patch.gz > /tmp/organic-sonic-language.patch
          echo '75629a5cfae0e924a15cb132cc7dd663f2fe7b0ca808c3ee8e3ea54b09c07282  /tmp/organic-sonic-language.patch' | sha256sum --check --strict
          git apply --check --whitespace=error-all /tmp/organic-sonic-language.patch

      - name: Apply the organic micro-Foley grammar and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git apply --whitespace=error-all /tmp/organic-sonic-language.patch
          rm -f .github/organic-sonic-patch.part-*
          rm -f .github/workflows/apply-organic-sonic-language.yml
          test ! -e .github/workflows/organic-sonic-workspace.yml
          git diff --check

      - name: Install the exact dependency lock
        run: npm ci

      - name: Run static, unit, build, bundle, acoustic, and provenance gates
        shell: bash
        run: |
          set -euo pipefail
          npm run check
          npm run sound:verify

      - name: Install pinned Chromium
        run: npx playwright install chromium

      - name: Run the complete WebGL, privacy, interaction, cancellation, and AAC gauntlet
        run: npm run test:e2e

      - name: Commit only the verified source implementation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/organic-editorial-sonic-language-gpt56pro
          test "$(git rev-parse origin/feat/organic-editorial-sonic-language-gpt56pro)" = "$(git rev-parse HEAD)"
          test -z "$(find .github -maxdepth 2 -type f \( -name 'organic-sonic-patch.part-*' -o -name 'apply-organic-sonic-language.yml' -o -name 'organic-sonic-workspace.yml' \) -print -quit)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          test -n "$(git diff --cached --name-only)"
          git commit -m "feat(sound): add organic editorial micro-Foley grammar"
          git push origin HEAD:feat/organic-editorial-sonic-language-gpt56pro

      - name: Preserve falsification evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: organic-sonic-language-failure-evidence
          path: |
            playwright-report/
            test-results/
            /tmp/organic-sonic-language.patch
            /tmp/organic-sonic-parts.sha256
          if-no-files-found: ignore
          retention-days: 7
