name: Sonic branch gauntlet

on:
  push:
    branches: [feat/editorial-sonic-system]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: sonic-builder-single
  cancel-in-progress: true

jobs:
  build-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out sound branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/editorial-sonic-system

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Vendor pinned CC0 audio and integrate source
        run: |
          printf '\nNo third-party image, font, video, or audio asset is included in the repository.\n' >> ASSET-LICENSE.md
          node scripts/sonic-builder.mjs
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/sonic-export-builder.mjs')
          source = path.read_text()
          marker = '  await replaceOnce(\n    "src/App.tsx",\n    `      announce('
          start = source.find(marker)
          if start < 0:
              raise RuntimeError('Could not locate the truncated receipt patch.')
          tail = r'''  await replaceOnce(
            "src/App.tsx",
            `  const togglePause = useCallback(() => {
              const next = engineRef.current?.togglePaused() ?? !paused;
              setPaused(next);
            }, [paused]);`,
            `  const togglePause = useCallback(() => {
              const next = engineRef.current?.togglePaused() ?? !paused;
              setPaused(next);
              sonicRef.current?.play("control", { intensity: 0.32 });
            }, [paused]);`,
          );
          await replaceOnce(
            "src/App.tsx",
            `  const onTheme = useCallback((id: ThemeId) => {
              setSettings((current) => applyTheme(current, getTheme(id)));
              announce`,
            `  const onTheme = useCallback((id: ThemeId) => {
              setSettings((current) => applyTheme(current, getTheme(id)));
              sonicRef.current?.play("control", { intensity: 0.38 });
              announce`,
          );
          await replaceOnce(
            "src/App.tsx",
            `  const capabilityLabel = webglError`,
            `  const directSound = useCallback((patch: Partial<StudioSettings["sound"]>) => {
              sonicRef.current?.play("control", { intensity: 0.24 });
              setSettings((current) => ({
                ...current,
                sound: { ...current.sound, ...patch },
              }));
            }, []);

            const auditionSound = useCallback(() => {
              void sonicRef.current?.audition();
            }, []);

            const capabilityLabel = webglError`,
          );
          await replaceOnce(
            "src/App.tsx",
            `          <button type="button" key={panel} onClick={() => setActivePanel(panel)} aria-pressed={activePanel === panel}>`,
            `          <button type="button" key={panel} onClick={() => {
                      setActivePanel(panel);
                      sonicRef.current?.play("control", { intensity: 0.24 });
                    }} aria-pressed={activePanel === panel}>`,
          );
          await replaceOnce(
            "src/App.tsx",
            `          onToggleFocus={() => setFocusMode((value) => !value)}
                    onDropImages={addImages}
                    onCancelExport={() => abortRef.current?.abort("Canceled by user")}
                    busy={interactionBusy}`,
            `          onToggleFocus={() => {
                      setFocusMode((value) => !value);
                      sonicRef.current?.play("control", { intensity: 0.28 });
                    }}
                    onDropImages={addImages}
                    onCancelExport={() => abortRef.current?.abort("Canceled by user")}
                    sound={settings.sound}
                    sonicState={sonicState}
                    onSound={directSound}
                    onAuditionSound={auditionSound}
                    busy={interactionBusy}`,
          );
          await replaceOnce(
            "src/App.tsx",
            `        <span>THREE.JS / RAW GLSL / FIXED-STEP OUTPUT</span>`,
            `        <span>THREE.JS / RAW GLSL / FIXED-STEP PICTURE + SOUND</span>`,
          );
        }

        await patchExportStudio();
        await patchApp();
        console.log("Application and verified AAC sound integration applied.");
        '''
          path.write_text(source[:start] + tail)
          PY
          node scripts/sonic-export-builder.mjs

      - name: Install locked dependencies
        run: npm ci

      - name: Typecheck, unit test, and production build
        run: npm run check

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run real-browser gauntlet
        run: npm run test:e2e

      - name: Verify vendored sound hashes and runtime isolation
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile } from 'node:fs/promises';
          const manifest = JSON.parse(await readFile('src/sonic/assets/manifest.json', 'utf8'));
          if (manifest.files.length !== 21) throw new Error(`Expected 21 sound files, found ${manifest.files.length}.`);
          for (const entry of manifest.files) {
            const bytes = await readFile(entry.localPath);
            const digest = createHash('sha256').update(bytes).digest('hex');
            if (digest !== entry.sha256) throw new Error(`${entry.localPath}: SHA-256 mismatch.`);
          }
          const productionFiles = [
            'src/sonic/catalog.ts',
            'src/sonic/SonicEngine.ts',
            'src/sonic/renderSoundtrack.ts',
            'src/sonic/plan.ts',
          ];
          for (const file of productionFiles) {
            const source = await readFile(file, 'utf8');
            if (/https?:\/\//.test(source)) throw new Error(`${file}: runtime URL found in sonic production source.`);
          }
          NODE

      - name: Commit verified implementation only
        run: |
          rm scripts/sonic-builder.mjs scripts/sonic-export-builder.mjs .github/workflows/sonic-builder.yml
          git config user.name "pitch.dog sonic gauntlet"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add tactile editorial sound system"
          git push origin HEAD:feat/editorial-sonic-system

      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-gauntlet-failure-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
