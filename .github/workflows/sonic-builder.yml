name: Sonic recording provenance probe

on:
  push:
    branches: [feat/editorial-sonic-system]

permissions:
  contents: read

concurrency:
  group: sonic-recording-probe
  cancel-in-progress: true

jobs:
  probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out sound branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/editorial-sonic-system

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Discover public preview endpoints for selected CC0 recordings
        run: node scripts/probe-freesound-previews.mjs
