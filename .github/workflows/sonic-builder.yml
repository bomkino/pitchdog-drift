name: Sonic HQ recording collector

on:
  push:
    branches: [feat/editorial-sonic-system]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: sonic-hq-recordings
  cancel-in-progress: true

jobs:
  collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out sound branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/editorial-sonic-system

      - name: Download high-quality public previews from verified CC0 pages
        shell: bash
        run: |
          set -euo pipefail
          root=/tmp/sonic-hq-recordings
          mkdir -p "$root"
          cd "$root"

          download() {
            local stem="$1"
            local filename="$2"
            local hq="https://cdn.freesound.org/previews/${stem}-hq.ogg"
            local lq="https://cdn.freesound.org/previews/${stem}-lq.ogg"
            if curl --fail --location --retry 3 --silent --show-error "$hq" --output "$filename"; then
              printf '%s\t%s\n' "$filename" "$hq" >> PREVIEW_URLS.tsv
            else
              curl --fail --location --retry 3 --silent --show-error "$lq" --output "$filename"
              printf '%s\t%s\n' "$filename" "$lq" >> PREVIEW_URLS.tsv
            fi
          }

          download 100/100413_336074 100413-cloth-01.ogg
          download 555/555307_9250976 555307-jacket-movement.ogg
          download 481/481856_2524442 481856-coat-movement.ogg
          download 669/669671_14100561 669671-light-bodyfall.ogg
          download 352/352914_1766783 352914-paper-slide.ogg
          download 730/730078_15107455 730078-gentle-paper-slide.ogg
          download 382/382651_4297074 382651-page-turn.ogg
          download 164/164421_2320755 164421-paper-movement.ogg
          download 458/458569_887851 458569-35mm-projector.ogg
          download 843/843786_15096086 843786-mouse-spacebar.ogg
          download 858/858919_18964775 858919-button-click.ogg
          download 431/431818_5340249 431818-button-wheel.ogg

          sha256sum *.ogg > SHA256SUMS
          file *.ogg > FILES.txt

      - name: Upload source recordings for forensic selection
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sonic-cc0-hq-recordings
          path: /tmp/sonic-hq-recordings
          if-no-files-found: error
          retention-days: 2
