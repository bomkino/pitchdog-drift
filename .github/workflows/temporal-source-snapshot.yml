name: Temporal payload applicator

on:
  push:
    branches:
      - gauntlet/temporal-feel-direction

permissions:
  contents: write

concurrency:
  group: temporal-payload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/temporal-feel-direction
          fetch-depth: 0

      - name: Check payload readiness
        id: payload
        shell: bash
        run: |
          if [[ -f .github/temporal-payload.ready ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply verified temporal payload
        if: steps.payload.outputs.ready == 'true'
        shell: bash
        run: |
          cat .github/temporal-payload/part-* | base64 --decode > "$RUNNER_TEMP/temporal-product.tgz"
          echo "acc515bb53f63115f768b1be5075ce8c6c1370c0755cddf04416756ac7a1f32e  $RUNNER_TEMP/temporal-product.tgz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/temporal-product.tgz" -C .

          rm -rf .github/temporal-payload
          rm -f .github/temporal-payload.ready
          rm -f .github/workflows/temporal-source-snapshot.yml

          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/ci.yml
          git config user.name "pitch.dog temporal gauntlet"
          git config user.email "111725271+bomkino@users.noreply.github.com"
          git add -A
          git commit -m "feat: direct cinematic temporal feel"
          git push origin HEAD:gauntlet/temporal-feel-direction
