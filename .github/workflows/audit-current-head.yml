name: Temporary exact-head audit snapshot

on:
  push:
    branches: [gauntlet/directors-cut-optical-pipeline]

permissions:
  contents: read

concurrency:
  group: current-head-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Package exact source and locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --output=current-head-source.tgz HEAD
          tar -czf current-head-node-modules.tgz node_modules
          sha256sum current-head-source.tgz current-head-node-modules.tgz > current-head-sha256.txt

      - name: Upload exact source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-head-source
          path: |
            current-head-source.tgz
            current-head-sha256.txt
          retention-days: 2

      - name: Upload locked dependencies
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: current-head-dependencies
          path: current-head-node-modules.tgz
          retention-days: 2
