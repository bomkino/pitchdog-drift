name: Apply Director Desk chunked product pass

on:
  push:
    branches: [gauntlet/directors-cut-optical-pipeline]

permissions:
  contents: write

concurrency:
  group: apply-director-desk-chunks
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gauntlet/directors-cut-optical-pipeline
          fetch-depth: 0

      - name: Reassemble and verify the product payload
        shell: bash
        run: |
          set -euo pipefail
          cat .github/director-desk-payload/part-* > /tmp/director-desk-product.b64
          test "$(wc -c < /tmp/director-desk-product.b64)" -eq 57628
          base64 --decode /tmp/director-desk-product.b64 > /tmp/director-desk-product.tgz
          echo '11e1c29dab592fc7ecd7091c9c0abdb7d36954016c8fe95e42d27d147f3e0e3e  /tmp/director-desk-product.tgz' | sha256sum --check --strict
          tar -xzf /tmp/director-desk-product.tgz
          rm -rf .github/director-desk-payload
          rm .github/workflows/apply-director-desk-chunks.yml

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run strict product gate
        run: npm run check

      - name: Install Chromium runtime
        run: npx playwright install --with-deps chromium

      - name: Run hosted creator gauntlet
        run: npm run test:e2e

      - name: Commit the verified product pass
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A src tests e2e .github
          git commit -m 'feat: wire the Director Desk creator journey' -m "Verified by transactional gauntlet run ${GITHUB_RUN_ID}."
          git push origin HEAD:gauntlet/directors-cut-optical-pipeline

      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: director-desk-browser-failure-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove failed transport from the branch
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin gauntlet/directors-cut-optical-pipeline
          git reset --hard origin/gauntlet/directors-cut-optical-pipeline
          git rm -rf --ignore-unmatch .github/director-desk-payload .github/workflows/apply-director-desk-chunks.yml
          git commit -m "chore: remove failed Director Desk transport (run ${GITHUB_RUN_ID})"
          git push origin HEAD:gauntlet/directors-cut-optical-pipeline
